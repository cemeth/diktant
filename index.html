":"Не за что. Давай начнём на этой неделе.","zh":"不客气。我们这周就开始。","who":"А"},{"ru":"Хорошо. Мне уже легче.","zh":"好。我已经轻松点了。","who":"Б"}],"vocab":[{"ru":"грустный","zh":"难过的","pos":"形容词"},{"ru":"случиться","zh":"发生","pos":"动词（完成体）"},{"ru":"экзамен","zh":"考试","pos":"сущ."},{"ru":"тройка","zh":"莫斯科交通卡","pos":"名词（阴）"},{"ru":"сочувствовать","zh":"同情","pos":"动词（未完成体）"},{"ru":"конец света","zh":"世界末日","pos":"固定短语"}],"sec":32}]},{"id":"c6-6","title":"Ссора и примирение","titleZh":"争执与和好","level":"B1","texts":[{"id":"c6-6","kind":"text","label":"短文","sentences":[{"ru":"Мы с братом поссорились из-за мелочи.","zh":"我和弟弟因为一件小事吵了起来。"},{"ru":"Каждый думал, что прав только он.","zh":"两个人都觉得自己才是对的。"},{"ru":"Два дня мы почти не разговаривали.","zh":"两天里我们几乎不说话。"},{"ru":"Потом я понял, что молчание только всё усложняет.","zh":"后来我明白，沉默只会让事情更麻烦。"},{"ru":"Я написал ему первым и предложил поговорить.","zh":"我先给他写了消息，提议谈谈。"},{"ru":"Мы обсудили всё спокойно и быстро помирились.","zh":"我们平静地谈开，很快就和好了。"}],"vocab":[{"ru":"поссориться","zh":"吵架","pos":"глаг."},{"ru":"мелочь","zh":"小事","pos":"сущ."},{"ru":"прав","zh":"对的","pos":"прил."},{"ru":"молчание","zh":"沉默","pos":"сущ."},{"ru":"усложнять","zh":"使复杂","pos":"глаг."},{"ru":"помириться","zh":"和好","pos":"глаг."}],"sec":16},{"id":"c6-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Почему ты опять опоздал на час?","zh":"你怎么又迟到了一小时？","who":"А"},{"ru":"Извини, была пробка.","zh":"抱歉，堵车了。","who":"Б"},{"ru":"Ты всегда так говоришь.","zh":"你总这么讲。","who":"А"},{"ru":"Мне неприятно это слышать. Я не всегда опаздываю.","zh":"这话我不爱听。我不是总迟到。","who":"Б"},{"ru":"Но за последний месяц это третий раз.","zh":"可这一个月里已经第三次了。","who":"А"},{"ru":"Ты права, третий раз. Я был невнимателен.","zh":"你说得对，是第三次。是我没注意。","who":"Б"},{"ru":"Я не сержусь, но мне обидно ждать.","zh":"我没生气，但等人让我难受。","who":"А"},{"ru":"Я понимаю. В следующий раз напишу заранее.","zh":"我明白。下次我会提前写消息。","who":"Б"},{"ru":"Договорились. Мир?","zh":"说好了。和好？","who":"А"},{"ru":"Мир. Давай обнимемся.","zh":"和好。抱一个吧。","who":"Б"}],"vocab":[{"ru":"час","zh":"小时、点钟","pos":"сущ."},{"ru":"пробка","zh":"堵车","pos":"сущ."},{"ru":"неприятно","zh":"令人不快","pos":"副词/短尾"},{"ru":"опаздывать","zh":"迟到","pos":"глаг."},{"ru":"после обеда","zh":"下午","pos":"фраза"},{"ru":"права","zh":"驾照","pos":"сущ."}],"sec":29}]},{"id":"c6-7","title":"Экстренная помощь","titleZh":"紧急求助（报警、急救）","level":"B1","texts":[{"id":"c6-7","kind":"text","label":"短文","sentences":[{"ru":"Вчера на улице человеку стало плохо.","zh":"昨天街上有人身体不舒服。"},{"ru":"Прохожие остановились и вызвали скорую помощь.","zh":"路人停下来，叫了急救。"},{"ru":"Один мужчина измерил ему пульс.","zh":"一位男士给他测了脉搏。"},{"ru":"Другой принёс воды.","zh":"另一位拿来了水。"},{"ru":"Врачи приехали через восемь минут.","zh":"医生八分钟后赶到。"},{"ru":"Когда машина уехала, все немного выдохнули.","zh":"车开走后，大家都松了一口气。"}],"vocab":[{"ru":"улица","zh":"街道","pos":"сущ."},{"ru":"вызвать","zh":"呼叫","pos":"глаг."},{"ru":"скорая помощь","zh":"急救","pos":"фраза"},{"ru":"пульс","zh":"脉搏","pos":"сущ."},{"ru":"приехать","zh":"赶到","pos":"глаг."},{"ru":"выдохнуть","zh":"松口气","pos":"глаг."}],"sec":15},{"id":"c6-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Помогите! Нужна скорая!","zh":"救命！需要救护车！","who":"А"},{"ru":"Успокойтесь. Что случилось?","zh":"请冷静。发生了什么事？","who":"Б"},{"ru":"Человек упал и не дышит.","zh":"有人倒下了，没有呼吸。","who":"А"},{"ru":"Ваш адрес?","zh":"您的地址？","who":"Б"},{"ru":"Улица Ленина, дом пять, у аптеки.","zh":"列宁街五号，药店旁边。","who":"А"},{"ru":"Сколько ему лет? Он в сознании?","zh":"他多大年纪？有意识吗？","who":"Б"},{"ru":"Лет пятьдесят. Нет, без сознания.","zh":"五十岁左右。没有，无意识。","who":"А"},{"ru":"Скорая уже едет. Ваш телефон?","zh":"救护车已经在路上。您的电话？","who":"Б"},{"ru":"Восемь девятьсот один, ноль три, сорок два.","zh":"八九〇一，〇三，四二。","who":"А"},{"ru":"Ждите у входа и встречайте врачей.","zh":"在门口等着，接一下医生。","who":"Б"}],"vocab":[{"ru":"помогите","zh":"救命、请帮忙","pos":"动词（完成体）"},{"ru":"скорая","zh":"救护车","pos":"名词（阴）"},{"ru":"успокоиться","zh":"平静下来","pos":"глаг."},{"ru":"случиться","zh":"发生","pos":"动词（完成体）"},{"ru":"адрес","zh":"地址","pos":"名词（阳）"},{"ru":"улица","zh":"街道","pos":"сущ."}],"sec":29}]},{"id":"c6-8","title":"Потеря и неприятности","titleZh":"意外与丢东西","level":"B2","texts":[{"id":"c6-8","kind":"text","label":"短文","sentences":[{"ru":"В прошлую пятницу я потерял кошелёк в торговом центре.","zh":"上周五我在商场丢了钱包。"},{"ru":"В нём были карта, деньги и водительские права.","zh":"里面有银行卡、钱和驾照。"},{"ru":"Сначала я вернулся к тем местам, где был.","zh":"我先回到去过的地方找。"},{"ru":"Потом попросил охрану посмотреть записи камер.","zh":"然后请保安查看监控录像。"},{"ru":"Карту я сразу заблокировал через приложение.","zh":"我马上用手机应用把卡冻结了。"},{"ru":"Через день мне позвонили из службы находок.","zh":"过了一天，失物招领处给我打了电话。"},{"ru":"Оказалось, что кошелёк нашли и сдали охраннику.","zh":"原来是有人捡到钱包，交给了保安。"}],"vocab":[{"ru":"кошелёк","zh":"钱包","pos":"сущ."},{"ru":"права","zh":"驾照","pos":"сущ."},{"ru":"охрана","zh":"保安","pos":"сущ."},{"ru":"запись","zh":"录像","pos":"сущ."},{"ru":"заблокировать","zh":"冻结","pos":"глаг."},{"ru":"находка","zh":"失物","pos":"сущ."}],"sec":21},{"id":"c6-8d","kind":"dialog","label":"对话","sentences":[{"ru":"У меня украли сумку.","zh":"我的包被偷了。","who":"А"},{"ru":"Где это произошло?","zh":"在哪儿发生的？","who":"Б"},{"ru":"В метро, на станции «Арбатская».","zh":"在地铁「阿尔巴特站」。","who":"А"},{"ru":"Что было в сумке?","zh":"包里有什么？","who":"Б"},{"ru":"Паспорт, кошелёк и телефон.","zh":"护照、钱包和手机。","who":"А"},{"ru":"Деньги и документы отдельно?","zh":"钱和证件分开放吗？","who":"Б"},{"ru":"Нет, всё в одной сумке. Я виноват.","zh":"没有，都在一个包里。是我的错。","who":"А"},{"ru":"Пишите заявление. Нужен ваш адрес.","zh":"写报案申请。需要您的住址。","who":"Б"},{"ru":"А справку для посольства дадите?","zh":"能给大使馆用的证明吗？","who":"А"},{"ru":"Да, выдадим после регистрации заявления.","zh":"可以，登记后会给你。","who":"Б"}],"vocab":[{"ru":"сумка","zh":"包","pos":"名词（阴）"},{"ru":"произойти","zh":"发生","pos":"动词（完成体）"},{"ru":"метро","zh":"地铁","pos":"сущ."},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"кошелёк","zh":"钱包","pos":"сущ."},{"ru":"тележка","zh":"购物车","pos":"сущ."}],"sec":25}]}]},{"id":"c7","name":"分级短文","nameRu":"Тексты по уровням","desc":"从 A1 到 B2，每级十篇，篇幅越来越长、越来越难","scenes":[{"id":"c7-1","title":"Утро","titleZh":"早晨","level":"A1","texts":[{"id":"c7-1","kind":"text","label":"短文","sentences":[{"ru":"Я встаю в семь часов утра.","zh":"我早上七点起床。"},{"ru":"Сначала я принимаю душ и чищу зубы.","zh":"我先洗个淋浴，然后刷牙。"},{"ru":"Потом я завтракаю: ем кашу и пью чай.","zh":"然后我吃早饭：吃粥，喝茶。"},{"ru":"В восемь часов я выхожу из дома.","zh":"八点我出门。"},{"ru":"Я иду на работу пешком, потому что это близко.","zh":"我步行去上班，因为很近。"},{"ru":"Вечером я прихожу домой и отдыхаю.","zh":"晚上我回到家，休息一下。"}],"vocab":[{"ru":"встаю","zh":"起床","pos":"глаг."},{"ru":"душ","zh":"淋浴","pos":"сущ."},{"ru":"завтракаю","zh":"吃早饭","pos":"глаг."},{"ru":"каша","zh":"粥","pos":"сущ."},{"ru":"выхожу","zh":"出门","pos":"глаг."},{"ru":"пешком","zh":"步行","pos":"нар."}],"sec":17}]},{"id":"c7-2","title":"Моя семья","titleZh":"我的家","level":"A1","texts":[{"id":"c7-2","kind":"text","label":"短文","sentences":[{"ru":"У меня есть мама, папа и младшая сестра.","zh":"我有妈妈、爸爸和一个妹妹。"},{"ru":"Мы живём в большом городе в России.","zh":"我们住在俄罗斯的一座大城市。"},{"ru":"Мама работает в школе, она учительница.","zh":"妈妈在学校工作，她是老师。"},{"ru":"Папа работает на заводе, он инженер.","zh":"爸爸在工厂工作，他是工程师。"},{"ru":"Моя сестра ещё учится в школе.","zh":"我妹妹还在上学。"},{"ru":"Мы часто гуляем вместе в парке.","zh":"我们经常一起在公园散步。"}],"vocab":[{"ru":"младшая","zh":"年幼的","pos":"прил."},{"ru":"сестра","zh":"姐妹","pos":"сущ."},{"ru":"учительница","zh":"女教师","pos":"сущ."},{"ru":"завод","zh":"工厂","pos":"сущ."},{"ru":"инженер","zh":"工程师","pos":"сущ."},{"ru":"гуляем","zh":"散步","pos":"глаг."}],"sec":17}]},{"id":"c7-3","title":"В магазине","titleZh":"在商店","level":"A1","texts":[{"id":"c7-3","kind":"text","label":"短文","sentences":[{"ru":"Мне нужно купить хлеб, молоко и яйца.","zh":"我需要买面包、牛奶和鸡蛋。"},{"ru":"Магазин находится рядом с моим домом.","zh":"商店就在我家旁边。"},{"ru":"Продавец спрашивает: «Что вы хотите?».","zh":"售货员问：“您想要什么？”"},{"ru":"Я говорю: «Дайте, пожалуйста, хлеб и молоко».","zh":"我说：“请给我面包和牛奶。”"},{"ru":"Я плачу картой, потому что у меня нет наличных.","zh":"我刷卡付款，因为我没带现金。"},{"ru":"Дома я кладу продукты в холодильник.","zh":"回家后我把食品放进冰箱。"}],"vocab":[{"ru":"купить","zh":"买","pos":"глаг."},{"ru":"молоко","zh":"牛奶","pos":"сущ."},{"ru":"яйца","zh":"鸡蛋","pos":"сущ."},{"ru":"продавец","zh":"售货员","pos":"сущ."},{"ru":"наличные","zh":"现金","pos":"сущ."},{"ru":"холодильник","zh":"冰箱","pos":"сущ."}],"sec":19}]},{"id":"c7-4","title":"Мой город","titleZh":"我的城市","level":"A1","texts":[{"id":"c7-4","kind":"text","label":"短文","sentences":[{"ru":"Я живу в небольшом городе на юге России.","zh":"我住在俄罗斯南方的一座小城。"},{"ru":"Здесь есть река, парк и старый музей.","zh":"这里有河、公园和一座老博物馆。"},{"ru":"Летом в городе тепло и много цветов.","zh":"夏天城里很暖和，花很多。"},{"ru":"Зимой здесь часто идёт снег.","zh":"冬天这里经常下雪。"},{"ru":"Мне нравится гулять по вечерам и смотреть на реку.","zh":"我喜欢晚上散步，看看河。"},{"ru":"Мой город тихий, но очень уютный.","zh":"我的城市很安静，但非常舒适。"}],"vocab":[{"ru":"небольшой","zh":"不大的","pos":"прил."},{"ru":"река","zh":"河","pos":"сущ."},{"ru":"музей","zh":"博物馆","pos":"сущ."},{"ru":"тепло","zh":"暖和","pos":"нар."},{"ru":"снег","zh":"雪","pos":"сущ."},{"ru":"уютный","zh":"舒适的","pos":"прил."}],"sec":18}]},{"id":"c7-17","title":"Мой день рождения","titleZh":"我的生日","level":"A1","texts":[{"id":"c7-17","kind":"text","label":"短文","sentences":[{"ru":"Вчера у меня был день рождения.","zh":"昨天是我的生日。"},{"ru":"Утром мама позвонила и поздравила меня.","zh":"早上妈妈打电话来祝贺我。"},{"ru":"Вечером я пригласил друзей в кафе.","zh":"晚上我请朋友们去了咖啡馆。"},{"ru":"Мы ели торт и пили чай.","zh":"我们吃了蛋糕，喝了茶。"},{"ru":"Друзья пели песни и дарили подарки.","zh":"朋友们唱歌、送礼物。"},{"ru":"Я был очень рад и долго не спал.","zh":"我很高兴，很久没睡着。"}],"vocab":[{"ru":"день рождения","zh":"生日","pos":"сущ."},{"ru":"поздравила","zh":"祝贺了（她）","pos":"глаг."},{"ru":"пригласил","zh":"邀请了","pos":"глаг."},{"ru":"торт","zh":"蛋糕","pos":"сущ."},{"ru":"песни","zh":"歌（复数）","pos":"сущ."},{"ru":"подарки","zh":"礼物（复数）","pos":"сущ."}],"sec":15}]},{"id":"c7-18","title":"В кафе","titleZh":"在咖啡馆","level":"A1","texts":[{"id":"c7-18","kind":"text","label":"短文","sentences":[{"ru":"Я часто хожу в кафе рядом с домом.","zh":"我常去家附近的咖啡馆。"},{"ru":"Там работает мой друг Антон.","zh":"我的朋友安东在那里工作。"},{"ru":"Я заказываю кофе и бутерброд.","zh":"我点咖啡和一个三明治。"},{"ru":"Иногда я беру чай и пирожное.","zh":"有时我要茶和一块甜点。"},{"ru":"Мы немного разговариваем, когда он свободен.","zh":"他有空的时候，我们聊几句。"},{"ru":"В кафе всегда тепло и уютно.","zh":"咖啡馆里总是又暖和又舒服。"}],"vocab":[{"ru":"хожу","zh":"去（步行，常去）","pos":"глаг."},{"ru":"заказываю","zh":"点（餐）","pos":"глаг."},{"ru":"бутерброд","zh":"三明治","pos":"сущ."},{"ru":"пирожное","zh":"小甜点","pos":"сущ."},{"ru":"свободен","zh":"有空","pos":"прил."},{"ru":"уютно","zh":"舒服、温馨","pos":"нареч."}],"sec":16}]},{"id":"c7-19","title":"Наш университет","titleZh":"我们的大学","level":"A1","texts":[{"id":"c7-19","kind":"text","label":"短文","sentences":[{"ru":"Я учусь в университете в России.","zh":"我在俄罗斯的大学读书。"},{"ru":"Наш университет большой и старый.","zh":"我们学校又大又老。"},{"ru":"В нём есть библиотека и большой спортзал.","zh":"里面有图书馆和一个大体育馆。"},{"ru":"Занятия начинаются в девять часов утра.","zh":"课早上九点开始。"},{"ru":"На перемене мы пьём кофе и разговариваем.","zh":"课间我们喝咖啡、聊天。"},{"ru":"Мне очень нравится учиться здесь.","zh":"我很喜欢在这里学习。"}],"vocab":[{"ru":"учусь","zh":"学习、就读","pos":"глаг."},{"ru":"библиотека","zh":"图书馆","pos":"сущ."},{"ru":"спортзал","zh":"体育馆","pos":"сущ."},{"ru":"занятия","zh":"课（复数）","pos":"сущ."},{"ru":"перемене","zh":"课间（第六格）","pos":"сущ."},{"ru":"нравится","zh":"喜欢","pos":"глаг."}],"sec":16}]},{"id":"c7-20","title":"Домашнее животное","titleZh":"宠物","level":"A1","texts":[{"id":"c7-20","kind":"text","label":"短文","sentences":[{"ru":"У меня дома живёт серый кот.","zh":"我家里养着一只灰色的猫。"},{"ru":"Его зовут Барсик, ему два года.","zh":"它叫巴尔西克，两岁了。"},{"ru":"Он очень пушистый и немного ленивый.","zh":"它毛很蓬松，有点懒。"},{"ru":"Утром он любит играть с мячом.","zh":"早上它喜欢玩球。"},{"ru":"Вечером он спит на моём диване.","zh":"晚上它睡在我的沙发上。"},{"ru":"Я люблю своего кота.","zh":"我爱我的猫。"}],"vocab":[{"ru":"кот","zh":"公猫","pos":"сущ."},{"ru":"зовут","zh":"叫（名字）","pos":"глаг."},{"ru":"пушистый","zh":"毛蓬松的","pos":"прил."},{"ru":"играть","zh":"玩","pos":"глаг."},{"ru":"диване","zh":"沙发上（第六格）","pos":"сущ."},{"ru":"люблю","zh":"我爱","pos":"глаг."}],"sec":14}]},{"id":"c7-21","title":"Времена года","titleZh":"四季","level":"A1","texts":[{"id":"c7-21","kind":"text","label":"短文","sentences":[{"ru":"В России четыре времени года.","zh":"俄罗斯有四个季节。"},{"ru":"Зимой очень холодно и часто идёт снег.","zh":"冬天很冷，经常下雪。"},{"ru":"Весной тепло, и в парке много цветов.","zh":"春天很暖和，公园里有很多花。"},{"ru":"Летом мы купаемся в озере.","zh":"夏天我们在湖里游泳。"},{"ru":"Осенью часто идёт дождь.","zh":"秋天经常下雨。"},{"ru":"Мне нравится каждое время года.","zh":"每个季节我都喜欢。"}],"vocab":[{"ru":"зимой","zh":"在冬天","pos":"нареч."},{"ru":"весной","zh":"在春天","pos":"нареч."},{"ru":"купаемся","zh":"游泳、洗澡","pos":"глаг."},{"ru":"цветов","zh":"花（复数第二格）","pos":"сущ."},{"ru":"осенью","zh":"在秋天","pos":"нареч."},{"ru":"время","zh":"时间、季节","pos":"сущ."}],"sec":15}]},{"id":"c7-22","title":"Мой друг","titleZh":"我的朋友","level":"A1","texts":[{"id":"c7-22","kind":"text","label":"短文","sentences":[{"ru":"Моего друга зовут Дима.","zh":"我的朋友叫季马。"},{"ru":"Мы познакомились в школе пять лет назад.","zh":"我们五年前在学校认识的。"},{"ru":"Он высокий и всегда весёлый.","zh":"他个子高，总是很开心。"},{"ru":"Дима хорошо играет в футбол.","zh":"季马足球踢得很好。"},{"ru":"Мы вместе ходим в кино и гуляем в парке.","zh":"我们一起去看电影，在公园散步。"},{"ru":"Я думаю, что он настоящий друг.","zh":"我觉得他是真正的朋友。"}],"vocab":[{"ru":"друга","zh":"朋友（第四格）","pos":"сущ."},{"ru":"познакомились","zh":"认识了","pos":"глаг."},{"ru":"весёлый","zh":"快乐的","pos":"прил."},{"ru":"футбол","zh":"足球","pos":"сущ."},{"ru":"гуляем","zh":"散步","pos":"глаг."},{"ru":"настоящий","zh":"真正的","pos":"прил."}],"sec":16}]},{"id":"c7-5","title":"Выходные на даче","titleZh":"别墅周末","level":"A2","texts":[{"id":"c7-5","kind":"text","label":"短文","sentences":[{"ru":"В прошлую субботу мы поехали на дачу к бабушке.","zh":"上周六我们去了奶奶的别墅。"},{"ru":"Дорога была долгой, больше двух часов.","zh":"路很长，走了两个多小时。"},{"ru":"Погода была хорошая, и мы всё время были на улице.","zh":"天气很好，我们一直都在外面。"},{"ru":"Утром я помогал дедушке в саду.","zh":"早上我帮爷爷在园子里干活。"},{"ru":"Потом бабушка приготовила обед, и мы ели суп и пирог.","zh":"然后奶奶做了午饭，我们喝汤、吃馅饼。"},{"ru":"После обеда мы пили чай и разговаривали о жизни.","zh":"午饭后我们喝茶，聊生活。"},{"ru":"Вечером стало холодно, поэтому мы вернулись домой.","zh":"晚上变冷了，所以我们回了家。"},{"ru":"Эти выходные были простыми, но очень хорошими.","zh":"这个周末很普通，但非常好。"}],"vocab":[{"ru":"дача","zh":"别墅","pos":"сущ."},{"ru":"дорога","zh":"路","pos":"сущ."},{"ru":"помогал","zh":"帮忙","pos":"глаг."},{"ru":"сад","zh":"园子","pos":"сущ."},{"ru":"приготовила","zh":"做好了","pos":"глаг."},{"ru":"вернулись","zh":"返回","pos":"глаг."}],"sec":25}]},{"id":"c7-6","title":"Новая работа","titleZh":"新工作","level":"A2","texts":[{"id":"c7-6","kind":"text","label":"短文","sentences":[{"ru":"Два месяца назад я начал работать в новой фирме.","zh":"两个月前我开始在一家新公司工作。"},{"ru":"Сначала я очень волновался, потому что не всех знал.","zh":"起初我很紧张，因为不是所有人都认识。"},{"ru":"Мои коллеги оказались добрыми и весёлыми.","zh":"我的同事们原来都很善良、愉快。"},{"ru":"Каждый день мы обедаем вместе в небольшом кафе.","zh":"我们每天一起在一家小咖啡馆吃午饭。"},{"ru":"Работа не очень трудная, но нужно много читать.","zh":"工作不太难，但要读很多东西。"},{"ru":"Иногда я остаюсь позже, чтобы закончить проект.","zh":"有时我留得晚一些，把项目做完。"},{"ru":"Мне нравится моя новая работа, хотя она забирает много времени.","zh":"我喜欢新工作，尽管它占了很多时间。"},{"ru":"Через год я хочу получить повышение.","zh":"一年后我想升职。"}],"vocab":[{"ru":"фирма","zh":"公司","pos":"сущ."},{"ru":"волновался","zh":"紧张","pos":"глаг."},{"ru":"коллеги","zh":"同事","pos":"сущ."},{"ru":"обедаем","zh":"吃午饭","pos":"глаг."},{"ru":"проект","zh":"项目","pos":"сущ."},{"ru":"повышение","zh":"升职","pos":"сущ."}],"sec":26}]},{"id":"c7-7","title":"Поездка в Москву","titleZh":"去莫斯科","level":"A2","texts":[{"id":"c7-7","kind":"text","label":"短文","sentences":[{"ru":"В первый раз я приехал в Москву три года назад.","zh":"我第一次到莫斯科是三年前。"},{"ru":"Москва оказалась огромной и очень шумной.","zh":"莫斯科非常大，也非常吵。"},{"ru":"Я купил карту и пошёл пешком по центру.","zh":"我买了一张地图，在市中心步行。"},{"ru":"Я видел Красную площадь, Кремль и метро.","zh":"我看到了红场、克里姆林宫和地铁。"},{"ru":"В метро было очень много людей, и я немного испугался.","zh":"地铁里人很多，我有点害怕。"},{"ru":"Потом я гулял по Арбату и покупал подарки.","zh":"然后我在阿尔巴特街散步，买礼物。"},{"ru":"Москва дорогая, но интересная.","zh":"莫斯科很贵，但很有趣。"},{"ru":"Я хочу приехать туда ещё раз, потому что не всё успел увидеть.","zh":"我想再去一次，因为没来得及看完。"}],"vocab":[{"ru":"приехал","zh":"到达","pos":"глаг."},{"ru":"огромной","zh":"巨大的","pos":"прил."},{"ru":"карта","zh":"地图","pos":"сущ."},{"ru":"испугался","zh":"害怕了","pos":"глаг."},{"ru":"метро","zh":"地铁","pos":"сущ."},{"ru":"подарки","zh":"礼物","pos":"сущ."}],"sec":25}]},{"id":"c7-8","title":"Русская зима","titleZh":"俄罗斯的冬天","level":"A2","texts":[{"id":"c7-8","kind":"text","label":"短文","sentences":[{"ru":"Зима в России длинная и очень холодная.","zh":"俄罗斯的冬天很长，也非常冷。"},{"ru":"В декабре уже лежит снег, а днём темно.","zh":"十二月已经有雪了，白天很暗。"},{"ru":"Я купил тёплую одежду, шапку и сапоги.","zh":"我买了厚衣服、帽子和靴子。"},{"ru":"Утром я долго чищу дорожку от снега.","zh":"早上我要花很久铲路上的雪。"},{"ru":"Иногда мы с друзьями катаемся на санках.","zh":"有时我和朋友们滑雪橇。"},{"ru":"Дома я обычно пью горячий чай.","zh":"在家我通常喝热茶。"},{"ru":"Когда очень холодно, я не выхожу без шапки.","zh":"特别冷的时候，我不戴帽子就不出门。"},{"ru":"Но мне нравится зима, потому что она красивая.","zh":"但我喜欢冬天，因为它很美。"}],"vocab":[{"ru":"зима","zh":"冬天","pos":"сущ."},{"ru":"холодная","zh":"寒冷的","pos":"прил."},{"ru":"одежда","zh":"衣服","pos":"сущ."},{"ru":"шапка","zh":"帽子","pos":"сущ."},{"ru":"санках","zh":"雪橇","pos":"сущ."},{"ru":"горячий","zh":"热的","pos":"прил."}],"sec":23}]},{"id":"c7-23","title":"Поездка на море","titleZh":"去海边","level":"A2","texts":[{"id":"c7-23","kind":"text","label":"短文","sentences":[{"ru":"Два года назад я первый раз поехал на море.","zh":"两年前我第一次去了海边。"},{"ru":"Я ехал туда на поезде почти двое суток.","zh":"我坐火车去那里，坐了将近两天。"},{"ru":"Погода была хорошая, но вода казалась прохладной.","zh":"天气很好，但水感觉凉。"},{"ru":"Мы жили в маленьком отеле у самого пляжа.","zh":"我们住在紧挨着海滩的一家小旅馆。"},{"ru":"Утром я долго плавал, а потом читал книгу на песке.","zh":"早上我游了很久，然后在沙滩上看书。"},{"ru":"Каждый вечер мы ели рыбу и смотрели на закат.","zh":"每天傍晚我们吃鱼、看日落。"},{"ru":"Однажды мы взяли лодку и поехали к острову.","zh":"有一次我们租了条船，去了一个小岛。"},{"ru":"Эта поездка до сих пор кажется мне лучшим летом.","zh":"那次旅行至今仍是我记忆里最好的夏天。"}],"vocab":[{"ru":"поехал","zh":"去了（乘车）","pos":"глаг."},{"ru":"суток","zh":"昼夜（复数第二格）","pos":"сущ."},{"ru":"прохладной","zh":"凉的","pos":"прил."},{"ru":"отеле","zh":"旅馆里（第六格）","pos":"сущ."},{"ru":"плавал","zh":"游泳了","pos":"глаг."},{"ru":"закат","zh":"日落","pos":"сущ."}],"sec":25}]},{"id":"c7-24","title":"Как я готовлю обед","titleZh":"我怎么做午饭","level":"A2","texts":[{"id":"c7-24","kind":"text","label":"短文","sentences":[{"ru":"По воскресеньям я сам готовлю обед дома.","zh":"星期天我自己在家做午饭。"},{"ru":"Сначала я смотрю в холодильник и думаю, что можно приготовить.","zh":"我先看看冰箱，想想能做什么。"},{"ru":"Обычно я делаю суп, салат и что-нибудь горячее.","zh":"通常我做汤、沙拉和一个热菜。"},{"ru":"Я люблю готовить с музыкой, но часто забываю о времени.","zh":"我喜欢边听音乐边做饭，但常常忘了时间。"},{"ru":"Один раз суп почти убежал, потому что я не смотрел.","zh":"有一次汤差点溢出来，因为我没有看着。"},{"ru":"Теперь я ставлю таймер, чтобы не испортить еду.","zh":"现在我会设闹钟，免得把菜做坏。"},{"ru":"Мои друзья говорят, что я готовлю лучше, чем в кафе.","zh":"我朋友说我做得比咖啡馆还好。"},{"ru":"Мне очень приятно, когда люди хвалят мою еду.","zh":"听到别人夸我做的饭，我很开心。"}],"vocab":[{"ru":"готовлю","zh":"做饭","pos":"глаг."},{"ru":"холодильник","zh":"冰箱","pos":"сущ."},{"ru":"приготовить","zh":"做好（饭）","pos":"глаг."},{"ru":"таймер","zh":"计时器","pos":"сущ."},{"ru":"испортить","zh":"弄坏","pos":"глаг."},{"ru":"хвалят","zh":"夸奖","pos":"глаг."}],"sec":28}]},{"id":"c7-25","title":"Спорт и здоровье","titleZh":"运动与健康","level":"A2","texts":[{"id":"c7-25","kind":"text","label":"短文","sentences":[{"ru":"Раньше я почти не занимался спортом.","zh":"以前我几乎不运动。"},{"ru":"Утром я ездил на машине и мало гулял.","zh":"早上我开车出门，很少走路。"},{"ru":"Потом врач сказал, что мне нужно больше двигаться.","zh":"后来医生说我得多活动。"},{"ru":"Сначала было трудно, и я хотел всё бросить.","zh":"一开始很难，我想过放弃。"},{"ru":"Я начал бегать по утрам только по десять минут.","zh":"我开始每天早上只跑十分钟。"},{"ru":"Через месяц я уже мог бежать полчаса без остановки.","zh":"一个月后我已经能不停地跑半小时。"},{"ru":"Теперь я сплю лучше и почти не болею.","zh":"现在睡得更好，几乎不生病。"},{"ru":"Спорт не решает все проблемы, но очень помогает.","zh":"运动不能解决所有问题，但很有帮助。"}],"vocab":[{"ru":"занимался","zh":"从事、练（过去时）","pos":"глаг."},{"ru":"двигаться","zh":"活动、运动","pos":"глаг."},{"ru":"бросить","zh":"放弃、扔下","pos":"глаг."},{"ru":"бегать","zh":"跑步","pos":"глаг."},{"ru":"остановки","zh":"停顿（第二格）","pos":"сущ."},{"ru":"болею","zh":"生病","pos":"глаг."}],"sec":24}]},{"id":"c7-26","title":"В поликлинике","titleZh":"在诊室","level":"A2","texts":[{"id":"c7-26","kind":"text","label":"短文","sentences":[{"ru":"Вчера вечером у меня сильно болела голова.","zh":"昨天晚上我头疼得厉害。"},{"ru":"Утром я позвонил в поликлинику и записался к врачу.","zh":"早上我给诊室打电话，挂了号。"},{"ru":"Врач спросил, как давно я так себя чувствую.","zh":"医生问我这样多久了。"},{"ru":"Он послушал меня и измерил давление.","zh":"他听了听我的胸口，量了血压。"},{"ru":"Потом он выписал рецепт и сказал, что нужно отдыхать.","zh":"然后他开了药方，说我需要休息。"},{"ru":"В аптеке я купил лекарство и сразу выпил таблетку.","zh":"我在药店买了药，立刻吃了一片。"},{"ru":"Вечером я лёг рано и долго спал.","zh":"晚上我很早就躺下，睡了很久。"},{"ru":"Сегодня я чувствую себя уже лучше.","zh":"今天我已经感觉好多了。"}],"vocab":[{"ru":"поликлинику","zh":"社区诊所（第四格）","pos":"сущ."},{"ru":"записался","zh":"预约、挂号","pos":"глаг."},{"ru":"измерил","zh":"测量了","pos":"глаг."},{"ru":"давление","zh":"血压","pos":"сущ."},{"ru":"рецепт","zh":"药方","pos":"сущ."},{"ru":"таблетку","zh":"药片（第四格）","pos":"сущ."}],"sec":24}]},{"id":"c7-27","title":"Покупка телефона","titleZh":"买手机","level":"A2","texts":[{"id":"c7-27","kind":"text","label":"短文","sentences":[{"ru":"Мой старый телефон работал очень медленно.","zh":"我的旧手机运行得很慢。"},{"ru":"Поэтому я решил купить новый телефон.","zh":"所以我决定买一部新手机。"},{"ru":"Я долго сравнивал цены в больших магазинах.","zh":"我花了很久比较大商店里的价格。"},{"ru":"В одном магазине продавец показал мне три модели.","zh":"在一家店里，售货员给我看了三个型号。"},{"ru":"Он объяснил, чем они отличаются, и не спешил.","zh":"他解释了它们的不同，一点也不着急。"},{"ru":"Я выбрал средний вариант, потому что он не слишком дорогой.","zh":"我选了中间那款，因为它不太贵。"},{"ru":"Продавец помог перенести фотографии со старого телефона.","zh":"售货员帮我把照片从旧手机倒了过来。"},{"ru":"Теперь я понимаю, что хороший совет очень важен.","zh":"现在我明白，好的建议很重要。"}],"vocab":[{"ru":"сравнивал","zh":"比较了","pos":"глаг."},{"ru":"продавец","zh":"售货员","pos":"сущ."},{"ru":"отличаются","zh":"有区别","pos":"глаг."},{"ru":"выбрал","zh":"挑选了","pos":"глаг."},{"ru":"перенести","zh":"转移、搬运","pos":"глаг."},{"ru":"дорогой","zh":"贵的","pos":"прил."}],"sec":26}]},{"id":"c7-28","title":"Праздник в общежитии","titleZh":"宿舍里的节日","level":"A2","texts":[{"id":"c7-28","kind":"text","label":"短文","sentences":[{"ru":"В декабре в нашем общежитии решили устроить праздник.","zh":"十二月，我们宿舍决定办个聚会。"},{"ru":"Каждый студент должен был приготовить одно блюдо.","zh":"每个学生都要做一道菜。"},{"ru":"Китайские студенты делали пельмени, а русские готовили пирог.","zh":"中国学生做饺子，俄罗斯学生烤馅饼。"},{"ru":"Стол получился очень длинным и красивым.","zh":"桌子摆得很长、很好看。"},{"ru":"Мы рассказывали, как встречают Новый год у нас дома.","zh":"我们讲各自家里怎么过新年。"},{"ru":"Потом мы играли в игры и пели песни.","zh":"然后我们玩游戏、唱歌。"},{"ru":"Один студент из Африки показал смешной танец.","zh":"一个来自非洲的同学跳了支有趣的舞。"},{"ru":"Мы разошлись поздно, но утром все были в хорошем настроении.","zh":"我们很晚才散，但早上大家心情都很好。"}],"vocab":[{"ru":"общежитии","zh":"宿舍（第六格）","pos":"сущ."},{"ru":"устроить","zh":"举办、安排","pos":"глаг."},{"ru":"блюдо","zh":"一道菜","pos":"сущ."},{"ru":"пельмени","zh":"饺子（复数）","pos":"сущ."},{"ru":"разошлись","zh":"散了（各自离开）","pos":"глаг."},{"ru":"настроении","zh":"心情（第六格）","pos":"сущ."}],"sec":27}]},{"id":"c7-9","title":"Как я начал учить русский","titleZh":"我怎样开始学俄语","level":"B1","texts":[{"id":"c7-9","kind":"text","label":"短文","sentences":[{"ru":"Когда я был школьником, я думал, что языки — это скучно.","zh":"我上中学的时候，觉得学语言很无聊。"},{"ru":"Всё изменилось после того, как я случайно посмотрел русский фильм.","zh":"在我偶然看了一部俄罗斯电影之后，一切都变了。"},{"ru":"Я не понимал почти ничего, но голос и музыка мне очень понравились.","zh":"我几乎什么都听不懂，但我很喜欢里面的声音和音乐。"},{"ru":"Сначала я просто выписывал слова в тетрадь и повторял их дома.","zh":"起初我只是把单词抄在本子上，在家反复念。"},{"ru":"Через месяц я нашёл группу для начинающих и записался туда.","zh":"一个月后我找到了初级班，就报了名。"},{"ru":"Первые занятия казались мне очень трудными, особенно падежи.","zh":"最初几节课我觉得很难，尤其是格。"},{"ru":"Учительница часто говорила: «Не бойтесь ошибаться!».","zh":"老师常说：“不要怕出错！”"},{"ru":"Я начал смотреть простые видео и слушать короткие подкасты.","zh":"我开始看简单的视频，听很短的播客。"},{"ru":"Конечно, я всё ещё делаю ошибки, но уже могу объясняться.","zh":"当然我还会出错，但已经能表达自己了。"},{"ru":"Самое важное — заниматься каждый день, хотя бы десять минут.","zh":"最重要的是每天学，哪怕十分钟。"},{"ru":"Теперь я понимаю, что язык учится медленно, но не останавливается.","zh":"现在我明白，语言是慢慢学会的，但不会白学。"},{"ru":"Если вы только начинаете, не сравнивайте себя с другими.","zh":"如果你刚开始学，不要拿自己和别人比。"}],"vocab":[{"ru":"школьником","zh":"中学生","pos":"сущ."},{"ru":"скучно","zh":"无聊","pos":"нар."},{"ru":"тетрадь","zh":"本子","pos":"сущ."},{"ru":"падежи","zh":"格","pos":"сущ."},{"ru":"ошибаться","zh":"犯错","pos":"глаг."},{"ru":"подкасты","zh":"播客","pos":"сущ."}],"sec":45}]},{"id":"c7-10","title":"Первая неделя в Петербурге","titleZh":"在彼得堡的第一周","level":"B1","texts":[{"id":"c7-10","kind":"text","label":"短文","sentences":[{"ru":"Когда я прилетел в Петербург, шёл дождь, и город показался мне серым.","zh":"我飞到彼得堡时正下着雨，城市在我看来一片灰暗。"},{"ru":"В аэропорту я взял такси, потому что не знал, как доехать.","zh":"在机场我打了车，因为不知道该怎么走。"},{"ru":"Машина ехала медленно, и водитель рассказывал мне о городе.","zh":"车开得很慢，司机一路给我讲这座城市。"},{"ru":"Отель оказался маленьким, но чистым, и это меня обрадовало.","zh":"酒店很小，但很干净，这让我很高兴。"},{"ru":"Утром я пошёл по Невскому проспекту без карты.","zh":"第二天早上我没带地图，沿着涅瓦大街走。"},{"ru":"Я заблудился дважды, но каждый раз находил что-то интересное.","zh":"我迷路了两次，但每次都发现了有趣的东西。"},{"ru":"В кафе я заказал чай и пирог, но забыл, как сказать «счёт».","zh":"在咖啡馆我点了茶和馅饼，却忘了「结账」怎么说。"},{"ru":"Официантка улыбнулась и сама принесла мне счёт.","zh":"女服务员笑了笑，自己把账单拿给了我。"},{"ru":"На второй день я понял, что лучше спрашивать дорогу у людей, а не у карты.","zh":"第二天我明白，问路最好问人，而不是问地图。"},{"ru":"Вечером я стоял на мосту и смотрел на воду, и мне было спокойно.","zh":"晚上我站在桥上看着水，心里很平静。"},{"ru":"К концу недели я уже любил этот город, несмотря на дождь и ветер.","zh":"到周末我已经爱上了这座城市，尽管有雨有风。"},{"ru":"Теперь я понимаю, что первая неделя всегда самая трудная и самая важная.","zh":"现在我明白，第一周总是最难，也最重要。"}],"vocab":[{"ru":"прилетел","zh":"飞抵","pos":"глаг."},{"ru":"такси","zh":"出租车","pos":"сущ."},{"ru":"водитель","zh":"司机","pos":"сущ."},{"ru":"заблудился","zh":"迷路了","pos":"глаг."},{"ru":"счёт","zh":"账单","pos":"сущ."},{"ru":"официантка","zh":"女服务员","pos":"сущ."}],"sec":47}]},{"id":"c7-11","title":"Почему я люблю поезда","titleZh":"我为什么喜欢火车","level":"B1","texts":[{"id":"c7-11","kind":"text","label":"短文","sentences":[{"ru":"Многие мои друзья летают самолётом, потому что это быстрее.","zh":"我很多朋友都坐飞机，因为那样更快。"},{"ru":"Но я почти всегда выбираю поезд, если есть такая возможность.","zh":"但只要有条件，我几乎总是选火车。"},{"ru":"В поезде можно сидеть у окна, пить чай и просто смотреть на поля и леса.","zh":"在火车上可以靠窗坐着，喝茶，就那样看着田野和森林。"},{"ru":"Никто не требует, чтобы ты выключил телефон или сидел ровно.","zh":"没有人要求你关掉手机，或者坐得笔直。"},{"ru":"Я часто беру с собой книгу, но почти никогда её не открываю.","zh":"我常随身带一本书，但几乎从不打开。"},{"ru":"Дорога даёт мне редкое чувство: мне не нужно никуда спешить.","zh":"路上给我一种难得的感觉：我不必赶去哪里。"},{"ru":"Иногда в поезде начинаешь разговаривать с незнакомыми людьми.","zh":"有时在火车上你会和陌生人聊起来。"},{"ru":"Однажды пожилая женщина угостила меня пирожками и рассказала о своей молодости.","zh":"有一次一位老太太请我吃小馅饼，还讲了她年轻时候的事。"},{"ru":"В самолёте такое почти невозможно, потому что все сидят молча.","zh":"在飞机上这几乎不可能，因为大家都沉默地坐着。"},{"ru":"Конечно, поезд идёт долго, и иногда он опаздывает.","zh":"当然，火车开得慢，有时还会晚点。"},{"ru":"Но время в дороге — это не потерянное время, а часть путешествия.","zh":"但路上的时间不是浪费掉的时间，而是旅行的一部分。"},{"ru":"Поэтому я всегда радуюсь, когда вижу на билете слово «поезд».","zh":"所以每次在车票上看到「火车」这个词，我都会高兴。"}],"vocab":[{"ru":"поезд","zh":"火车","pos":"сущ."},{"ru":"окно","zh":"窗户","pos":"сущ."},{"ru":"спешить","zh":"赶时间","pos":"глаг."},{"ru":"незнакомыми","zh":"陌生的","pos":"прил."},{"ru":"опаздывает","zh":"晚点","pos":"глаг."},{"ru":"путешествия","zh":"旅行","pos":"сущ."}],"sec":48}]},{"id":"c7-12","title":"Разговор в кафе","titleZh":"咖啡馆里的谈话","level":"B1","texts":[{"id":"c7-12","kind":"text","label":"短文","sentences":[{"ru":"Вчера после работы мы с Анной зашли в маленькое кафе на углу.","zh":"昨天下了班，我和安娜进了街角的一家小咖啡馆。"},{"ru":"Кафе было почти пустым: только официант и пожилой мужчина у окна.","zh":"咖啡馆里几乎没人：只有一名服务员和窗边一位上了年纪的男人。"},{"ru":"Анна заказала кофе и спросила, как у меня дела.","zh":"安娜点了咖啡，问我最近怎么样。"},{"ru":"Я ответил, что устал, но не хотел об этом говорить.","zh":"我回答说我很累，但不想谈这件事。"},{"ru":"Тогда Анна сказала: «Знаешь, я тоже не всегда всё успеваю».","zh":"于是安娜说：“你知道吗，我也不是总能把所有事都做完。”"},{"ru":"Мы начали говорить о работе, о времени и о том, как трудно отдыхать.","zh":"我们开始聊工作、聊时间，也聊休息有多难。"},{"ru":"Она рассказала, что в прошлом году почти не спала и часто болела.","zh":"她讲去年她几乎不睡觉，还经常生病。"},{"ru":"Я удивился, потому что со стороны она всегда казалась спокойной.","zh":"我很惊讶，因为从外表看，她一直显得很从容。"},{"ru":"«Просто я научилась улыбаться, даже когда очень устала», — объяснила она.","zh":"“只是我学会了在很累的时候也微笑，”她解释道。"},{"ru":"Мы сидели долго, пока официант не начал убирать стулья.","zh":"我们坐了很久，直到服务员开始收椅子。"},{"ru":"Выйдя на улицу, я почувствовал, что мне стало легче.","zh":"走到街上，我感到心里轻松了些。"},{"ru":"Иногда самый обычный разговор помогает больше, чем любые советы.","zh":"有时最普通的一次谈话，比任何建议都更有用。"}],"vocab":[{"ru":"устал","zh":"累了","pos":"глаг."},{"ru":"официант","zh":"服务员","pos":"сущ."},{"ru":"болела","zh":"生病","pos":"глаг."},{"ru":"спокойной","zh":"平静的","pos":"прил."},{"ru":"улыбаться","zh":"微笑","pos":"глаг."},{"ru":"советы","zh":"建议","pos":"сущ."}],"sec":46}]},{"id":"c7-29","title":"Первый снег","titleZh":"初雪","level":"B1","texts":[{"id":"c7-29","kind":"text","label":"短文","sentences":[{"ru":"В этом году первый снег выпал в середине октября, что для Москвы довольно рано.","zh":"今年第一场雪在十月中旬就落了，对莫斯科来说相当早。"},{"ru":"Я шёл из университета и вдруг заметил, что всё вокруг стало белым.","zh":"我从学校走出来，忽然发现周围全白了。"},{"ru":"Сначала это было красиво: деревья, крыши и машины покрылись тонким слоем снега.","zh":"起初很好看：树、屋顶和汽车都盖上了一层薄雪。"},{"ru":"Но через час дороги стали скользкими, и люди шли медленнее.","zh":"但一小时后路变滑了，行人走得更慢。"},{"ru":"По дороге я встретил соседку, которая несла тяжёлую сумку.","zh":"路上我遇到邻居阿姨，她提着很重的袋子。"},{"ru":"Я помог ей донести продукты до подъезда, и она долго благодарила меня.","zh":"我帮她把东西提到楼道口，她谢了我很久。"},{"ru":"Она сказала, что в её детстве зимы были намного холоднее.","zh":"她说她小时候冬天冷得多。"},{"ru":"Дома я долго смотрел в окно и вспоминал свою страну.","zh":"回到家我望着窗外，想起自己的国家。"},{"ru":"Там почти не бывает снега, поэтому октябрьский снег кажется мне чудом.","zh":"那里几乎不下雪，所以十月的雪在我看来像个奇迹。"},{"ru":"Я достал тёплые перчатки и понял, что зима уже началась.","zh":"我拿出保暖手套，明白冬天已经来了。"},{"ru":"Вечером я написал маме, что здесь выпал снег и я здоров.","zh":"晚上我给妈妈发消息，说这里下雪了，我很好。"},{"ru":"Она ответила фотографией, где у нас во дворе всё ещё цветут цветы.","zh":"她回了一张照片，照片里我们院子里的花还开着。"}],"vocab":[{"ru":"выпал","zh":"（雪）落下","pos":"глаг."},{"ru":"заметил","zh":"注意到","pos":"глаг."},{"ru":"покрылись","zh":"覆盖上了","pos":"глаг."},{"ru":"скользкими","zh":"滑的（复数第五格）","pos":"прил."},{"ru":"благодарила","zh":"感谢了（她）","pos":"глаг."},{"ru":"перчатки","zh":"手套（复数）","pos":"сущ."}],"sec":49}]},{"id":"c7-30","title":"Как я потерял телефон","titleZh":"我把手机丢了","level":"B1","texts":[{"id":"c7-30","kind":"text","label":"短文","sentences":[{"ru":"В прошлую пятницу я потерял свой телефон, и это оказалось серьёзнее, чем я думал.","zh":"上周五我丢了手机，事情比我以为的严重。"},{"ru":"Утром я ехал в метро, слушал музыку и вышел на нужной станции.","zh":"早上我坐地铁，听着音乐，在要下的站下了车。"},{"ru":"Потом я хотел проверить сообщение и вдруг понял, что телефона в кармане нет.","zh":"后来我想看消息，忽然发现口袋里没有手机。"},{"ru":"Сначала я не испугался: подумал, что оставил его дома.","zh":"起初我没害怕，以为落在家里了。"},{"ru":"Но дома телефона тоже не было, и я начал волноваться.","zh":"可家里也没有，我开始着急。"},{"ru":"На телефоне были все мои фотографии, контакты и билеты.","zh":"手机里有我所有的照片、联系人和车票。"},{"ru":"Я вернулся в метро и спросил в комнате находок, но там было пусто.","zh":"我回到地铁，去失物招领处问，可那里什么都没有。"},{"ru":"Знакомый посоветовал мне закрыть все приложения с телефона через компьютер.","zh":"一个熟人建议我用电脑把手机上的应用都锁掉。"},{"ru":"Это было неприятно, но я сделал это сразу, чтобы не потерять деньги.","zh":"这不太舒服，但我立刻做了，免得丢钱。"},{"ru":"Через два дня мне позвонили из полиции и сказали, что телефон нашёлся.","zh":"两天后警察打电话来，说手机找到了。"},{"ru":"Его нашёл охранник на эскалаторе и принёс в участок.","zh":"是一名保安在扶梯上捡到，送到了派出所。"},{"ru":"С тех пор я всегда проверяю карманы, прежде чем выйти из вагона.","zh":"从那以后我下车前总要摸摸口袋。"}],"vocab":[{"ru":"потерял","zh":"丢失了","pos":"глаг."},{"ru":"испугался","zh":"害怕了","pos":"глаг."},{"ru":"волноваться","zh":"着急、担心","pos":"глаг."},{"ru":"находок","zh":"失物（复数第二格）","pos":"сущ."},{"ru":"охранник","zh":"保安","pos":"сущ."},{"ru":"эскалаторе","zh":"扶梯上（第六格）","pos":"сущ."}],"sec":48}]},{"id":"c7-31","title":"Русская баня","titleZh":"俄式澡堂","level":"B1","texts":[{"id":"c7-31","kind":"text","label":"短文","sentences":[{"ru":"Мой друг долго уговаривал меня сходить в настоящую русскую баню.","zh":"朋友劝了我很久，要我跟他去一次真正的俄式澡堂。"},{"ru":"Я согласился, хотя честно говоря боялся, что будет слишком жарко.","zh":"我答应了，虽然说实话我怕太热。"},{"ru":"Внутри стоял густой пар, и люди сидели на деревянных полках.","zh":"里面全是浓雾般的蒸汽，人们坐在木架上。"},{"ru":"Мне дали шапку и веник из берёзовых веток.","zh":"他们给了我帽子和一把白桦树枝的浴帚。"},{"ru":"Сначала я сидел на нижней полке, потому что там прохладнее.","zh":"一开始我坐在最下层，因为那里凉快些。"},{"ru":"Потом мы вышли на улицу и прыгнули в холодную воду.","zh":"后来我们走到外面，跳进冷水里。"},{"ru":"Это было страшно, но после бани я почувствовал себя новым человеком.","zh":"有点吓人，但洗完澡我觉得自己像换了个人。"},{"ru":"Русские ходят в баню не только чтобы помыться, но и чтобы поговорить.","zh":"俄罗斯人去澡堂不光是为了洗澡，也是为了聊天。"},{"ru":"За чаем мой друг рассказал, что ходит сюда с отцом с детства.","zh":"喝茶时朋友说，他从小就跟着爸爸来这里。"},{"ru":"Я понял, что баня — это важная часть их культуры.","zh":"我明白了，澡堂是他们文化里重要的一部分。"},{"ru":"Теперь я хочу сходить туда ещё раз, но не каждую неделю.","zh":"现在我还想再去，但不是每个星期。"},{"ru":"Если вы живёте в России, попробуйте баню хотя бы один раз.","zh":"如果你住在俄罗斯，至少去试一次澡堂。"}],"vocab":[{"ru":"уговаривал","zh":"劝说（过去时）","pos":"глаг."},{"ru":"согласился","zh":"同意了","pos":"глаг."},{"ru":"полках","zh":"木架（复数第六格）","pos":"сущ."},{"ru":"веник","zh":"浴帚","pos":"сущ."},{"ru":"берёзовых","zh":"白桦的（复数第二格）","pos":"прил."},{"ru":"культуры","zh":"文化（第二格）","pos":"сущ."}],"sec":44}]},{"id":"c7-32","title":"Письмо маме","titleZh":"给妈妈的信","level":"B1","texts":[{"id":"c7-32","kind":"text","label":"短文","sentences":[{"ru":"Дорогая мама, я пишу тебе поздно вечером, когда в общежитии уже тихо.","zh":"亲爱的妈妈，我在深夜给你写信，这时宿舍已经安静了。"},{"ru":"У меня всё хорошо: я много занимаюсь и постепенно привыкаю к новым правилам.","zh":"我一切都好：我学得很多，也慢慢习惯了新规矩。"},{"ru":"Русский язык всё ещё трудный, но я уже понимаю лекции лучше, чем месяц назад.","zh":"俄语还是很难，但我听讲座已经比一个月前懂得多了。"},{"ru":"Иногда я делаю глупые ошибки, а потом сам над ними смеюсь.","zh":"有时我会犯很傻的错，过后自己都觉得好笑。"},{"ru":"Вчера я первый раз сам приготовил настоящий русский суп.","zh":"昨天我第一次自己做了一锅真正的俄式汤。"},{"ru":"Получилось не очень красиво, но мои соседи сказали, что вкусно.","zh":"样子不太好看，但邻居们说很好吃。"},{"ru":"Погода здесь уже холодная, и я каждый день ношу тёплую куртку.","zh":"这里天气已经冷了，我每天都穿厚外套。"},{"ru":"Не волнуйся обо мне, я ем хорошо и сплю достаточно.","zh":"别为我担心，我吃得不错，睡得也够。"},{"ru":"Мне очень не хватает твоего голоса и наших семейных ужинов.","zh":"我很想念你的声音，还有我们家的晚饭。"},{"ru":"Но я знаю, что приехал сюда не зря.","zh":"但我知道，我到这里来没有白来。"},{"ru":"Когда станет теплее, я хочу показать тебе фотографии нашего университета.","zh":"等天气暖和些，我想给你看我们学校的照片。"},{"ru":"Я тебя крепко обнимаю и скоро напишу снова.","zh":"我紧紧地拥抱你，很快再写。"}],"vocab":[{"ru":"поздно","zh":"很晚","pos":"нареч."},{"ru":"привыкаю","zh":"逐渐习惯","pos":"глаг."},{"ru":"лекции","zh":"讲座（复数）","pos":"сущ."},{"ru":"соседи","zh":"邻居（复数）","pos":"сущ."},{"ru":"волнуйся","zh":"担心（命令式）","pos":"глаг."},{"ru":"обнимаю","zh":"拥抱","pos":"глаг."}],"sec":46}]},{"id":"c7-33","title":"Что читают русские","titleZh":"俄罗斯人读什么","level":"B1","texts":[{"id":"c7-33","kind":"text","label":"短文","sentences":[{"ru":"Когда я только приехал в Россию, я думал, что все здесь читают только классиков.","zh":"我刚到俄罗斯时，以为这里人人只读经典作家。"},{"ru":"Конечно, Пушкин и Толстой важны, но современная жизнь выглядит иначе.","zh":"当然，普希金和托尔斯泰很重要，但现代生活是另一个样子。"},{"ru":"В метро я вижу людей с телефонами и электронными книгами.","zh":"在地铁里我看到人们拿着手机和电子书。"},{"ru":"Многие читают новости, детективы и короткие статьи в интернете.","zh":"很多人读新闻、侦探小说和网上的短文章。"},{"ru":"Мои друзья советуют мне фантастику и современные русские романы.","zh":"我朋友推荐我读科幻和当代俄罗斯小说。"},{"ru":"Один коллега каждый месяц покупает бумажную книгу в маленьком магазине.","zh":"有个同事每个月都去小书店买一本纸质书。"},{"ru":"Он говорит, что так лучше запоминается и меньше отвлекает телефон.","zh":"他说这样记得更牢，手机也不太会打扰。"},{"ru":"В библиотеке я заметил, что старые книги берут чаще, чем я ожидал.","zh":"在图书馆我发现，旧书被借得比我预想的多。"},{"ru":"Преподаватель объяснил, что привычка читать передаётся в семье.","zh":"老师解释说，读书的习惯是在家庭里传下来的。"},{"ru":"Я решил начать с коротких рассказов, чтобы не бросить на середине.","zh":"我决定从短篇开始，免得读到一半就放弃。"},{"ru":"Мне нравится читать вслух: так я лучше запоминаю новые слова.","zh":"我喜欢朗读：这样更容易记住新词。"},{"ru":"Постепенно книга становится для меня не работой, а отдыхом.","zh":"慢慢地，读书对我来说不再是任务，而是休息。"}],"vocab":[{"ru":"классиков","zh":"经典作家（复数第四格）","pos":"сущ."},{"ru":"современная","zh":"现代的","pos":"прил."},{"ru":"детективы","zh":"侦探小说（复数）","pos":"сущ."},{"ru":"фантастику","zh":"科幻作品（第四格）","pos":"сущ."},{"ru":"отвлекает","zh":"分散注意力","pos":"глаг."},{"ru":"привычка","zh":"习惯","pos":"сущ."}],"sec":49}]},{"id":"c7-34","title":"Моя практика","titleZh":"我的实习","level":"B1","texts":[{"id":"c7-34","kind":"text","label":"短文","sentences":[{"ru":"Этим летом я проходил практику в небольшой компании в центре города.","zh":"今年夏天我在市中心一家小公司实习。"},{"ru":"В первый день я очень волновался, потому что почти никого не знал.","zh":"第一天我很紧张，因为几乎谁也不认识。"},{"ru":"Меня встретила руководительница и показала, где что находится.","zh":"女主管接待了我，告诉我哪儿是哪儿。"},{"ru":"Сначала мне давали простые задания: переводить письма и готовить документы.","zh":"起初给我的都是简单任务：翻译信件、准备文件。"},{"ru":"Я боялся ошибиться, поэтому проверял каждое слово по два раза.","zh":"我怕出错，所以每个词都检查两遍。"},{"ru":"Через неделю я начал быстрее понимать, чего от меня хотят.","zh":"一周后我开始更快明白别人要我做什么。"},{"ru":"Один раз я перевёл письмо неправильно, и получилось очень смешно.","zh":"有一次我翻译错了一封信，结果很搞笑。"},{"ru":"Руководительница не ругала меня, а спокойно объяснила ошибку.","zh":"主管没有骂我，而是平静地解释了错在哪里。"},{"ru":"Благодаря этому я перестал бояться задавать вопросы.","zh":"因为这个，我不再害怕提问了。"},{"ru":"К концу практики я уже сам вёл короткие переговоры по телефону.","zh":"实习快结束时，我已经能自己在电话里做简短的谈判。"},{"ru":"Мне предложили остаться работать, но я решил сначала закончить учёбу.","zh":"他们提出让我留下工作，但我决定先读完书。"},{"ru":"Эта практика научила меня большему, чем некоторые лекции.","zh":"这次实习教给我的，比有些课还多。"}],"vocab":[{"ru":"практику","zh":"实习（第四格）","pos":"сущ."},{"ru":"руководительница","zh":"女主管","pos":"сущ."},{"ru":"переводить","zh":"翻译","pos":"глаг."},{"ru":"задавать","zh":"提出（问题）","pos":"глаг."},{"ru":"переговоры","zh":"谈判（复数）","pos":"сущ."},{"ru":"научила","zh":"教会了（她）","pos":"глаг."}],"sec":46}]},{"id":"c7-13","title":"Что значит «быть дома»","titleZh":"「在家」意味着什么","level":"B2","texts":[{"id":"c7-13","kind":"text","label":"短文","sentences":[{"ru":"Когда я жил в своей стране, я почти не думал о значении слова «дом».","zh":"住在自己国家的时候，我几乎没想过「家」这个词的含义。"},{"ru":"Дом был просто местом, куда я возвращался после работы, и это казалось мне естественным.","zh":"家只是我下班后回去的地方，这在我看来理所当然。"},{"ru":"Всё изменилось, когда я переехал в другой город, где не знал ни одного человека.","zh":"当我搬到一个谁也不认识的城市时，一切都变了。"},{"ru":"Первые недели я чувствовал себя гостем в собственной квартире.","zh":"最初几周，我在自己的公寓里感觉自己像个客人。"},{"ru":"Я долго не мог привыкнуть к тому, что за стеной говорят на другом языке.","zh":"我很久都没法习惯墙那边说着另一种语言。"},{"ru":"Постепенно я начал замечать мелочи, которые делали жильё похожим на дом.","zh":"我渐渐开始注意到那些让住处变得像家的细节。"},{"ru":"Это была любимая чашка, купленная случайно на рынке, и запах хлеба по утрам.","zh":"那是市场上偶然买到的、我很喜欢的杯子，还有早晨面包的味道。"},{"ru":"Однажды соседка постучала в дверь и пригласила меня на чай.","zh":"有一天女邻居敲门，请我去喝茶。"},{"ru":"Мы говорили медленно, часто не понимая друг друга, но это было приятно.","zh":"我们说得慢，常常彼此听不懂，但感觉很愉快。"},{"ru":"После этого вечера я перестал чувствовать себя одиноким, хотя ничего особенного не произошло.","zh":"那天晚上之后，我不再感到孤独，尽管并没有发生什么特别的事。"},{"ru":"Я понял, что дом — это не адрес и не количество вещей в комнате.","zh":"我明白了，家不是一个地址，也不是房间里东西的数量。"},{"ru":"Дом — это люди, которые знают, как тебя зовут, и не удивляются, когда ты приходишь.","zh":"家是那些知道你叫什么、你来的时候不会惊讶的人。"},{"ru":"Конечно, у каждого человека своё представление об этом, и спорить здесь бессмысленно.","zh":"当然，每个人对此都有自己的理解，争论这个没有意义。"},{"ru":"Кто-то находит дом в семье, кто-то — в любимой работе или в старых друзьях.","zh":"有人在家庭里找到家，有人在热爱的工作里，或在老朋友那里。"},{"ru":"Для меня важнее всего было осознание, что меня где-то ждут.","zh":"对我来说，最重要的是意识到某个地方有人在等我。"},{"ru":"С тех пор я стараюсь чаще звонить родным, даже если у меня мало времени.","zh":"从那以后，我尽量多给亲人打电话，哪怕时间很少。"},{"ru":"Иногда достаточно нескольких минут разговора, чтобы почувствовать себя дома.","zh":"有时候几分钟的交谈，就足以让你感到像在家里。"},{"ru":"Поэтому теперь я не ищу идеальное место, а стараюсь быть дома там, где нахожусь.","zh":"所以现在我不再寻找一个理想的地方，而是努力在所到之处都像在家一样。"}],"vocab":[{"ru":"значение","zh":"含义","pos":"сущ."},{"ru":"квартире","zh":"公寓","pos":"сущ."},{"ru":"соседка","zh":"女邻居","pos":"сущ."},{"ru":"одиноким","zh":"孤独的","pos":"прил."},{"ru":"осознание","zh":"认识","pos":"сущ."},{"ru":"родным","zh":"亲人","pos":"сущ."}],"sec":81}]},{"id":"c7-14","title":"Странная просьба","titleZh":"奇怪的请求","level":"B2","texts":[{"id":"c7-14","kind":"text","label":"短文","sentences":[{"ru":"В прошлую пятницу мой друг Томас позвонил мне и попросил о встрече голосом, полным тайны.","zh":"上周五我的朋友托马斯给我打电话，用充满秘密的口气约我见面。"},{"ru":"Мы сели в кафе, и он долго не решался начать разговор.","zh":"我们在咖啡馆坐下，他很久都不敢开口。"},{"ru":"Наконец он сказал, что видел у меня дома фотографию и не может её забыть.","zh":"最后他说，他在我家看到一张照片，怎么也没法忘记。"},{"ru":"Я сразу понял, о чём речь: у меня на полке стояла фотография дедушки.","zh":"我立刻明白他说的是什么：我书架上放着爷爷的照片。"},{"ru":"«Хочешь, я тебя с ним познакомлю?» — предложил я, стараясь быть вежливым.","zh":"“要不要我介绍你们认识？”我尽量礼貌地提议。"},{"ru":"Томас посмотрел на меня так, будто я сказал что-то совершенно невероятное.","zh":"托马斯看我的样子，好像我说了什么完全不可思议的话。"},{"ru":"«Ты не понял, — сказал он. — Мне не нужен твой дедушка».","zh":"“你没懂，”他说，“我不需要你爷爷。”"},{"ru":"Я честно признался, что тогда вообще перестал его понимать.","zh":"我老实承认，那我可就完全不懂他了。"},{"ru":"Он объяснил, что на фотографии была молодая красивая девушка, а не пожилой человек.","zh":"他解释说照片上是个年轻漂亮的姑娘，不是上了年纪的人。"},{"ru":"Тут я вспомнил, что рядом с дедушкой стояла моя старшая сестра Анна.","zh":"这时我想起来，爷爷旁边站着的是我姐姐安娜。"},{"ru":"Наверное, он видел только её, потому что фотография была обрезана с одной стороны.","zh":"大概他只看见了她，因为照片一边被裁掉了。"},{"ru":"Мы оба замолчали, а потом начали смеяться так громко, что официант подошёл к нашему столику.","zh":"我们都沉默了，然后笑得那么大声，服务员都走到了我们桌边。"},{"ru":"«Извините, — сказал Томас, вытирая глаза, — мы просто вспомнили одну историю».","zh":"“抱歉，”托马斯擦着眼睛说，“我们只是想起了一件事。”"},{"ru":"Я объяснил ему, что Анна живёт в другом городе и приезжает только на праздники.","zh":"我向他解释，安娜住在另一个城市，只有过节才来。"},{"ru":"Он немного расстроился, но сразу же спросил, когда будет следующий праздник.","zh":"他有点失望，但马上问下一个节日是什么时候。"},{"ru":"Я ответил, что это зависит от того, насколько сильно он хочет познакомиться.","zh":"我回答说，这要看他有多想认识她。"},{"ru":"В итоге мы договорились, что он придёт на день рождения мамы через месяц.","zh":"最后我们约好，一个月后他来过妈妈的生日。"},{"ru":"С тех пор я всегда уточняю, кого именно человек имеет в виду, прежде чем знакомить его с родственниками.","zh":"从那以后，在介绍别人和亲戚认识之前，我总要先确认他指的是谁。"}],"vocab":[{"ru":"фотография","zh":"照片","pos":"сущ."},{"ru":"дедушка","zh":"爷爷","pos":"сущ."},{"ru":"девушка","zh":"姑娘","pos":"сущ."},{"ru":"сестра","zh":"姐妹","pos":"сущ."},{"ru":"смеяться","zh":"笑","pos":"глаг."},{"ru":"родственники","zh":"亲戚","pos":"сущ."}],"sec":85}]},{"id":"c7-15","title":"Стоит ли жить по расписанию","titleZh":"该不该按计划生活","level":"B2","texts":[{"id":"c7-15","kind":"text","label":"短文","sentences":[{"ru":"В последние годы стало модно составлять подробное расписание на каждый день, чуть ли не по минутам.","zh":"近几年流行给每一天做详细计划，几乎精确到分钟。"},{"ru":"Сторонники такого подхода утверждают, что порядок помогает экономить время и меньше уставать.","zh":"支持这种做法的人认为，秩序能节省时间，让人不那么累。"},{"ru":"В этом есть смысл: когда человек знает, что делать, ему труднее откладывать дела на потом.","zh":"这有道理：人知道该做什么的时候，就更难把事往后拖。"},{"ru":"Однако у жёсткого расписания есть и обратная сторона, о которой говорят реже.","zh":"不过，严格的计划也有另一面，只是人们较少谈到。"},{"ru":"Если весь день уже расписан, любая неожиданность кажется катастрофой.","zh":"如果一整天都排满了，任何意外都像是灾难。"},{"ru":"Я сам пробовал жить по плану полгода и в конце концов отказался от этой идеи.","zh":"我自己试过按计划生活半年，最后放弃了这个想法。"},{"ru":"Поначалу мне нравилось чувство контроля, но постепенно оно превратилось в тревогу.","zh":"一开始我喜欢那种掌控感，但它渐渐变成了焦虑。"},{"ru":"Когда я не успевал выполнить пункт плана, я чувствовал себя виноватым весь день.","zh":"当我没能完成计划里的一项时，一整天都觉得自己有错。"},{"ru":"Кроме того, я перестал замечать то, что не было записано в блокноте.","zh":"此外，我不再注意那些没有写在本子上的事。"},{"ru":"Например, разговор с коллегой или неожиданную прогулку по вечернему городу.","zh":"比如和同事的一次谈话，或者傍晚在城里的一次意外散步。"},{"ru":"Разумеется, я не призываю отказываться от планов полностью.","zh":"当然，我不是提倡完全放弃计划。"},{"ru":"Совсем без планов тоже трудно: важные дела быстро откладываются на неопределённый срок.","zh":"完全没有计划也很难：重要的事很快就被无限期地往后推。"},{"ru":"Мне кажется, разумнее составлять план на день, но оставлять в нём свободное место.","zh":"我觉得更合理的做法是做一天的计划，但在里面留出空余。"},{"ru":"Тогда неожиданность становится не катастрофой, а возможностью.","zh":"这样意外就不再是灾难，而是机会。"},{"ru":"Кроме того, стоит помнить, что расписание — это инструмент, а не цель.","zh":"此外要记住，计划是一种工具，而不是目的。"},{"ru":"Если человек весь день занят выполнением плана, ему некогда жить.","zh":"如果一个人整天忙着执行计划，他就没有时间生活了。"},{"ru":"Поэтому я стараюсь планировать только самое важное, а остальное оставлять как получится.","zh":"所以我尽量只计划最重要的部分，其余的顺其自然。"},{"ru":"Наверное, идеального ответа здесь нет, и каждый находит свой баланс сам.","zh":"大概这里没有标准答案，每个人都要自己找到平衡。"}],"vocab":[{"ru":"расписание","zh":"计划表","pos":"сущ."},{"ru":"сторонники","zh":"支持者","pos":"сущ."},{"ru":"откладывать","zh":"拖延","pos":"глаг."},{"ru":"тревогу","zh":"焦虑","pos":"сущ."},{"ru":"виноватым","zh":"有错的","pos":"прил."},{"ru":"баланс","zh":"平衡","pos":"сущ."}],"sec":84}]},{"id":"c7-16","title":"Письмо через десять лет","titleZh":"写给十年后的一封信","level":"B2","texts":[{"id":"c7-16","kind":"text","label":"短文","sentences":[{"ru":"Недавно я нашёл в старом блокноте письмо, которое написал себе десять лет назад.","zh":"最近我在旧本子里找到一封十年前写给自己的信。"},{"ru":"Тогда мне было двадцать, и я был уверен, что знаю о жизни почти всё.","zh":"那时我二十岁，很确信自己对生活几乎无所不知。"},{"ru":"В письме я спрашивал будущего себя, осуществил ли он свои мечты.","zh":"信里我问未来的自己，有没有实现自己的梦想。"},{"ru":"Я обещал выучить два иностранных языка, объехать полмира и написать книгу.","zh":"我许诺要学会两门外语，走遍半个世界，还要写一本书。"},{"ru":"Честно говоря, сегодня мне немного смешно и немного грустно читать эти строки.","zh":"说实话，今天读这些句子，我有点想笑，也有点难过。"},{"ru":"Языки я выучил, хотя не так быстро, как планировал.","zh":"语言我学会了，虽然不像计划的那样快。"},{"ru":"Полмира не объехал, зато побывал в местах, о которых тогда даже не мечтал.","zh":"半个世界没有走遍，但去了当时连做梦都没梦到的地方。"},{"ru":"Книгу не написал, но зато много лет пишу письма, заметки и тексты для работы.","zh":"书没有写成，但这些年来一直在写信、写笔记、写工作文稿。"},{"ru":"Получается, что мечты сбылись не так, как я себе представлял.","zh":"结果是，梦想实现的方式和我预想的不一样。"},{"ru":"Раньше мне казалось, что это провал, а теперь я думаю, что это нормально.","zh":"以前我觉得这是失败，现在我觉得这很正常。"},{"ru":"Человек меняется, и вместе с ним меняются его желания.","zh":"人会改变，他的愿望也随之改变。"},{"ru":"Важно не то, дошёл ли ты до намеченной точки, а то, чему научился по дороге.","zh":"重要的不是你有没有走到预定的那个点，而是路上学到了什么。"},{"ru":"Сейчас я пишу новое письмо, и мне интересно, что скажет мне я через десять лет.","zh":"现在我正在写一封新信，我很想知道十年后的自己会对我说什么。"},{"ru":"На этот раз я стараюсь не ставить слишком точных целей.","zh":"这一次我尽量不设太具体的目标。"},{"ru":"Я пишу о том, что важно для меня сегодня: о семье, о здоровье и о любопытстве.","zh":"我写下今天对我重要的东西：家人、健康和好奇。"},{"ru":"Мне хочется, чтобы будущий я не стыдился своих ошибок, а относился к ним с уважением.","zh":"我希望未来的自己不为错误羞耻，而是尊重它们。"},{"ru":"Ведь именно ошибки чаще всего учат нас чему-то настоящему.","zh":"因为正是错误最常教给我们真正的东西。"},{"ru":"Когда-нибудь я снова найду это письмо и, наверное, опять улыбнусь.","zh":"总有一天我会再次找到这封信，大概又会笑起来。"}],"vocab":[{"ru":"письмо","zh":"信","pos":"сущ."},{"ru":"мечты","zh":"梦想","pos":"сущ."},{"ru":"книгу","zh":"书","pos":"сущ."},{"ru":"провал","zh":"失败","pos":"сущ."},{"ru":"любопытство","zh":"好奇","pos":"сущ."},{"ru":"ошибки","zh":"错误","pos":"сущ."}],"sec":79}]},{"id":"c7-35","title":"Почему мы боимся молчать","titleZh":"我们为什么害怕沉默","level":"B2","texts":[{"id":"c7-35","kind":"text","label":"短文","sentences":[{"ru":"Мы живём в мире, где почти каждую минуту что-то звучит: музыка в наушниках, сообщения, новости и чужие разговоры.","zh":"我们生活在一个几乎每分钟都有声音的世界里：耳机里的音乐、消息、新闻和别人的谈话。"},{"ru":"Если вдруг наступает тишина, многие люди сразу берут телефон, будто боятся остаться наедине с собой.","zh":"一旦突然安静下来，很多人马上拿起手机，好像害怕独自面对自己。"},{"ru":"Недавно я попробовал провести целый вечер без музыки и без экрана.","zh":"最近我试着整整一个晚上不听音乐、不看屏幕。"},{"ru":"Первые полчаса были почти неприятными: мне казалось, что я теряю время.","zh":"头半小时几乎让人难受：我觉得自己在浪费时间。"},{"ru":"Потом я заметил, как много мыслей проходит мимо, пока мы слушаем что-то ещё.","zh":"后来我发现，当我们还在听别的东西时，有多少念头就这样溜走了。"},{"ru":"В тишине становится слышно то, что обычно заглушают привычные звуки.","zh":"在安静里，那些平常被熟悉声音盖住的东西才听得见。"},{"ru":"Психологи говорят, что страх тишины связан со страхом встречи с собственными чувствами.","zh":"心理学家说，对沉默的恐惧与害怕面对自己的感受有关。"},{"ru":"Пока мы заняты, у нас нет времени думать о том, что нас беспокоит.","zh":"只要我们忙起来，就没有时间去想那些让我们不安的事。"},{"ru":"Но именно в такие минуты человек может понять, чего он на самом деле хочет.","zh":"但恰恰在这样的时刻，人才能明白自己真正想要什么。"},{"ru":"Конечно, я не призываю отказаться от музыки или подкастов: они делают жизнь ярче.","zh":"当然，我不是主张放弃音乐或播客：它们让生活更丰富。"},{"ru":"Я лишь заметил, что иногда полезно специально оставлять немного пустого времени.","zh":"我只是发现，有时特意留一点空白时间是有好处的。"},{"ru":"Это может быть прогулка без наушников или дорога домой без привычных сообщений.","zh":"可以是不戴耳机散步，或者回家路上不刷那些习惯性的消息。"},{"ru":"Сначала будет неудобно, но потом появляется удивительное чувство спокойствия.","zh":"开始会不舒服，但之后会出现一种奇妙的平静感。"},{"ru":"В такие моменты я часто нахожу ответы на вопросы, которые долго не мог решить.","zh":"在这样的时刻，我常常找到那些久久解决不了的问题的答案。"},{"ru":"Интересно, что самые важные разговоры с собой случаются именно тогда, когда рядом никто не говорит.","zh":"有趣的是，最重要的自我对话，恰恰发生在身边没人说话的时候。"},{"ru":"Поэтому тишина — это не пустота, а пространство, в котором можно услышать себя.","zh":"所以沉默不是空白，而是一个能听见自己的空间。"},{"ru":"Мне кажется, умение быть в тишине — такой же навык, как умение говорить.","zh":"我觉得，能在沉默里待着，和会说话一样，都是一种能力。"},{"ru":"И ему стоит учиться так же внимательно, как иностранному языку.","zh":"而且值得像学外语那样认真地去学它。"}],"vocab":[{"ru":"наушниках","zh":"耳机里（复数第六格）","pos":"сущ."},{"ru":"тишина","zh":"沉默、安静","pos":"сущ."},{"ru":"заглушают","zh":"盖过、压低","pos":"глаг."},{"ru":"психологи","zh":"心理学家（复数）","pos":"сущ."},{"ru":"спокойствия","zh":"平静（第二格）","pos":"сущ."},{"ru":"навык","zh":"技能","pos":"сущ."}],"sec":88}]},{"id":"c7-36","title":"Чужой акцент","titleZh":"口音","level":"B2","texts":[{"id":"c7-36","kind":"text","label":"短文","sentences":[{"ru":"Когда я говорю по-русски, люди часто спрашивают, откуда я приехал.","zh":"我说俄语的时候，人们常问我来自哪里。"},{"ru":"Иногда они угадывают сразу, иногда называют совсем другие страны.","zh":"有时他们一下就猜中，有时说出完全不同的国家。"},{"ru":"Раньше я стеснялся своего акцента и старался говорить тише.","zh":"以前我为自己口音不好意思，尽量说小声。"},{"ru":"Мне казалось, что правильная речь — это речь без всяких следов другого языка.","zh":"我那时认为，正确的语言不该有任何另一种语言的痕迹。"},{"ru":"Однажды преподавательница сказала фразу, которую я запомнил навсегда.","zh":"有一次老师说了句话，我永远记住了。"},{"ru":"Она сказала, что акцент — это не ошибка, а история человека.","zh":"她说口音不是错误，而是一个人的经历。"},{"ru":"По акценту можно услышать, где человек вырос и сколько языков он знает.","zh":"从口音里能听出一个人在哪儿长大、会几种语言。"},{"ru":"После этого я перестал прятаться и начал говорить громче.","zh":"从那以后我不再躲闪，开始说得更大声。"},{"ru":"Конечно, я продолжаю работать над произношением и грамматикой.","zh":"当然，我还在继续练发音和语法。"},{"ru":"Но теперь я не боюсь, что кто-то заметит, что русский для меня не родной.","zh":"但现在我不怕别人听出俄语不是我的母语。"},{"ru":"Наоборот, это часто становится началом интересного разговора.","zh":"相反，这常常变成一场有趣谈话的开端。"},{"ru":"Многие русские сами говорят с акцентом, если выросли в другом регионе.","zh":"很多俄罗斯人如果在别的地区长大，自己说话也带口音。"},{"ru":"В большой стране нет одного единственного правильного звучания.","zh":"在一个大国里，并不存在唯一正确的发音。"},{"ru":"Главное — чтобы тебя понимали и чтобы тебе было что сказать.","zh":"重要的是别人能听懂你，而你有话可说。"},{"ru":"Однажды в поезде пожилая женщина сказала, что у меня красивый голос.","zh":"有一次在火车上，一位老太太说我声音很好听。"},{"ru":"Она не заметила никакого акцента, потому что просто слушала.","zh":"她没注意到什么口音，因为她只是在听。"},{"ru":"С тех пор я отношусь к своему произношению спокойнее.","zh":"从那以后我对自己的发音看得更平静。"},{"ru":"Язык нужен для общения, а не для экзамена на идеальность.","zh":"语言是为了交流，不是为了考“完美”。"}],"vocab":[{"ru":"акцента","zh":"口音（第二格）","pos":"сущ."},{"ru":"стеснялся","zh":"不好意思、拘谨","pos":"глаг."},{"ru":"преподавательница","zh":"女教师","pos":"сущ."},{"ru":"произношением","zh":"发音（第五格）","pos":"сущ."},{"ru":"единственного","zh":"唯一的","pos":"прил."},{"ru":"звучания","zh":"发音、声响（第二格）","pos":"сущ."}],"sec":73}]},{"id":"c7-37","title":"Идеальный отпуск","titleZh":"理想的假期","level":"B2","texts":[{"id":"c7-37","kind":"text","label":"短文","sentences":[{"ru":"Каждое лето я спорю с друзьями о том, каким должен быть идеальный отпуск.","zh":"每年夏天我都和朋友争论理想的假期该是什么样。"},{"ru":"Одни хотят лежать на пляже и ничего не делать две недели подряд.","zh":"有人想躺在海滩上，连着两个星期什么都不做。"},{"ru":"Другие мечтают о городах, музеях и долгих прогулках до поздней ночи.","zh":"有人梦想城市、博物馆和逛到深夜的长长散步。"},{"ru":"Я долго думал, что мне ближе, и понял, что мне нужны оба варианта.","zh":"我想了很久哪种更适合我，最后发现两种我都需要。"},{"ru":"Неделя спокойного отдыха возвращает силы, а вторая неделя даёт новые впечатления.","zh":"一周安静的休息能恢复精力，另一周带来新的见闻。"},{"ru":"В прошлом году я попробовал совместить это в одной поездке.","zh":"去年我试着在一次旅行里把两者结合起来。"},{"ru":"Сначала мы жили у моря, где почти не было людей.","zh":"我们先住在海边，那里几乎没有人。"},{"ru":"Утром я плавал, днём читал, а вечером смотрел на воду.","zh":"早上游泳，白天看书，傍晚看海。"},{"ru":"Потом мы поехали в большой город и ходили по музеям с утра до вечера.","zh":"然后我们去了大城市，从早到晚逛博物馆。"},{"ru":"К концу поездки я устал, но был очень доволен.","zh":"旅行结束时我累了，但非常满意。"},{"ru":"Оказалось, что отдых не обязательно должен быть бездельем.","zh":"原来休息不一定非得是无所事事。"},{"ru":"Иногда смена занятий устаёт меньше, чем однообразный пляж.","zh":"有时换着事情做，比一成不变的海滩还轻松些。"},{"ru":"Конечно, у каждого свой ответ на этот вопрос.","zh":"当然，每个人对这个问题的回答都不同。"},{"ru":"Для кого-то идеальный отпуск — это горы и рюкзак.","zh":"对有些人来说，理想的假期是山和背包。"},{"ru":"Для кого-то — тихий дом в деревне и книга.","zh":"对另一些人来说，是乡下安静的房子和一本书。"},{"ru":"Важно не то, куда ты едешь, а то, насколько тебе там спокойно.","zh":"重要的不是你去了哪里，而是你在那里有多安心。"},{"ru":"В следующем году я хочу поехать в горы, потому что там я ещё не был.","zh":"明年我想去山里，因为我还没去过。"},{"ru":"А потом снова к морю, чтобы вспомнить, как это — ничего не делать.","zh":"然后再回到海边，回想一下什么都不做是什么感觉。"}],"vocab":[{"ru":"отпуск","zh":"假期","pos":"сущ."},{"ru":"впечатления","zh":"感受、见闻（复数）","pos":"сущ."},{"ru":"совместить","zh":"结合起来","pos":"глаг."},{"ru":"однообразный","zh":"单调的","pos":"прил."},{"ru":"рюкзак","zh":"背包","pos":"сущ."},{"ru":"спокойно","zh":"安心地、平静","pos":"нареч."}],"sec":69}]},{"id":"c7-38","title":"Учитель, который изменил всё","titleZh":"改变一切的老师","level":"B2","texts":[{"id":"c7-38","kind":"text","label":"短文","sentences":[{"ru":"В школе у меня был учитель литературы, которого многие ученики боялись.","zh":"中学时我有一位文学老师，很多学生都怕他。"},{"ru":"Он никогда не повышал голос, но его тишина была громче любого крика.","zh":"他从不提高嗓门，但他的沉默比任何喊叫都响。"},{"ru":"На первом уроке он сказал, что не будет ставить оценки за правильные ответы.","zh":"第一堂课上他说，不会因为答对而给分数。"},{"ru":"Он хотел, чтобы мы научились задавать вопросы, а не повторять чужие мысли.","zh":"他希望我们学会提问题，而不是重复别人的想法。"},{"ru":"Сначала это казалось странным и даже несправедливым.","zh":"起初这显得奇怪，甚至不公平。"},{"ru":"Мы привыкли, что есть один правильный ответ, и вдруг его не стало.","zh":"我们习惯了只有一个正确答案，忽然它不存在了。"},{"ru":"Постепенно я начал читать книги, о которых раньше даже не слышал.","zh":"渐渐地，我开始读一些从前连听都没听过的书。"},{"ru":"Он давал мне советы, но никогда не говорил, что именно я должен думать.","zh":"他给我建议，但从不说我具体该怎么想。"},{"ru":"Однажды он вернул мне сочинение без оценки, но с длинным письмом на полях.","zh":"有一次他把作文还给我，没有分数，页边却写满了字。"},{"ru":"В этом письме он написал, что я умею замечать то, что видят немногие.","zh":"他在信里写道，我能注意到很少有人注意到的东西。"},{"ru":"Я сохранил ту тетрадь и до сих пор иногда её перечитываю.","zh":"我留住了那个本子，至今偶尔还会重读。"},{"ru":"Именно после этого я решил, что хочу работать со словами.","zh":"正是在那之后，我决定要做和文字有关的工作。"},{"ru":"Многие мои одноклассники не любили его уроки, потому что они были трудными.","zh":"我很多同学不喜欢他的课，因为很难。"},{"ru":"Но те, кто остался, помнят его всю жизнь.","zh":"但留下来的人，一辈子都记得他。"},{"ru":"Я понял, что настоящий учитель не даёт готовых ответов.","zh":"我明白了，真正的老师不给现成的答案。"},{"ru":"Он помогает человеку услышать собственный голос и не бояться его.","zh":"他帮助一个人听见自己的声音，并且不害怕它。"},{"ru":"Сейчас я иногда думаю, что сказал бы ему о своей жизни.","zh":"现在我有时会想，若见到他，我会怎样讲自己的生活。"},{"ru":"Наверное, я просто сказал бы спасибо.","zh":"大概，我只会说一句谢谢。"}],"vocab":[{"ru":"литературы","zh":"文学（第二格）","pos":"сущ."},{"ru":"повышал","zh":"提高（声音）","pos":"глаг."},{"ru":"несправедливым","zh":"不公平的（第五格）","pos":"прил."},{"ru":"сочинение","zh":"作文","pos":"сущ."},{"ru":"перечитываю","zh":"反复读","pos":"глаг."},{"ru":"одноклассники","zh":"同班同学（复数）","pos":"сущ."}],"sec":71}]},{"id":"c7-39","title":"Город без машин","titleZh":"没有汽车的城市","level":"B2","texts":[{"id":"c7-39","kind":"text","label":"短文","sentences":[{"ru":"Несколько лет назад я прочитал статью о городе, где почти нет машин.","zh":"几年前我读到一篇关于一座几乎没有汽车的城市文章。"},{"ru":"Сначала я подумал, что это выдумка или эксперимент для туристов.","zh":"起初我以为这是编的，或者是给游客看的实验。"},{"ru":"Но потом узнал, что такие места действительно существуют и работают много лет.","zh":"后来才知道，这样的地方真的存在，而且已经运行了很多年。"},{"ru":"Люди там ходят пешком, ездят на велосипедах и пользуются общественным транспортом.","zh":"那里的人步行、骑车，使用公共交通。"},{"ru":"Дети играют на улицах, потому что родителям не нужно бояться дороги.","zh":"孩子们在街上玩，因为父母不必担心马路。"},{"ru":"Воздух в таком городе заметно чище, а шум почти не мешает спать.","zh":"这样的城市空气明显更干净，噪音几乎不影响睡眠。"},{"ru":"Конечно, у этого есть и другая сторона.","zh":"当然，这也有另一面。"},{"ru":"Если человек живёт далеко от центра, ему труднее добираться до работы.","zh":"如果一个人住得离市中心远，上班就更困难。"},{"ru":"Магазины и больницы должны быть ближе, иначе жизнь становится неудобной.","zh":"商店和医院必须更近，否则生活就不方便。"},{"ru":"Кроме того, не все могут ходить пешком из-за возраста или здоровья.","zh":"此外，并非所有人都能因为年龄或健康原因步行。"},{"ru":"Поэтому полный отказ от машин подходит не каждому городу.","zh":"所以完全放弃汽车并不适合每座城市。"},{"ru":"Но мне кажется, что нам есть чему поучиться у таких мест.","zh":"但我觉得，我们有很多可以从这些地方学的东西。"},{"ru":"Например, можно сделать центры городов удобнее для людей, а не для автомобилей.","zh":"比如，可以把市中心变得更方便人，而不是方便汽车。"},{"ru":"Можно строить больше дорог для велосипедов и сажать деревья вдоль улиц.","zh":"可以多修自行车道，沿街多种树。"},{"ru":"Когда я возвращаюсь домой после долгой дороги в машине, я думаю об этом.","zh":"当我坐了很久车回到家时，我会想到这些。"},{"ru":"Мне хочется, чтобы мой город тоже стал немного тише и зеленее.","zh":"我希望我的城市也变得更安静、更绿一点。"},{"ru":"Это не значит, что нужно запретить машины совсем.","zh":"这并不意味着要彻底禁止汽车。"},{"ru":"Это значит, что стоит сначала подумать о людях, а потом о скорости.","zh":"这意味着，应该先想到人，再想到速度。"}],"vocab":[{"ru":"выдумка","zh":"编造的东西","pos":"сущ."},{"ru":"общественным","zh":"公共的（第五格）","pos":"прил."},{"ru":"заметно","zh":"明显地","pos":"нареч."},{"ru":"здоровья","zh":"健康（第二格）","pos":"сущ."},{"ru":"поучиться","zh":"学习一番","pos":"глаг."},{"ru":"запретить","zh":"禁止","pos":"глаг."}],"sec":74}]},{"id":"c7-40","title":"Разговор в поезде","titleZh":"火车上的谈话","level":"B2","texts":[{"id":"c7-40","kind":"text","label":"短文","sentences":[{"ru":"В прошлом месяце я ехал в поезде двенадцать часов и сидел у окна.","zh":"上个月我坐了十二个小时的火车，坐在窗边。"},{"ru":"Напротив меня сидела пожилая женщина с большой сумкой и термосом.","zh":"我对面坐着一位老太太，带着一个大袋子和一个保温瓶。"},{"ru":"Сначала мы молчали, каждый смотрел в свою сторону.","zh":"起初我们都不说话，各自看着一边。"},{"ru":"Через час она предложила мне чай и спросила, куда я еду.","zh":"一小时后她请我喝茶，问我这是要去哪儿。"},{"ru":"Так начался разговор, который длился почти до самого вечера.","zh":"就这样开始了一场几乎持续到傍晚的谈话。"},{"ru":"Она рассказала, что всю жизнь проработала в школе и вырастила троих детей.","zh":"她说她一辈子都在学校工作，养大了三个孩子。"},{"ru":"Её муж умер пять лет назад, и она до сих пор с ним разговаривает перед сном.","zh":"她丈夫五年前去世了，她到现在睡前还会跟他说说话。"},{"ru":"Я не знал, что сказать, но она улыбнулась и добавила, что это не грустно.","zh":"我不知道该说什么，但她笑了笑，说这并不悲伤。"},{"ru":"По её словам, память о человеке — это тоже способ быть вместе.","zh":"按她的话说，对一个人的记忆也是一种在一起的方式。"},{"ru":"Потом она спросила о моей семье, и я впервые за месяц рассказал всё честно.","zh":"后来她问起我的家人，我一个月来第一次把一切如实讲了出来。"},{"ru":"Она слушала без советов и без осуждения, и от этого мне стало легче.","zh":"她听着，不给建议也不评判，我因此轻松了许多。"},{"ru":"Когда стало темно, мы оба замолчали и смотрели на огни за окном.","zh":"天黑下来时，我们都沉默着，看着窗外的灯火。"},{"ru":"Перед её станцией она дала мне совет, который я запомнил.","zh":"在她下车的那一站前，她给了我一个我记住的忠告。"},{"ru":"Она сказала, что в жизни важно не всё успеть, а не потерять себя.","zh":"她说人生重要的不是什么都来得及，而是不丢掉自己。"},{"ru":"Мы обнялись на прощание, как будто знали друг друга много лет.","zh":"告别时我们拥抱了，好像已经认识了很多年。"},{"ru":"Я так и не спросил её имя, и теперь немного жалею об этом.","zh":"我始终没问她的名字，现在有点遗憾。"},{"ru":"Но иногда я вспоминаю её голос, когда долго еду в поезде.","zh":"但有时坐很久火车时，我会想起她的声音。"},{"ru":"И тогда мне кажется, что случайные люди иногда говорят самые важные слова.","zh":"那时我觉得，偶然遇见的人有时会说出最重要的话。"}],"vocab":[{"ru":"термосом","zh":"保温瓶（第五格）","pos":"сущ."},{"ru":"проработала","zh":"工作了（一段时间）","pos":"глаг."},{"ru":"осуждения","zh":"评判、谴责（第二格）","pos":"сущ."},{"ru":"прощание","zh":"告别","pos":"сущ."},{"ru":"жалею","zh":"遗憾、惋惜","pos":"глаг."},{"ru":"случайные","zh":"偶然的（复数）","pos":"прил."}],"sec":73}]}]}],"counts":{"chapters":7,"scenes":88,"texts":136,"sentences":1212,"text_items":88,"dialog_items":48},"voiceA":"ru-RU-SvetlanaNeural","voiceB":"ru-RU-DmitryNeural"};

var STORE = 'diktant.v2';
var CUSTOM_KEY = 'diktant.custom.v1';
var SPEEDS = [0.6, 0.75, 0.9, 1, 1.25, 1.5];
var state = { ch: 'c1', textId: null, idx: 0, speed: 1, twice: true, seen: {}, typed: {}, done: {}, open: {}, lastPos: {}, custom: [] };

function loadCustom() {
  try {
    var raw = localStorage.getItem(CUSTOM_KEY);
    var a = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(a)) return [];
    var out = [];
    for (var i = 0; i < a.length; i++) {
      var it = a[i];
      if (!it || !it.id || !it.sentences || !it.sentences.length) continue;
      out.push(it);
    }
    return out;
  } catch (e) { return []; }
}
function saveCustom() {
  try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(state.custom)); } catch (e) {}
}

function load() {
  state.custom = loadCustom();
  try {
    var raw = localStorage.getItem(STORE);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && typeof s === 'object') {
      if (s.ch) state.ch = s.ch;
      if (s.typed) state.typed = s.typed;
      if (s.seen) state.seen = s.seen;
      if (s.done) state.done = s.done;
      if (typeof s.speed === 'number' && s.speed >= 0.5 && s.speed <= 2) state.speed = s.speed;
      if (typeof s.twice === 'boolean') state.twice = s.twice;
      if (s.pos && typeof s.pos === 'object') state.lastPos = s.pos;
    }
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      ch: state.ch, speed: state.speed, twice: state.twice, typed: state.typed, seen: state.seen, done: state.done,
      pos: state.lastPos || {}
    }));

  for (var i = 0; i < t.sentences.length; i++) {
    h += '<div class="sentline"><div class="n">第 ' + (i + 1) + ' 句' + (state.seen[t.id + ':' + i] ? '' : ' · 没看原文') + '</div>' +
      '<div class="ru">' + (t.sentences[i].who ? '<span class="who">' + esc(t.sentences[i].who) + '</span> ' : '') + esc(t.sentences[i].ru) + '</div>' +
      '<div class="zh">' + esc(t.sentences[i].zh) + '</div></div>';
  }
  $('doneList').innerHTML = h;
  var dsc = curScene();
  if (t.custom) {
    $('doneSub').textContent = (t.title || '我的短文') + ' · 我的短文 · ' + t.sentences.length + ' 句';
  } else {
    dsc = dsc || { title: '', titleZh: '' };
    $('doneSub').textContent = dsc.titleZh + ' · ' + t.label + ' · ' + dsc.title + '（' + t.sentences.length + ' 句）';
  }
  var v = '';
  for (var j = 0; j < t.vocab.length; j++) {
    v += '<div class="vrow"><div class="vru">' + esc(t.vocab[j].ru) + '</div><div class="vzh">' + esc(t.vocab[j].zh) + '</div><div class="vpos">' + esc(t.vocab[j].pos || '') + '</div></div>';
  }
  $('doneVocab').innerHTML = v;
  $('doneVocabFold').style.display = (t.vocab && t.vocab.length) ? '' : 'none';
  show('done');
}
function backHome() {
  stopSeq();
  rememberTyped();
  var t = curText();
  if (t && state.lastPos && state.seen && Object.keys(state.seen).length) {
    var anySeen = false;
    for (var k in state.seen) if (k.indexOf(t.id + ':') === 0) anySeen = true;
    if (anySeen) state.done[t.id] = state.done[t.id] || 0;
  }
  save();
  renderHome();
  show('home');
}

/* ---------------- wiring ---------------- */
load();
renderHome();

function renderSpeeds() {
  var box = $('speedChips');
  box.innerHTML = '';
  var cur = state.speed || 1;
  for (var i = 0; i < SPEEDS.length; i++) {
    (function (v) {
      var b = document.createElement('button');
      b.className = 'chip' + (Math.abs(v - cur) < 0.001 ? ' on' : '');
      b.textContent = (v === 1 ? '1' : String(v)) + '×';
      b.setAttribute('aria-label', '语速 ' + v + ' 倍');
      b.onclick = function () { setSpeed(v); };
      box.appendChild(b);
    })(SPEEDS[i]);
  }
}
function setSpeed(v) {
  state.speed = v;
  save();
  renderSpeeds();
  var a = audioEl();
  a.playbackRate = v;
  if ('preservesPitch' in a) a.preservesPitch = true;
}
$('btnPlay').onclick = function () {
  var a = audioEl();
  if (!a.paused) { stopSeq(); a.pause(); resetPlayBtn(); return; }
  if (isSpeaking()) { stopSeq(); return; }
  playCurrent();
};
$('btnSeq').onclick = function () { startSeq('seq'); };
$('btnOnce').onclick = function () { startSeq('once'); };
$('btnLoop').onclick = function () { startSeq('loop'); };
$('btnAdd').onclick = function () { openAdd(); };
$('btnAddBack').onclick = function () { show('home'); };
$('btnAddCancel').onclick = function () { show('home'); };
$('btnAddSave').onclick = function () { saveAdd(); };
$('twiceToggle').onclick = function () { toggleTwice(); };
$('btnPrev').onclick = function () { prevSentence(); };
$('btnNextInline').onclick = function () { nextSentence(); };
$('btnReveal').onclick = function () { toggleReveal(); };
$('btnNext').onclick = function () { nextSentence(); };
$('btnBack').onclick = function () { backHome(); };
$('btnDots').onclick = function () {
  var t = curText();
  var n = prompt('跳到第几句？（1-' + t.sentences.length + '）', String(state.idx + 1));
  if (!n) return;
  var v = parseInt(n, 10);
  if (!v || v < 1 || v > t.sentences.length) return;
  goto_(null, v - 1);
};
$('input').addEventListener('input', function () {
  var t = curText();
  if (!t) return;
  state.typed[t.id + ':' + state.idx] = $('input').value;
  if (!state.lastPos) state.lastPos = {};
  state.lastPos[t.id] = state.idx;
  save();
});
$('btnAgain').onclick = function () {
  state.idx = 0;
  state.seen = {};
  state.typed = {};
  state.open = {};
  state.done[state.textId] = 1;
  save();
  show('practice');
  renderPractice();
  startPlayback();
};
$('btnBackHome').onclick = function () { stopSeq(); renderHome(); show('home'); };
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
