<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="俄语听写">
<meta name="robots" content="noindex,nofollow">
<title>俄语听写 · Слушай и пиши</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#e8effd;
  --green:#15803d; --green-l:#e9f7ee;
  --ink:#111827; --ink-2:#4b5563; --ink-3:#9ca3af;
  --line:#e5e7eb; --card:#ffffff; --bg:#f6f7f9;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.screen{display:none}
.screen.on{display:block}

/* ---------- home ---------- */
.hero{padding:28px 0 10px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.4px}
.hero .ru{color:var(--blue);font-size:14px;letter-spacing:.3px;margin-top:4px}
.hero p{margin:10px 0 0;color:var(--ink-2);font-size:14px}
.tabs{display:flex;gap:8px;margin:18px 0 4px;overflow-x:auto;padding-bottom:2px}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;
}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px -4px rgba(37,99,235,.5)}
.leveldesc{color:var(--ink-3);font-size:13px;margin:8px 2px 14px}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;cursor:pointer;border:1px solid rgba(16,24,40,.04);
  transition:transform .08s ease;
}
.card:active{transform:scale(.99)}
.card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.card .zh{color:var(--ink-2);font-size:14px;margin-top:2px}
.card .meta{color:var(--ink-3);font-size:12.5px;margin-top:8px;display:flex;gap:10px;align-items:center}
.card .done{color:var(--green);background:var(--green-l);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.card .cont{color:var(--blue);background:var(--blue-l);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.card .lvl{color:#6b7280;background:#f1f3f6;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.2px}
.card .rt{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.entries{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.entry{
  flex:1 1 0;min-width:130px;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:9px 10px;font-size:13.5px;color:var(--ink-2);cursor:pointer;text-align:left;font-weight:600;
}
.entry.dlg{background:var(--blue-l);border-color:#c7d7fb;color:var(--blue-d)}
.entry:active{transform:scale(.99)}
.who{color:#0f766e;font-weight:700;margin-right:2px}

/* ---------- 我的短文 ---------- */
.mine-sec{margin:20px 0 4px}
.mine-sec h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.mine-sec .cnt{color:var(--ink-3);font-weight:400;font-size:13px}
.addcard{
  width:100%;border:1.5px dashed #c3d0e2;background:#fff;border-radius:var(--radius);
  padding:14px;font-size:14.5px;font-weight:600;color:var(--blue-d);cursor:pointer;margin-bottom:12px;
  font-family:inherit;text-align:left;
}
.addcard:active{transform:scale(.99)}
.card .row{display:flex;gap:8px;margin-top:10px;align-items:center}
.card .row .entry{flex:1}
.card .del{color:#b91c1c;background:#fee2e2;border:none;border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.field{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.field input,.field textarea{
  width:100%;border:none;outline:none;font-family:inherit;font-size:16px;color:var(--ink);
  background:transparent;resize:vertical;line-height:1.6;
}
.field textarea{min-height:190px}

/* ---------- practice ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.bar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.iconbtn{border:none;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;color:var(--ink);flex:0 0 auto}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s ease}

.player{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0;text-align:center}
.playbig{
  width:108px;height:108px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(160deg,#3b82f6,#2563eb);color:#fff;font-size:40px;
  box-shadow:0 10px 28px -10px rgba(37,99,235,.75);display:inline-flex;align-items:center;justify-content:center;
  transition:transform .08s;
}
.playbig:active{transform:scale(.96)}
.playbig.playing{background:linear-gradient(160deg,#60a5fa,#3b82f6)}
.under{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.pill.on{background:var(--blue-l);border-color:#c7d7fb;color:var(--blue-d);font-weight:600}
.speed{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.slabel{font-size:12.5px;color:var(--ink-3);flex:none}
.chips{display:flex;gap:6px;flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;min-width:42px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:2px 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:#d7dbe3;border:none;padding:0;cursor:pointer}
.dot.cur{background:var(--blue);transform:scale(1.35)}
.dot.seen{background:#86c69a}
.dot.seq{background:var(--blue);transform:scale(1.9);box-shadow:0 0 0 3px #dbe6fd}
.link{color:var(--blue-d);border-bottom:1px dashed currentColor;cursor:pointer;font-weight:600}
.readhint{margin:10px 2px 0;text-align:center}

.typebox{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.typebox textarea{
  width:100%;border:none;outline:none;resize:vertical;min-height:88px;font-size:17px;line-height:1.6;
  font-family:inherit;color:var(--ink);background:transparent;
}
.typebox textarea::placeholder{color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:12.5px;padding:0 4px 2px}

.reveal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:4px solid var(--green)}
.reveal .lbl{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.reveal .mine{color:var(--ink-2);font-size:15px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.reveal .ru{font-size:19px;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--green)}
.reveal .zh{color:var(--ink-2);font-size:14.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

.fold{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.fold summary{padding:14px 16px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"＋";color:var(--ink-3);font-weight:400}
.fold[open] summary::after{content:"－"}
.fold .body{padding:0 16px 16px;font-size:14.5px;color:var(--ink-2)}
.fold .body p{margin:0 0 8px}
.fold .body p b{color:var(--ink)}
.vrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .vru{font-weight:600;color:var(--ink);flex:0 0 38%}
.vrow .vzh{flex:1}
.vrow .vpos{color:var(--ink-3);font-size:12px;flex:0 0 auto}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bottom .in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:#eef1f5;color:var(--ink)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px -10px rgba(37,99,235,.8)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.45}

/* ---------- done ---------- */
.doneh{text-align:center;padding:30px 0 6px}
.doneh .big{font-size:44px}
.doneh h2{margin:6px 0 2px;font-size:22px}
.doneh p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.sentline{padding:10px 0;border-bottom:1px solid var(--line)}
.sentline:last-child{border-bottom:none}
.sentline .n{color:var(--ink-3);font-size:12px}
.sentline .ru{font-size:16.5px;font-weight:600}
.sentline .zh{color:var(--ink-2);font-size:14px;margin-top:2px}
.foot{text-align:center;color:var(--ink-3);font-size:12px;padding:22px 0 10px}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen on" id="home">
  <div class="wrap">
    <div class="hero">
      <h1>俄语听写</h1>
      <div class="ru">Слушай и пиши</div>
      <p>听一句，写一句。按生活场景练，也可以按 A1–B2 分级练，写完再看原文，慢慢把耳朵练出来。</p>
    </div>
    <div class="mine-sec">
      <h2>我的短文 <span class="cnt" id="customCnt"></span></h2>
      <button class="addcard" id="btnAdd">＋ 添加短文（粘贴俄语文章，用手机语音朗读）</button>
      <div id="customList"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="leveldesc" id="leveldesc"></div>
    <div id="textlist"></div>
    <div class="foot" id="homeFoot"></div>
  </div>
</section>

<!-- ================= PRACTICE ================= -->
<section class="screen" id="practice">
  <div class="bar">
    <div class="in">
      <button class="iconbtn" id="btnBack" aria-label="返回">‹</button>
      <div class="ttl"><b id="pTitle">—</b><span id="pSub">—</span></div>
      <button class="iconbtn" id="btnDots" aria-label="句子列表">⋯</button>
    </div>
    <div class="pbar"><i id="pProg"></i></div>
  </div>
  <div class="wrap">
    <div class="player">
      <button class="playbig" id="btnPlay" aria-label="播放">▶</button>
      <div class="under">
        <button class="pill" id="btnPrev">‹ 上一句</button>
        <button class="pill" id="btnSeq">▶ 连读</button>
        <button class="pill" id="btnOnce">⏵ 一次读完</button>
        <button class="pill" id="btnLoop">🔁 循环</button>
        <button class="pill" id="btnNextInline">下一句 ›</button>
      </div>
      <div class="speed">
        <span class="slabel">语速</span>
        <div class="chips" id="speedChips"></div>
      </div>
      <div class="hint readhint" id="readHint">播放键 = 读 <b class="link" id="twiceToggle">2 遍</b>（第二遍慢一点）· 连读 = 每句读完停 2 秒 · 一次读完 = 不停顿读完整篇 · 循环 = 反复听这一篇</div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="typebox">
      <textarea id="input" placeholder="听完把句子写在这里…" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></textarea>
      <div class="hint">想不起来就点「看原文」，不丢人。</div>
    </div>
    <div id="revealBox"></div>
    <details class="fold" id="foldZh"><summary>全文译文</summary><div class="body" id="zhBody"></div></details>
    <details class="fold" id="foldVocab"><summary>生词表</summary><div class="body" id="vocabBody"></div></details>
    <div class="foot" id="pFoot"></div>
  </div>
  <div class="bottom"><div class="in">
    <button class="btn ghost" id="btnReveal">看原文</button>
    <button class="btn primary" id="btnNext">下一句</button>
  </div></div>
</section>

<!-- ================= ADD ================= -->
<section class="screen" id="add">
  <div class="bar">
    <div class="in">
      <button class="iconbtn" id="btnAddBack" aria-label="返回">‹</button>
      <div class="ttl"><b id="addHead">添加短文</b><span>粘贴俄语文章，自动按句子切开</span></div>
    </div>
  </div>
  <div class="wrap">
    <div class="field">
      <label>标题（可不填）</label>
      <input id="addTitle" type="text" placeholder="例如：Текст 3 · Моя семья" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
    </div>
    <div class="field">
      <label>俄语正文</label>
      <textarea id="addBody" placeholder="把俄语文章粘贴到这里…&#10;整段或一行一句都行，会按 . ! ? … 自动分句。" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="hint" id="addHint">保存后每一句都能单独听，也能「连读」或「循环」反复听整篇。朗读用手机自带的俄语语音。</div>
    <div class="foot" id="addFoot"></div>
  </div>
  <div class="bottom"><div class="in">
    <button class="btn ghost" id="btnAddCancel">取消</button>
    <button class="btn primary" id="btnAddSave">保存</button>
  </div></div>
</section>

<!-- ================= DONE ================= -->
<section class="screen" id="done">
  <div class="wrap">
    <div class="doneh">
      <div class="big">🎧</div>
      <h2>这一篇听完了</h2>
      <p id="doneSub">—</p>
    </div>
    <div class="fold" style="display:block"><div class="body" id="doneList"></div></div>
    <details class="fold" id="doneVocabFold"><summary>本篇生词</summary><div class="body" id="doneVocab"></div></details>
    <div class="foot">明天再来一遍，会明显不一样。</div>
  </div>
  <div class="bottom"><div class="in">
    <button class="btn ghost" id="btnAgain">再练一遍</button>
    <button class="btn primary" id="btnBackHome">回目录</button>
  </div></div>
</section>

<script>

var CONTENT = {"version":6,"kind":"scene-texts","chapters":[{"id":"c1","name":"基础交际","nameRu":"Основы общения","desc":"打招呼、自我介绍、感谢与请求、邀请、同意与反对","scenes":[{"id":"c1-1","title":"Приветствие и прощание","titleZh":"打招呼与告别","level":"A1","texts":[{"id":"c1-1","kind":"text","label":"短文","sentences":[{"ru":"Каждое утро я иду на работу пешком.","zh":"每天早上我步行去上班。"},{"ru":"По дороге я встречаю соседа и говорю ему доброе утро.","zh":"路上我遇到邻居，对他说早上好。"},{"ru":"Он улыбается и отвечает мне.","zh":"他微笑，也回应我。"},{"ru":"Вечером я возвращаюсь домой и говорю жене добрый вечер.","zh":"晚上我回到家，对妻子说晚上好。"},{"ru":"Перед сном я всегда говорю спокойной ночи.","zh":"睡前我总是说晚安。"},{"ru":"Такие простые слова делают мой день теплее.","zh":"这样简单的话让我的日子更温暖。"}],"vocab":[{"ru":"утро","zh":"早晨","pos":"сущ."},{"ru":"пешком","zh":"步行","pos":"нар."},{"ru":"сосед","zh":"邻居","pos":"сущ."},{"ru":"улыбаться","zh":"微笑","pos":"глаг."},{"ru":"возвращаться","zh":"返回","pos":"глаг."},{"ru":"перед сном","zh":"睡前","pos":"фраза"}],"sec":19},{"id":"c1-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Привет, Дима! Как дела?","zh":"你好，季马！最近怎么样？","who":"А"},{"ru":"Привет! Всё хорошо, спасибо. А у тебя?","zh":"你好！挺好的，谢谢。你呢？","who":"Б"},{"ru":"Неплохо, только очень устал на работе.","zh":"还不错，就是上班太累了。","who":"А"},{"ru":"Понимаю тебя. Кстати, как твои родители?","zh":"我理解你。对了，你父母怎么样？","who":"Б"},{"ru":"Спасибо, у них всё в порядке.","zh":"谢谢，他们一切都好。","who":"А"},{"ru":"Извини, мне уже пора. До встречи!","zh":"抱歉，我得走了。回头见！","who":"Б"},{"ru":"Пока! Хорошего дня!","zh":"再见！祝你今天愉快！","who":"А"},{"ru":"Спасибо, и тебе всего доброго!","zh":"谢谢，也祝你一切顺利！","who":"Б"},{"ru":"Созвонимся на выходных.","zh":"周末我们通个电话。","who":"А"},{"ru":"Договорились. Пока-пока!","zh":"说定了。拜拜！","who":"Б"}],"vocab":[{"ru":"привет","zh":"你好（熟人之间）","pos":"感叹词"},{"ru":"родители","zh":"父母","pos":"复数名词"},{"ru":"встретиться","zh":"见面","pos":"глаг."},{"ru":"выходные","zh":"周末","pos":"名词（复数）"},{"ru":"устать","zh":"累、疲倦","pos":"动词（完成体）"},{"ru":"До встречи","zh":"回头见","pos":"固定用语"}],"sec":34}]},{"id":"c1-2","title":"Знакомство","titleZh":"自我介绍与认识新朋友","level":"A1","texts":[{"id":"c1-2","kind":"text","label":"短文","sentences":[{"ru":"Меня зовут Ли Мин, я из Китая.","zh":"我叫李明，来自中国。"},{"ru":"Я учусь в Москве уже год.","zh":"我在莫斯科学习已经一年了。"},{"ru":"Здесь меня зовут просто Ли.","zh":"在这里大家就叫我李。"},{"ru":"Вчера я познакомился с новой соседкой.","zh":"昨天我认识了新邻居。"},{"ru":"Её зовут Анна, она студентка.","zh":"她叫安娜，是大学生。"},{"ru":"Мы немного поговорили и обменялись телефонами.","zh":"我们聊了一会儿，交换了电话号码。"}],"vocab":[{"ru":"знакомиться","zh":"认识","pos":"глаг."},{"ru":"соседка","zh":"女邻居","pos":"сущ."},{"ru":"студентка","zh":"女大学生","pos":"сущ."},{"ru":"обменяться","zh":"交换","pos":"глаг."},{"ru":"звать","zh":"叫作","pos":"глаг."},{"ru":"немного","zh":"一点儿","pos":"нар."}],"sec":16},{"id":"c1-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте! Давайте познакомимся. Меня зовут Ли Мин.","zh":"您好！我们认识一下吧。我叫李明。","who":"А"},{"ru":"Очень приятно! Я Анна, можно просто Аня.","zh":"很高兴认识您！我叫安娜，叫我阿尼亚就行。","who":"Б"},{"ru":"Аня, вы тоже работаете в этом отделе?","zh":"阿尼亚，您也在这个部门工作吗？","who":"А"},{"ru":"Да, я здесь уже два года. А вы новенький?","zh":"是的，我在这里已经两年了。您是新来的吗？","who":"Б"},{"ru":"Да, я приехал из Китая, буду работать переводчиком.","zh":"是的，我从中国来，将做翻译工作。","who":"А"},{"ru":"Здорово! У вас очень хороший русский.","zh":"太好了！您的俄语很好。","who":"Б"},{"ru":"Спасибо, я ещё учусь. Можно перейти на «ты»?","zh":"谢谢，我还在学。可以改用「你」相称吗？","who":"А"},{"ru":"Конечно! Давай на «ты». Откуда ты родом?","zh":"当然！我们就用「你」吧。你是哪里人？","who":"Б"},{"ru":"Из Шанхая. Кстати, можно твой номер телефона?","zh":"上海。对了，能给我你的电话号码吗？","who":"А"},{"ru":"Давай я напишу тебе в мессенджере. Диктуй свой номер.","zh":"我在即时通讯软件上给你发消息吧。你说号码。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"проспать","zh":"睡过头","pos":"глаг."},{"ru":"отдел","zh":"部门、科室","pos":"名词（阳）"},{"ru":"новенький","zh":"新来的人","pos":"名词/形容词"},{"ru":"переводчик","zh":"翻译人员","pos":"名词（阳）"},{"ru":"перейти","zh":"转到","pos":"глаг."}],"sec":49}]},{"id":"c1-3","title":"Светская беседа","titleZh":"寒暄闲聊：天气、近况、周末","level":"A2","texts":[{"id":"c1-3","kind":"text","label":"短文","sentences":[{"ru":"В субботу я был на дне рождения у коллеги.","zh":"星期六我参加了同事的生日聚会。"},{"ru":"Мы сидели за большим столом и разговаривали о работе.","zh":"我们围坐在大桌旁聊工作。"},{"ru":"Потом разговор перешёл на погоду и планы на отпуск.","zh":"后来话题转到了天气和休假计划。"},{"ru":"Оказалось, что мы оба любим горы.","zh":"原来我们俩都喜欢山。"},{"ru":"Хозяин рассказал смешную историю про свою первую поездку.","zh":"主人讲了他第一次旅行时的趣事。"},{"ru":"Домой я вернулся поздно, но в хорошем настроении.","zh":"我很晚才回家，但心情很好。"}],"vocab":[{"ru":"смешной","zh":"好笑的","pos":"прил."},{"ru":"коллега","zh":"同事","pos":"сущ."},{"ru":"разговор","zh":"谈话","pos":"сущ."},{"ru":"отпуск","zh":"休假","pos":"сущ."},{"ru":"настроение","zh":"心情","pos":"сущ."},{"ru":"перейти","zh":"转到","pos":"глаг."}],"sec":20},{"id":"c1-3d","kind":"dialog","label":"对话","sentences":[{"ru":"Доброе утро! Какая сегодня холодная погода!","zh":"早上好！今天天气真冷啊！","who":"А"},{"ru":"Да, на улице минус пятнадцать. Надень шапку!","zh":"是啊，外面零下十五度。戴上帽子！","who":"Б"},{"ru":"Уже надел. А вчера было гораздо теплее.","zh":"已经戴上了。可昨天暖和多了。","who":"А"},{"ru":"В Москве погода всегда такая: утром зима, вечером весна.","zh":"莫斯科的天气总这样：早上冬天，晚上春天。","who":"Б"},{"ru":"Кстати, какие планы на выходные?","zh":"对了，周末有什么打算？","who":"А"},{"ru":"Хочу поехать на дачу, а ты?","zh":"我想去郊外小院，你呢？","who":"Б"},{"ru":"Пока не знаю. Может, останусь дома и посмотрю сериал.","zh":"还不知道。也许待在家看剧。","who":"А"},{"ru":"Слушай, поехали вместе! Там будет шашлык.","zh":"哎，一起去吧！那儿会烤肉串。","who":"Б"},{"ru":"Отличная идея! Во сколько выезжаем?","zh":"好主意！几点出发？","who":"А"},{"ru":"В субботу в девять утра у метро.","zh":"周六早上九点，在地铁站。","who":"Б"}],"vocab":[{"ru":"утро","zh":"早晨","pos":"сущ."},{"ru":"холодильник","zh":"冰箱","pos":"сущ."},{"ru":"погода","zh":"天气","pos":"名词（阴）"},{"ru":"улица","zh":"街道","pos":"сущ."},{"ru":"минус","zh":"零下、负号","pos":"名词（阳）"},{"ru":"пятница","zh":"星期五","pos":"сущ."}],"sec":39}]},{"id":"c1-4","title":"Спасибо и извините","titleZh":"感谢、道歉与回应","level":"A1","texts":[{"id":"c1-4","kind":"text","label":"短文","sentences":[{"ru":"Вчера в автобусе я наступил человеку на ногу.","zh":"昨天在公交车上我踩到了别人的脚。"},{"ru":"Я сразу сказал извините.","zh":"我马上说了对不起。"},{"ru":"Он ответил, что ничего страшного.","zh":"他说没关系。"},{"ru":"Потом девушка помогла мне с тяжёлой сумкой.","zh":"后来一个女孩帮我提了很重的包。"},{"ru":"Я сказал ей большое спасибо.","zh":"我对她说了非常感谢。"},{"ru":"Вежливые слова нужны каждый день.","zh":"礼貌的话每天都用得上。"}],"vocab":[{"ru":"наступить","zh":"踩到","pos":"глаг."},{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"страшный","zh":"可怕的","pos":"прил."},{"ru":"помочь","zh":"帮助","pos":"глаг."},{"ru":"тяжёлый","zh":"重的","pos":"прил."},{"ru":"вежливый","zh":"礼貌的","pos":"прил."}],"sec":16},{"id":"c1-4d","kind":"dialog","label":"对话","sentences":[{"ru":"Огромное спасибо за помощь! Без тебя я бы не справился.","zh":"太感谢你帮忙了！没有你我肯定搞不定。","who":"А"},{"ru":"Да что ты, не за что. Это было несложно.","zh":"哪里哪里，不客气。这并不难。","who":"Б"},{"ru":"Нет, серьёзно, ты меня очень выручил.","zh":"不，说真的，你帮了我大忙。","who":"А"},{"ru":"Ладно, обращайся, если что.","zh":"好吧，有事就找我。","who":"Б"},{"ru":"Кстати, извини за вчерашнее опоздание.","zh":"对了，为昨天迟到的事抱歉。","who":"А"},{"ru":"Да ничего страшного, я тоже пришёл позже.","zh":"没什么大不了的，我也来得晚。","who":"Б"},{"ru":"Всё равно неудобно — ты меня ждал двадцать минут.","zh":"还是过意不去——你等了我二十分钟。","who":"А"},{"ru":"Забудь! Главное, что мы всё обсудили.","zh":"忘了吧！重要的是我们把事情都谈完了。","who":"Б"},{"ru":"В следующий раз угощаю кофе.","zh":"下次我请你喝咖啡。","who":"А"},{"ru":"Договорились, с удовольствием.","zh":"说定了，我很乐意。","who":"Б"}],"vocab":[{"ru":"огромное спасибо","zh":"非常感谢","pos":"词组"},{"ru":"выручить","zh":"帮了大忙、解救","pos":"动词（完成体）"},{"ru":"обращаться","zh":"找（某人）、求助于","pos":"动词（未完成体）"},{"ru":"опоздание","zh":"延误","pos":"сущ."},{"ru":"Ничего страшного","zh":"没关系、没什么","pos":"固定用语"},{"ru":"минус","zh":"零下、负号","pos":"名词（阳）"}],"sec":35}]},{"id":"c1-5","title":"Просьба о помощи","titleZh":"请求帮忙与答应、拒绝","level":"A2","texts":[{"id":"c1-5","kind":"text","label":"短文","sentences":[{"ru":"Вчера я не мог открыть дверь в подъезде.","zh":"昨天我打不开单元门。"},{"ru":"Ключ не поворачивался, а телефон разрядился.","zh":"钥匙转不动，手机也没电了。"},{"ru":"Мимо шёл пожилой мужчина.","zh":"一位上了年纪的男士从旁边走过。"},{"ru":"Я попросил его помочь мне.","zh":"我请他帮帮我。"},{"ru":"Он показал, что дверь надо сначала потянуть на себя.","zh":"他示范说门要先往自己这边拉。"},{"ru":"Я поблагодарил его и наконец вошёл домой.","zh":"我谢过他，终于进了家。"}],"vocab":[{"ru":"подъезд","zh":"单元门口","pos":"сущ."},{"ru":"поворачиваться","zh":"转动","pos":"глаг."},{"ru":"разрядиться","zh":"没电","pos":"глаг."},{"ru":"пожилой","zh":"上了年纪的","pos":"прил."},{"ru":"потянуть","zh":"拉一下","pos":"глаг."},{"ru":"поблагодарить","zh":"表示感谢","pos":"глаг."}],"sec":16},{"id":"c1-5d","kind":"dialog","label":"对话","sentences":[{"ru":"Извини, можно тебя попросить?","zh":"抱歉，能请你帮个忙吗？","who":"А"},{"ru":"Конечно, что случилось?","zh":"当然，怎么了？","who":"Б"},{"ru":"Мне нужно перевести этот документ, но у меня совсем нет времени.","zh":"我需要翻译这份文件，可我完全没时间。","who":"А"},{"ru":"Дай посмотрю… Хорошо, я сделаю к вечеру.","zh":"让我看看……好，我傍晚前弄完。","who":"Б"},{"ru":"Спасибо огромное! Я тебе тоже когда-нибудь помогу.","zh":"太感谢了！我以后也会帮你的。","who":"А"},{"ru":"Кстати, ты не мог бы подсказать, где здесь столовая?","zh":"对了，你能告诉我食堂在哪儿吗？","who":"Б"},{"ru":"На втором этаже, справа от лифта.","zh":"二楼，电梯右边。","who":"А"},{"ru":"Спасибо! А то я здесь первый день.","zh":"谢谢！我这是第一天来。","who":"Б"},{"ru":"Если что, спрашивай — я рядом.","zh":"有事就问，我就在旁边。","who":"А"},{"ru":"Договорились, ты очень добр.","zh":"好的，你真好。","who":"Б"}],"vocab":[{"ru":"попросить","zh":"请求、请人帮忙","pos":"动词（完成体）"},{"ru":"конец света","zh":"世界末日","pos":"固定短语"},{"ru":"случиться","zh":"发生","pos":"动词（完成体）"},{"ru":"совсем нет времени","zh":"完全没时间","pos":"词组"},{"ru":"время","zh":"时间","pos":"名词（中）"},{"ru":"огромное спасибо","zh":"非常感谢","pos":"词组"}],"sec":33}]},{"id":"c1-6","title":"Приглашение","titleZh":"邀请与答复","level":"A2","texts":[{"id":"c1-6","kind":"text","label":"短文","sentences":[{"ru":"В пятницу мой друг пригласил меня на ужин.","zh":"星期五朋友请我去吃晚饭。"},{"ru":"Он сказал, что будет готовить плов.","zh":"他说要做抓饭。"},{"ru":"Я спросил, можно ли прийти с женой.","zh":"我问能不能带妻子一起去。"},{"ru":"Друг ответил, что будет очень рад.","zh":"朋友回答说他会很高兴。"},{"ru":"Ужин начнётся в семь часов.","zh":"晚饭七点开始。"},{"ru":"Я обещал прийти вовремя и принести торт.","zh":"我答应准时到，并带上蛋糕。"}],"vocab":[{"ru":"пригласить","zh":"邀请","pos":"глаг."},{"ru":"плов","zh":"抓饭","pos":"сущ."},{"ru":"вовремя","zh":"准时","pos":"нар."},{"ru":"обещать","zh":"答应","pos":"глаг."},{"ru":"рад","zh":"高兴的","pos":"прил."},{"ru":"начаться","zh":"开始","pos":"глаг."}],"sec":16},{"id":"c1-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Привет! В субботу у меня день рождения. Приходи!","zh":"你好！周六是我生日。来吧！","who":"А"},{"ru":"Спасибо за приглашение! Во сколько и где?","zh":"谢谢邀请！几点、在哪儿？","who":"Б"},{"ru":"В семь у меня дома. Будет торт и много гостей.","zh":"七点在我家。会有蛋糕和很多客人。","who":"А"},{"ru":"Здорово! А что подарить?","zh":"太好了！送什么好呢？","who":"Б"},{"ru":"Ничего не надо, просто приходи.","zh":"什么都不用，人来就好。","who":"А"},{"ru":"Ладно, тогда принесу цветы. Можно с подругой?","zh":"好吧，那我带花。可以带女朋友一起来吗？","who":"Б"},{"ru":"Конечно, приходите вдвоём!","zh":"当然，你们俩一起来！","who":"А"},{"ru":"Отлично. А если я немного опоздаю?","zh":"好极了。如果我稍微晚点到行吗？","who":"Б"},{"ru":"Ничего страшного, мы будем дома весь вечер.","zh":"没关系，我们整晚都在家。","who":"А"},{"ru":"Тогда до субботы. Спасибо, что позвал!","zh":"那就周六见。谢谢你邀请我！","who":"Б"}],"vocab":[{"ru":"привет","zh":"你好（熟人之间）","pos":"感叹词"},{"ru":"день рождения","zh":"生日","pos":"фраза"},{"ru":"приходи","zh":"来吧、过来","pos":"动词命令式"},{"ru":"приглашение","zh":"邀请","pos":"名词（中）"},{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"},{"ru":"семья","zh":"家庭","pos":"名词（阴）"}],"sec":38}]},{"id":"c1-7","title":"Согласие и возражение","titleZh":"表达意见：赞同与反对","level":"A2","texts":[{"id":"c1-7","kind":"text","label":"短文","sentences":[{"ru":"На работе мы обсуждали новый проект.","zh":"我们在单位讨论一个新项目。"},{"ru":"Мой начальник предложил начать работу в понедельник.","zh":"我的领导提议周一开始工作。"},{"ru":"Я согласился с ним, потому что сроки очень короткие.","zh":"我同意他，因为时间很紧。"},{"ru":"Однако коллега возразил: у нас ещё нет нужных данных.","zh":"不过同事反对说：我们还没有需要的数据。"},{"ru":"Мы решили сначала собрать информацию.","zh":"我们决定先收集信息。"},{"ru":"Так мы нашли компромисс.","zh":"这样我们找到了折中方案。"}],"vocab":[{"ru":"обсуждать","zh":"讨论","pos":"глаг."},{"ru":"предложить","zh":"提议","pos":"глаг."},{"ru":"согласиться","zh":"同意","pos":"глаг."},{"ru":"возразить","zh":"反驳","pos":"глаг."},{"ru":"срок","zh":"期限","pos":"сущ."},{"ru":"компромисс","zh":"折中","pos":"сущ."}],"sec":18},{"id":"c1-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Как тебе новый фильм? Я в восторге.","zh":"你觉得新电影怎么样？我超喜欢。","who":"А"},{"ru":"Честно говоря, мне не очень понравилось.","zh":"说实话，我不太喜欢。","who":"Б"},{"ru":"Почему? Мне кажется, актёры играют отлично.","zh":"为什么？我觉得演员演得很好。","who":"А"},{"ru":"Согласна, но сюжет слишком предсказуемый.","zh":"我同意，但情节太容易猜到了。","who":"Б"},{"ru":"Тут ты права. А конец? Я такого не ожидал.","zh":"这点你说得对。那结尾呢？我可没料到。","who":"А"},{"ru":"Да, конец неожиданный, с этим не поспоришь.","zh":"是啊，结尾出人意料，这没法反驳。","who":"Б"},{"ru":"В общем, я бы посмотрел ещё раз.","zh":"总的来说，我还会再看一遍。","who":"А"},{"ru":"А я бы лучше книгу прочитала.","zh":"我倒宁愿去读书。","who":"Б"},{"ru":"На вкус и цвет товарищей нет.","zh":"各有所好嘛。","who":"А"},{"ru":"Точно! Спорить не будем.","zh":"没错！咱们不争了。","who":"Б"}],"vocab":[{"ru":"честно говоря","zh":"说实话","pos":"固定用语"},{"ru":"понравиться","zh":"合意、喜欢","pos":"动词（完成体）"},{"ru":"согласиться","zh":"同意","pos":"глаг."},{"ru":"сюжет","zh":"情节","pos":"名词（阳）"},{"ru":"предсказуемый","zh":"可预料的","pos":"形容词"},{"ru":"права","zh":"驾照","pos":"сущ."}],"sec":33}]},{"id":"c1-8","title":"Эмоции и чувства","titleZh":"情绪与感受","level":"B1","texts":[{"id":"c1-8","kind":"text","label":"短文","sentences":[{"ru":"Бывает, что день начинается плохо.","zh":"有时候一天的开头很不顺。"},{"ru":"Утром я проспал, опоздал на автобус и забыл зонт.","zh":"早上我睡过头，误了公交，还忘了伞。"},{"ru":"В такие минуты я чувствую раздражение.","zh":"这种时候我会感到烦躁。"},{"ru":"Но потом я вспоминаю, что настроение можно изменить.","zh":"但之后我会想起，心情是可以改变的。"},{"ru":"Я делаю несколько глубоких вдохов и улыбаюсь.","zh":"我做几次深呼吸，然后微笑。"},{"ru":"Обычно после этого тревога уходит, и я успокаиваюсь.","zh":"通常之后焦虑就散了，我也平静下来。"}],"vocab":[{"ru":"проспать","zh":"睡过头","pos":"глаг."},{"ru":"опоздать","zh":"迟到","pos":"глаг."},{"ru":"раздражение","zh":"烦躁","pos":"сущ."},{"ru":"вздох","zh":"吸气","pos":"сущ."},{"ru":"тревога","zh":"焦虑","pos":"сущ."},{"ru":"успокоиться","zh":"平静下来","pos":"глаг."}],"sec":19},{"id":"c1-8d","kind":"dialog","label":"对话","sentences":[{"ru":"Ты что-то неважно выглядишь. Что случилось?","zh":"你看起来状态不太好。出什么事了？","who":"А"},{"ru":"Да так, на работе завал. Я очень устал и немного нервничаю.","zh":"没什么，单位事情堆成山。我很累，还有点紧张。","who":"Б"},{"ru":"Понимаю. А что именно тебя беспокоит?","zh":"我理解。到底是什么让你不安？","who":"А"},{"ru":"Боюсь, что не успею сдать проект в срок.","zh":"我怕项目赶不上最后期限。","who":"Б"},{"ru":"Не переживай раньше времени! Ты всегда всё успеваешь.","zh":"别提前着急！你总是都能完成。","who":"А"},{"ru":"Спасибо. Мне уже легче.","zh":"谢谢。我好受些了。","who":"Б"},{"ru":"Давай я тебе помогу с графиком.","zh":"我帮你一起看进度表吧。","who":"А"},{"ru":"Правда? Ты меня очень обрадовал.","zh":"真的吗？你让我太高兴了。","who":"Б"},{"ru":"Ну вот, видишь — всё не так страшно!","zh":"你看，并没有那么可怕吧！","who":"А"},{"ru":"Точно, а я так волновался.","zh":"是啊，我还那么紧张。","who":"Б"}],"vocab":[{"ru":"неважно","zh":"不太好、不怎么样","pos":"副词"},{"ru":"выглянуть","zh":"露出","pos":"глаг."},{"ru":"случиться","zh":"发生","pos":"动词（完成体）"},{"ru":"завал","zh":"堆积如山、忙不过来","pos":"名词（阳）"},{"ru":"немного","zh":"一点儿","pos":"нар."},{"ru":"нервничать","zh":"紧张、焦躁","pos":"动词（未完成体）"}],"sec":34}]}]},{"id":"c2","name":"日常生活","nameRu":"Повседневная жизнь","desc":"时间、天气、家庭与住房、一天安排、手机网络、银行、邮局、理发","scenes":[{"id":"c2-1","title":"Время и дата","titleZh":"时间与日期","level":"A1","texts":[{"id":"c2-1","kind":"text","label":"短文","sentences":[{"ru":"Сейчас три часа дня.","zh":"现在是下午三点。"},{"ru":"Я смотрю на часы и понимаю, что опаздываю.","zh":"我看看表，发现我要迟到了。"},{"ru":"Сегодня пятница, двадцать пятое октября.","zh":"今天是十月二十五日，星期五。"},{"ru":"В понедельник у меня экзамен.","zh":"星期一我有考试。"},{"ru":"Время идёт очень быстро.","zh":"时间过得非常快。"},{"ru":"Мне нужно лучше планировать свой день.","zh":"我需要更好地规划一天。"}],"vocab":[{"ru":"час","zh":"小时、点钟","pos":"сущ."},{"ru":"часы","zh":"钟表","pos":"сущ."},{"ru":"опаздывать","zh":"迟到","pos":"глаг."},{"ru":"пятница","zh":"星期五","pos":"сущ."},{"ru":"экзамен","zh":"考试","pos":"сущ."},{"ru":"планировать","zh":"规划","pos":"глаг."}],"sec":15},{"id":"c2-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, вы не подскажете, который час?","zh":"打扰一下，您能告诉我现在几点吗？","who":"А"},{"ru":"Сейчас половина третьего.","zh":"现在两点半。","who":"Б"},{"ru":"Спасибо. А какое сегодня число?","zh":"谢谢。今天几号？","who":"А"},{"ru":"Сегодня пятое октября.","zh":"今天是十月五号。","who":"Б"},{"ru":"А какой день недели?","zh":"星期几？","who":"А"},{"ru":"Понедельник.","zh":"星期一。","who":"Б"},{"ru":"Мне нужно быть в банке к трём. Успею?","zh":"我三点要去银行，来得及吗？","who":"А"},{"ru":"Успеете, если поедете на метро.","zh":"坐地铁就来得及。","who":"Б"},{"ru":"Тогда я выйду через десять минут.","zh":"那我十分钟后出发。","who":"А"},{"ru":"Не забудьте, что в три у них перерыв.","zh":"别忘了他们三点休息。","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"Который час?","zh":"现在几点？","pos":"固定问句"},{"ru":"час","zh":"小时、点钟","pos":"сущ."},{"ru":"половина","zh":"一半","pos":"名词（阴）"},{"ru":"число","zh":"日期；数字","pos":"名词（中）"},{"ru":"пятое","zh":"五号","pos":"序数词"}],"sec":27}]},{"id":"c2-2","title":"Погода и времена года","titleZh":"天气与季节","level":"A1","texts":[{"id":"c2-2","kind":"text","label":"短文","sentences":[{"ru":"Сегодня в Москве холодно и ветрено.","zh":"今天莫斯科又冷又刮风。"},{"ru":"Утром шёл дождь, а днём выглянуло солнце.","zh":"早上下雨，白天太阳出来了。"},{"ru":"Зимой здесь много снега.","zh":"这里的冬天雪很多。"},{"ru":"Летом обычно тепло, но иногда бывает жарко.","zh":"夏天通常温暖，但有时很热。"},{"ru":"Я всегда смотрю прогноз погоды перед выходом.","zh":"出门前我总会看天气预报。"},{"ru":"Поэтому я редко меняю планы.","zh":"所以我很少改计划。"}],"vocab":[{"ru":"ветрено","zh":"刮风","pos":"нар."},{"ru":"дождь","zh":"雨","pos":"сущ."},{"ru":"снег","zh":"雪","pos":"сущ."},{"ru":"прогноз","zh":"预报","pos":"сущ."},{"ru":"выглянуть","zh":"露出","pos":"глаг."},{"ru":"тепло","zh":"温暖","pos":"нар."}],"sec":17},{"id":"c2-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Доброе утро! Какая сегодня погода?","zh":"早上好！今天天气怎么样？","who":"А"},{"ru":"С утра солнечно, но к вечеру обещают дождь.","zh":"早上出太阳，但预报傍晚有雨。","who":"Б"},{"ru":"Опять дождь? Вчера весь день лило.","zh":"又下雨？昨天整整下了一天。","who":"А"},{"ru":"Да, октябрь у нас всегда такой.","zh":"是啊，我们这儿的十月总是这样。","who":"Б"},{"ru":"А зимой здесь холодно?","zh":"那冬天这儿冷吗？","who":"А"},{"ru":"Очень. В январе бывает минус двадцать.","zh":"很冷。一月能到零下二十度。","who":"Б"},{"ru":"Значит, надо покупать тёплую куртку.","zh":"那得买件厚外套了。","who":"А"},{"ru":"Обязательно. И шапку не забудьте.","zh":"一定。还有帽子别忘了。","who":"Б"},{"ru":"Спасибо за совет. Возьму зонт на всякий случай.","zh":"谢谢建议，我带上伞以防万一。","who":"А"},{"ru":"Правильно. Хорошего дня!","zh":"对。祝你今天顺利！","who":"Б"}],"vocab":[{"ru":"утро","zh":"早晨","pos":"сущ."},{"ru":"погода","zh":"天气","pos":"名词（阴）"},{"ru":"солнечно","zh":"晴天（有太阳）","pos":"状态词"},{"ru":"обещать","zh":"答应","pos":"глаг."},{"ru":"дождь","zh":"雨","pos":"сущ."},{"ru":"день рождения","zh":"生日","pos":"фраза"}],"sec":36}]},{"id":"c2-3","title":"Семья и жильё","titleZh":"家庭与住处","level":"A2","texts":[{"id":"c2-3","kind":"text","label":"短文","sentences":[{"ru":"Моя семья живёт в небольшой квартире.","zh":"我家人住在一套不大的公寓里。"},{"ru":"У нас две комнаты, кухня и балкон.","zh":"我们有两个房间、厨房和阳台。"},{"ru":"Окна выходят на тихий двор.","zh":"窗户朝向安静的院子。"},{"ru":"Мама любит цветы, поэтому на балконе много растений.","zh":"妈妈喜欢花，所以阳台上有很多植物。"},{"ru":"Я живу в другой стране, но звоню домой каждый день.","zh":"我住在另一个国家，但每天给家里打电话。"},{"ru":"Мне нравится наш дом, потому что там всегда спокойно.","zh":"我喜欢我们的家，因为那里总是很安静。"}],"vocab":[{"ru":"квартира","zh":"公寓","pos":"сущ."},{"ru":"балкон","zh":"阳台","pos":"сущ."},{"ru":"двор","zh":"院子","pos":"сущ."},{"ru":"растение","zh":"植物","pos":"сущ."},{"ru":"звонить","zh":"打电话","pos":"глаг."},{"ru":"спокойно","zh":"安静地","pos":"нар."}],"sec":18},{"id":"c2-3d","kind":"dialog","label":"对话","sentences":[{"ru":"А где вы живёте?","zh":"您住在哪儿？","who":"А"},{"ru":"В новом районе, недалеко от метро.","zh":"在新小区，离地铁不远。","who":"Б"},{"ru":"Далеко от центра?","zh":"离市中心远吗？","who":"А"},{"ru":"Минут двадцать на метро.","zh":"坐地铁二十分钟。","who":"Б"},{"ru":"Вы живёте один или с семьёй?","zh":"您一个人住还是和家人一起？","who":"А"},{"ru":"С женой и двумя детьми.","zh":"和妻子、两个孩子一起。","who":"Б"},{"ru":"А родители тоже в Москве?","zh":"父母也在莫斯科吗？","who":"А"},{"ru":"Нет, они в Казани, приезжают на праздники.","zh":"不，他们在喀山，过节时过来。","who":"Б"},{"ru":"У вас большая квартира?","zh":"您家房子大吗？","who":"А"},{"ru":"Трёхкомнатная, но кухня маленькая.","zh":"三居室，但厨房小。","who":"Б"}],"vocab":[{"ru":"новогодний","zh":"新年的","pos":"прил."},{"ru":"район","zh":"区；小区","pos":"名词（阳）"},{"ru":"недалеко","zh":"不远","pos":"副词"},{"ru":"метро","zh":"地铁","pos":"сущ."},{"ru":"минус","zh":"零下、负号","pos":"名词（阳）"},{"ru":"семья","zh":"家庭","pos":"名词（阴）"}],"sec":21}]},{"id":"c2-4","title":"Мой день","titleZh":"一天的作息","level":"A1","texts":[{"id":"c2-4","kind":"text","label":"短文","sentences":[{"ru":"Я встаю в семь часов.","zh":"我七点起床。"},{"ru":"Потом я завтракаю и собираюсь на работу.","zh":"然后我吃早饭，准备上班。"},{"ru":"В девять часов я уже сижу за компьютером.","zh":"九点我已经坐在电脑前了。"},{"ru":"В обед я гуляю в парке.","zh":"午休时我在公园散步。"},{"ru":"Вечером я готовлю ужин и читаю книгу.","zh":"晚上我做晚饭、读书。"},{"ru":"В одиннадцать часов я ложусь спать.","zh":"十一点我上床睡觉。"}],"vocab":[{"ru":"вставать","zh":"起床","pos":"глаг."},{"ru":"завтракать","zh":"吃早饭","pos":"глаг."},{"ru":"собираться","zh":"准备","pos":"глаг."},{"ru":"обед","zh":"午饭、午休","pos":"сущ."},{"ru":"готовить","zh":"做（饭）","pos":"глаг."},{"ru":"ложиться спать","zh":"上床睡觉","pos":"фраза"}],"sec":15},{"id":"c2-4d","kind":"dialog","label":"对话","sentences":[{"ru":"Во сколько ты встаёшь?","zh":"你几点起床？","who":"А"},{"ru":"Обычно в семь, но сегодня проспал.","zh":"一般七点，但今天睡过头了。","who":"Б"},{"ru":"Ты завтракаешь дома?","zh":"你在家吃早饭吗？","who":"А"},{"ru":"Только кофе. Нормально ем в обед.","zh":"只喝咖啡。正经吃饭是午饭。","who":"Б"},{"ru":"А во сколько ты ложишься?","zh":"你几点睡？","who":"А"},{"ru":"По-разному. Если работаю до поздна, то в час.","zh":"不一定。要是工作到很晚就一点。","who":"Б"},{"ru":"Я тоже сова. Утром вообще не соображаю.","zh":"我也是夜猫子。早上脑子完全不转。","who":"А"},{"ru":"Тогда тебе лучше не назначать встречи раньше десяти.","zh":"那你最好别约十点前的会。","who":"Б"},{"ru":"Уже понял. Но начальник приходит в восемь.","zh":"已经领教了。可老板八点就到。","who":"А"},{"ru":"Держись! Может, кофе поможет.","zh":"撑着吧！也许咖啡能救你。","who":"Б"}],"vocab":[{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"},{"ru":"семья","zh":"家庭","pos":"名词（阴）"},{"ru":"проспать","zh":"睡过头","pos":"глаг."},{"ru":"кофейня","zh":"咖啡馆","pos":"сущ."},{"ru":"обед","zh":"午饭、午休","pos":"сущ."},{"ru":"час","zh":"小时、点钟","pos":"сущ."}],"sec":33}]},{"id":"c2-5","title":"Телефон и интернет","titleZh":"手机与网络","level":"A2","texts":[{"id":"c2-5","kind":"text","label":"短文","sentences":[{"ru":"Мой телефон всегда со мной.","zh":"我的手机总是随身带着。"},{"ru":"Утром я проверяю сообщения и почту.","zh":"早上我查看消息和邮件。"},{"ru":"Иногда связь в метро плохая.","zh":"有时地铁里信号不好。"},{"ru":"Тогда я скачиваю фильмы заранее.","zh":"那时我会提前下载电影。"},{"ru":"По вечерам я выключаю уведомления.","zh":"晚上我会关掉通知。"},{"ru":"Так я лучше отдыхаю.","zh":"这样我能更好地休息。"}],"vocab":[{"ru":"сообщение","zh":"消息","pos":"сущ."},{"ru":"почта","zh":"邮件","pos":"сущ."},{"ru":"связь","zh":"信号、联系","pos":"сущ."},{"ru":"скачать","zh":"下载","pos":"глаг."},{"ru":"уведомление","zh":"通知","pos":"сущ."},{"ru":"отдыхать","zh":"休息","pos":"глаг."}],"sec":14},{"id":"c2-5d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте! Мне нужна сим-карта с интернетом.","zh":"您好！我需要一张带流量的手机卡。","who":"А"},{"ru":"Паспорт есть? Без него не оформим.","zh":"有护照吗？没有不能办。","who":"Б"},{"ru":"Да, вот. Мне на месяц, десять гигабайт.","zh":"有，给您。我要一个月的，10G。","who":"А"},{"ru":"Тогда возьмите этот тариф. Двести рублей в месяц.","zh":"那办这个套餐吧，每月二百卢布。","who":"Б"},{"ru":"А как пополнить счёт потом?","zh":"以后怎么充值？","who":"А"},{"ru":"Через приложение или в терминале.","zh":"用 App，或者自助终端。","who":"Б"},{"ru":"Интернет здесь работает нормально?","zh":"这里网速还行吗？","who":"А"},{"ru":"В центре хорошо, за городом медленно.","zh":"市中心好，郊区慢。","who":"Б"},{"ru":"А Wi-Fi в кафе бесплатный?","zh":"咖啡馆的 Wi-Fi 免费吗？","who":"А"},{"ru":"Да, пароль обычно на чеке.","zh":"免费，密码一般印在小票上。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"сим-карта","zh":"手机卡","pos":"名词（阴）"},{"ru":"интересный","zh":"有意思的","pos":"形容词"},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"оформить","zh":"整理成","pos":"глаг."},{"ru":"гигабайт","zh":"吉字节、G","pos":"名词（阳）"}],"sec":32}]},{"id":"c2-6","title":"В банке","titleZh":"银行与取钱","level":"A2","texts":[{"id":"c2-6","kind":"text","label":"短文","sentences":[{"ru":"Вчера я пришёл в банк, чтобы открыть счёт.","zh":"昨天我去银行开户。"},{"ru":"Сотрудник спросил мой паспорт и номер телефона.","zh":"工作人员要了我的护照和电话号码。"},{"ru":"Ещё ему нужен был адрес моей квартиры.","zh":"他还需要我公寓的地址。"},{"ru":"Я заполнил анкету и получил карту.","zh":"我填了表，拿到一张卡。"},{"ru":"Теперь я могу платить без наличных.","zh":"现在我可以不用现金付款了。"},{"ru":"Очередь была длинная, но всё прошло быстро.","zh":"队很长，但一切都办得很快。"}],"vocab":[{"ru":"счёт","zh":"账户","pos":"сущ."},{"ru":"сотрудник","zh":"工作人员","pos":"сущ."},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"заполнить анкету","zh":"填表","pos":"фраза"},{"ru":"наличные","zh":"现金","pos":"сущ."},{"ru":"очередь","zh":"队伍","pos":"сущ."}],"sec":17},{"id":"c2-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, где здесь ближайший банкомат?","zh":"请问最近的取款机在哪？","who":"А"},{"ru":"За углом, в том же здании, что и аптека.","zh":"拐角那儿，和药店同一栋楼。","who":"Б"},{"ru":"Спасибо. А он принимает иностранные карты?","zh":"谢谢。它收外国卡吗？","who":"А"},{"ru":"Должен, но лучше попробуйте другой на всякий случай.","zh":"应该收，不过最好再试一台。","who":"Б"},{"ru":"Мне нужно снять двадцать тысяч рублей.","zh":"我要取两万卢布。","who":"А"},{"ru":"Учтите, что комиссия может быть большая.","zh":"注意手续费可能很高。","who":"Б"},{"ru":"А можно открыть счёт? Я здесь на полгода.","zh":"能开户吗？我要在这待半年。","who":"А"},{"ru":"С паспортом и визой — можно.","zh":"有护照和签证就可以。","who":"Б"},{"ru":"Сколько это займёт времени?","zh":"要办多久？","who":"А"},{"ru":"Минут сорок, если всё в порядке.","zh":"顺利的话四十分钟。","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"банкомат","zh":"取款机","pos":"名词（阳）"},{"ru":"случиться","zh":"发生","pos":"动词（完成体）"},{"ru":"снять","zh":"取（钱）","pos":"动词（完成体）"},{"ru":"комиссия","zh":"手续费","pos":"名词（阴）"},{"ru":"быть в восторге","zh":"非常喜欢、为之兴奋","pos":"词组"}],"sec":31}]},{"id":"c2-7","title":"Почта и посылки","titleZh":"邮局与快递","level":"B1","texts":[{"id":"c2-7","kind":"text","label":"短文","sentences":[{"ru":"В прошлом месяце я заказал книги из Петербурга.","zh":"上个月我从彼得堡订了书。"},{"ru":"Через неделю пришло сообщение о посылке.","zh":"一周后来了包裹到达的短信。"},{"ru":"На почте нужен был код, который пришёл по телефону.","zh":"邮局需要手机收到的一个取件码。"},{"ru":"Но моя фамилия в квитанции была написана с ошибкой.","zh":"但单据上我的姓写错了。"},{"ru":"Сотрудница попросила паспорт и всё исправила.","zh":"女工作人员要了护照，把错误改好了。"},{"ru":"Через несколько минут я ушёл домой с посылкой.","zh":"几分钟后我抱着包裹回家了。"}],"vocab":[{"ru":"посылка","zh":"包裹","pos":"сущ."},{"ru":"квитанция","zh":"单据","pos":"сущ."},{"ru":"фамилия","zh":"姓","pos":"сущ."},{"ru":"ошибка","zh":"错误","pos":"сущ."},{"ru":"исправить","zh":"改正","pos":"глаг."},{"ru":"заказать","zh":"订购","pos":"глаг."}],"sec":18},{"id":"c2-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Мне нужно отправить посылку в Китай.","zh":"我要往中国寄一个包裹。","who":"А"},{"ru":"Что внутри? Продукты или вещи?","zh":"里面是什么？食品还是物品？","who":"Б"},{"ru":"Только книги и одежда.","zh":"只有书和衣服。","who":"А"},{"ru":"Заполните бланк, и мы взвесим.","zh":"填一下单子，我们称重。","who":"Б"},{"ru":"А сколько идёт посылка?","zh":"包裹要走多久？","who":"А"},{"ru":"Обычно две-три недели.","zh":"一般两到三周。","who":"Б"},{"ru":"Можно отследить по номеру?","zh":"能用单号追踪吗？","who":"А"},{"ru":"Да, трек-номер будет на чеке.","zh":"可以，单号在小票上。","who":"Б"},{"ru":"А как получить посылку, если пришло извещение?","zh":"收到通知单后怎么取？","who":"А"},{"ru":"С паспортом на почту, в окно номер два.","zh":"带护照来邮局，二号窗口。","who":"Б"}],"vocab":[{"ru":"отправить","zh":"寄出、发送","pos":"动词（完成体）"},{"ru":"посылка","zh":"包裹","pos":"сущ."},{"ru":"внутри","zh":"在里面","pos":"副词/前置词"},{"ru":"заполнить анкету","zh":"填表","pos":"фраза"},{"ru":"бланк","zh":"表格、单据","pos":"名词（阳）"},{"ru":"взвесить","zh":"称重","pos":"动词（完成体）"}],"sec":23}]},{"id":"c2-8","title":"В парикмахерской","titleZh":"理发与美容","level":"B1","texts":[{"id":"c2-8","kind":"text","label":"短文","sentences":[{"ru":"Перед праздником я решил подстричься.","zh":"节日前我决定去理发。"},{"ru":"В салоне девушка спросила, что я хочу.","zh":"在店里，女孩问我想怎么剪。"},{"ru":"Я показал фотографию и попросил сделать немного короче.","zh":"我给她看一张照片，请她剪短一点。"},{"ru":"Она выслушала меня и сразу поняла.","zh":"她听完就明白了。"},{"ru":"Через полчаса всё было готово.","zh":"半小时后一切就好了。"},{"ru":"Я посмотрел в зеркало и остался доволен.","zh":"我照了照镜子，很满意。"}],"vocab":[{"ru":"подстричься","zh":"理发","pos":"глаг."},{"ru":"салон","zh":"美发店","pos":"сущ."},{"ru":"выслушать","zh":"听完","pos":"глаг."},{"ru":"короче","zh":"更短","pos":"нар."},{"ru":"зеркало","zh":"镜子","pos":"сущ."},{"ru":"довольный","zh":"满意的","pos":"прил."}],"sec":15},{"id":"c2-8d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, я записан на стрижку.","zh":"您好，我预约了理发。","who":"А"},{"ru":"На какое время?","zh":"几点？","who":"Б"},{"ru":"На четыре часа. Меня зовут Ли.","zh":"四点，我姓李。","who":"А"},{"ru":"Проходите. Как будем стричь?","zh":"请坐。怎么剪？","who":"Б"},{"ru":"Коротко по бокам, сверху оставьте длину.","zh":"两边剪短，上面留长。","who":"А"},{"ru":"А чёлку?","zh":"刘海呢？","who":"Б"},{"ru":"Чёлку не трогайте, просто подровняйте.","zh":"刘海别动，修齐一下就好。","who":"А"},{"ru":"Хорошо. Бороду тоже подстричь?","zh":"好。胡子也修吗？","who":"Б"},{"ru":"Да, пожалуйста. И можно помыть голову?","zh":"修，谢谢。能洗个头吗？","who":"А"},{"ru":"Конечно. Присядьте, сейчас всё сделаем.","zh":"当然。您坐，马上就好。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"время","zh":"时间","pos":"名词（中）"},{"ru":"час","zh":"小时、点钟","pos":"сущ."},{"ru":"прохожий","zh":"路人","pos":"сущ."},{"ru":"стричь","zh":"剪","pos":"动词（未完成体）"},{"ru":"короче","zh":"更短","pos":"нар."}],"sec":27}]}]},{"id":"c3","name":"饮食与购物","nameRu":"Еда и покупки","desc":"咖啡馆、快餐、餐厅、超市、市场、买衣服、网购、做客","scenes":[{"id":"c3-1","title":"В кофейне","titleZh":"咖啡店点单","level":"A1","texts":[{"id":"c3-1","kind":"text","label":"短文","sentences":[{"ru":"Утром я захожу в маленькую кофейню.","zh":"早上我走进一家小咖啡馆。"},{"ru":"Там всегда пахнет кофе и хлебом.","zh":"那里总飘着咖啡和面包的香味。"},{"ru":"Я беру большую чашку и сэндвич с сыром.","zh":"我要一大杯咖啡和一个奶酪三明治。"},{"ru":"Девушка за стойкой спрашивает, буду ли я есть здесь.","zh":"柜台后的女孩问我要不要在这里吃。"},{"ru":"Я говорю да и сажусь у окна.","zh":"我说要，然后坐到窗边。"},{"ru":"Так начинается мой хороший день.","zh":"我美好的一天就这样开始。"}],"vocab":[{"ru":"кофейня","zh":"咖啡馆","pos":"сущ."},{"ru":"пахнуть","zh":"散发气味","pos":"глаг."},{"ru":"чашка","zh":"杯子","pos":"сущ."},{"ru":"сэндвич","zh":"三明治","pos":"сущ."},{"ru":"стойка","zh":"柜台","pos":"сущ."},{"ru":"садиться","zh":"坐下","pos":"глаг."}],"sec":17},{"id":"c3-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте! Большой капучино, пожалуйста.","zh":"您好！请给我一个大杯卡布奇诺。","who":"А"},{"ru":"С собой или здесь?","zh":"外带还是堂食？","who":"Б"},{"ru":"С собой. И один круассан.","zh":"外带。再来一个可颂。","who":"А"},{"ru":"Что-нибудь ещё?","zh":"还要别的吗？","who":"Б"},{"ru":"Дайте, пожалуйста, стакан воды.","zh":"请再给一杯水。","who":"А"},{"ru":"Оплата картой или наличными?","zh":"刷卡还是现金？","who":"Б"},{"ru":"Картой. Можно без сахара?","zh":"刷卡。可以不加糖吗？","who":"А"},{"ru":"Конечно. Заказ будет через минуту.","zh":"当然。您的东西一分钟就好。","who":"Б"},{"ru":"Спасибо! А где можно взять салфетки?","zh":"谢谢！纸巾在哪拿？","who":"А"},{"ru":"У стойки выдачи, справа.","zh":"取餐台那边，右手边。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"капучино","zh":"卡布奇诺","pos":"名词（中，不变）"},{"ru":"круассан","zh":"可颂、牛角包","pos":"名词（阳）"},{"ru":"стакан","zh":"杯子","pos":"名词（阳）"},{"ru":"оплатить","zh":"付款","pos":"глаг."},{"ru":"наличные","zh":"现金","pos":"сущ."}],"sec":31}]},{"id":"c3-2","title":"В фастфуде","titleZh":"快餐厅","level":"A1","texts":[{"id":"c3-2","kind":"text","label":"短文","sentences":[{"ru":"Иногда я обедаю в фастфуде.","zh":"有时我在快餐店吃午饭。"},{"ru":"Меню я знаю уже наизусть.","zh":"菜单我已经背下来了。"},{"ru":"Я заказываю бургер, картошку и воду.","zh":"我点汉堡、薯条和水。"},{"ru":"Оплатить можно картой или наличными.","zh":"可以用卡或现金付款。"},{"ru":"Еду отдают через пять минут.","zh":"餐五分钟后就出。"},{"ru":"Это быстро, но я не ем так каждый день.","zh":"这样很快，但我不是每天都吃。"}],"vocab":[{"ru":"фастфуд","zh":"快餐","pos":"сущ."},{"ru":"меню","zh":"菜单","pos":"сущ."},{"ru":"заказывать","zh":"点餐","pos":"глаг."},{"ru":"картошка","zh":"土豆、薯条","pos":"сущ."},{"ru":"оплатить","zh":"付款","pos":"глаг."},{"ru":"наизусть","zh":"背熟","pos":"нар."}],"sec":16},{"id":"c3-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Мне, пожалуйста, бургер и картошку.","zh":"请给我一个汉堡和薯条。","who":"А"},{"ru":"Напиток?","zh":"饮料？","who":"Б"},{"ru":"Колу без льда.","zh":"可乐，不加冰。","who":"А"},{"ru":"Здесь или с собой?","zh":"堂食还是外带？","who":"Б"},{"ru":"С собой. Сколько с меня?","zh":"外带。一共多少钱？","who":"А"},{"ru":"Четыреста пятьдесят рублей.","zh":"四百五十卢布。","who":"Б"},{"ru":"Можно оплатить телефоном?","zh":"能用手机付吗？","who":"А"},{"ru":"Да, приложите к терминалу.","zh":"可以，贴一下终端。","who":"Б"},{"ru":"Спасибо. А где соус?","zh":"谢谢。酱在哪？","who":"А"},{"ru":"На стойке выдачи, справа от кассы.","zh":"取餐台上，收银台右边。","who":"Б"}],"vocab":[{"ru":"бургер","zh":"汉堡","pos":"名词（阳）"},{"ru":"напиток","zh":"饮料","pos":"сущ."},{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"},{"ru":"оплатить","zh":"付款","pos":"глаг."},{"ru":"тележка","zh":"购物车","pos":"сущ."},{"ru":"приложение","zh":"手机应用","pos":"名词（中）"}],"sec":24}]},{"id":"c3-3","title":"В ресторане","titleZh":"餐厅正餐","level":"A2","texts":[{"id":"c3-3","kind":"text","label":"短文","sentences":[{"ru":"В субботу мы с другом были в ресторане.","zh":"星期六我和朋友去了一家餐厅。"},{"ru":"Официант принёс меню и спросил, нужны ли напитки.","zh":"服务员拿来菜单，问要不要饮料。"},{"ru":"Я заказал суп, рыбу и зелёный чай.","zh":"我点了汤、鱼和绿茶。"},{"ru":"Друг взял салат и мясо.","zh":"朋友点了沙拉和肉。"},{"ru":"Еда была вкусной, а музыка тихой.","zh":"菜很好吃，音乐很轻柔。"},{"ru":"Счёт мы разделили пополам.","zh":"账单我们平分了。"}],"vocab":[{"ru":"официант","zh":"服务员","pos":"сущ."},{"ru":"напиток","zh":"饮料","pos":"сущ."},{"ru":"суп","zh":"汤","pos":"сущ."},{"ru":"счёт","zh":"账单","pos":"сущ."},{"ru":"разделить","zh":"分","pos":"глаг."},{"ru":"вкусный","zh":"好吃的","pos":"прил."}],"sec":16},{"id":"c3-3d","kind":"dialog","label":"对话","sentences":[{"ru":"Добрый вечер! У вас есть столик на двоих?","zh":"晚上好！有两人的位子吗？","who":"А"},{"ru":"Есть у окна. Проходите, пожалуйста.","zh":"窗边有一个。请这边走。","who":"Б"},{"ru":"Спасибо. Дайте, пожалуйста, меню.","zh":"谢谢。请给我菜单。","who":"А"},{"ru":"Вот меню. Что-нибудь посоветовать?","zh":"这是菜单。需要我推荐吗？","who":"Б"},{"ru":"Да, что вы посоветуете из горячего?","zh":"好，热菜您推荐什么？","who":"А"},{"ru":"Попробуйте борщ и пельмени.","zh":"试试红菜汤和饺子。","who":"Б"},{"ru":"Хорошо: борщ, пельмени и салат.","zh":"好：红菜汤、饺子，再来个沙拉。","who":"А"},{"ru":"Что-нибудь выпить?","zh":"喝点什么？","who":"Б"},{"ru":"Чай с лимоном, пожалуйста.","zh":"请来一杯柠檬茶。","who":"А"},{"ru":"Счёт принести сразу или потом?","zh":"账单现在拿还是等会儿？","who":"Б"}],"vocab":[{"ru":"столик","zh":"小桌；位子","pos":"名词（阳）"},{"ru":"прохожий","zh":"路人","pos":"сущ."},{"ru":"меню","zh":"菜单","pos":"сущ."},{"ru":"посоветовать","zh":"建议、推荐","pos":"动词（完成体）"},{"ru":"горячее","zh":"热菜","pos":"中性名词"},{"ru":"борщ","zh":"红菜汤","pos":"名词（阳）"}],"sec":30}]},{"id":"c3-4","title":"В супермаркете","titleZh":"超市购物","level":"A2","texts":[{"id":"c3-4","kind":"text","label":"短文","sentences":[{"ru":"Вечером я иду в супермаркет за продуктами.","zh":"晚上我去超市买食品。"},{"ru":"Мне нужны молоко, сыр, яйца и овощи.","zh":"我需要牛奶、奶酪、鸡蛋和蔬菜。"},{"ru":"В зале я долго выбираю яблоки.","zh":"在卖场里我挑苹果挑了很久。"},{"ru":"Потом я стою в очереди у кассы.","zh":"然后在收银台排队。"},{"ru":"Тележку я оставляю у входа.","zh":"我把购物车留在入口处。"},{"ru":"Дома я сразу кладу продукты в холодильник.","zh":"回家我把食品马上放进冰箱。"}],"vocab":[{"ru":"супермаркет","zh":"超市","pos":"сущ."},{"ru":"овощи","zh":"蔬菜","pos":"сущ."},{"ru":"выбирать","zh":"挑选","pos":"глаг."},{"ru":"касса","zh":"收银台","pos":"сущ."},{"ru":"тележка","zh":"购物车","pos":"сущ."},{"ru":"холодильник","zh":"冰箱","pos":"сущ."}],"sec":16},{"id":"c3-4d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, где у вас хлеб?","zh":"请问面包在哪？","who":"А"},{"ru":"В третьем ряду, слева.","zh":"第三排，左边。","who":"Б"},{"ru":"А молоко?","zh":"牛奶呢？","who":"А"},{"ru":"В холодильнике у входа.","zh":"入口处的冷柜里。","who":"Б"},{"ru":"Спасибо. У вас есть пакеты?","zh":"谢谢。有购物袋吗？","who":"А"},{"ru":"Да, на кассе. Пакет стоит пять рублей.","zh":"有，在收银台。袋子五卢布。","who":"Б"},{"ru":"Хорошо, один пакет. Ещё нужна скидочная карта.","zh":"好，一个袋子。我还需要会员卡。","who":"А"},{"ru":"Она бесплатная, оформите на кассе.","zh":"免费的，在收银台办。","who":"Б"},{"ru":"Сколько с меня?","zh":"一共多少钱？","who":"А"},{"ru":"Тысяча двести сорок рублей.","zh":"一千二百四十卢布。","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"хлеб","zh":"面包","pos":"名词（阳）"},{"ru":"ряд","zh":"排、货架行","pos":"名词（阳）"},{"ru":"слева","zh":"在左边","pos":"副词"},{"ru":"холодильник","zh":"冰箱","pos":"сущ."},{"ru":"вход","zh":"入口","pos":"名词（阳）"}],"sec":26}]},{"id":"c3-5","title":"На рынке","titleZh":"菜市场与讨价还价","level":"B1","texts":[{"id":"c3-5","kind":"text","label":"短文","sentences":[{"ru":"В воскресенье я люблю ходить на рынок.","zh":"星期天我喜欢去市场。"},{"ru":"Там продукты свежее, а цены часто ниже.","zh":"那里的食品更新鲜，价格常常更低。"},{"ru":"Продавец предлагает попробовать мёд.","zh":"摊主会请我尝尝蜂蜜。"},{"ru":"Обычно можно немного поторговаться.","zh":"通常还可以稍微讲价。"},{"ru":"Я покупаю мёд, орехи и зелень.","zh":"我买了蜂蜜、坚果和青菜。"},{"ru":"Продавец улыбается и делает мне скидку.","zh":"摊主笑了，还给我打了折。"}],"vocab":[{"ru":"рынок","zh":"市场","pos":"сущ."},{"ru":"свежий","zh":"新鲜的","pos":"прил."},{"ru":"продавец","zh":"卖家","pos":"сущ."},{"ru":"попробовать","zh":"尝一尝","pos":"глаг."},{"ru":"торговаться","zh":"讲价","pos":"глаг."},{"ru":"скидка","zh":"折扣","pos":"сущ."}],"sec":16},{"id":"c3-5d","kind":"dialog","label":"对话","sentences":[{"ru":"Скажите, почём помидоры?","zh":"请问西红柿怎么卖？","who":"А"},{"ru":"Двести пятьдесят за кило.","zh":"一公斤二百五。","who":"Б"},{"ru":"Дорого. А если два кило?","zh":"贵了。买两公斤呢？","who":"А"},{"ru":"Тогда по двести тридцать.","zh":"那就按二百三。","who":"Б"},{"ru":"Хорошо. И огурцы свежие?","zh":"好。黄瓜新鲜吗？","who":"А"},{"ru":"Свежайшие, с утра привезли.","zh":"特别新鲜，早上刚到的。","who":"Б"},{"ru":"Дайте кило огурцов и пучок укропа.","zh":"来一公斤黄瓜和一把莳萝。","who":"А"},{"ru":"Что-нибудь ещё?","zh":"还要点什么？","who":"Б"},{"ru":"Пока всё. Сколько с меня?","zh":"就这些。多少钱？","who":"А"},{"ru":"Сто восемьдесят. Пакет нужен?","zh":"一百八。要袋子吗？","who":"Б"}],"vocab":[{"ru":"почём","zh":"多少钱（按重量）","pos":"疑问副词（口语）"},{"ru":"помидор","zh":"西红柿","pos":"名词（阳）"},{"ru":"кило","zh":"公斤","pos":"名词（中，口语）"},{"ru":"огурец","zh":"黄瓜","pos":"名词（阳）"},{"ru":"свежий","zh":"新鲜的","pos":"прил."},{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"}],"sec":24}]},{"id":"c3-6","title":"В магазине одежды","titleZh":"服装店试穿退换","level":"A2","texts":[{"id":"c3-6","kind":"text","label":"短文","sentences":[{"ru":"Мне нужно было купить тёплую куртку.","zh":"我需要买一件保暖外套。"},{"ru":"В магазине я долго выбирал размер и цвет.","zh":"在店里我挑了很久尺码和颜色。"},{"ru":"Продавец помог мне найти мой размер.","zh":"店员帮我找到了我的尺码。"},{"ru":"Куртка хорошо сидела, но была дорогой.","zh":"外套很合身，但很贵。"},{"ru":"Поэтому я спросил про скидки.","zh":"所以我问了问折扣。"},{"ru":"В итоге я купил её дешевле.","zh":"最后我以更便宜的价格买下了。"}],"vocab":[{"ru":"куртка","zh":"外套","pos":"сущ."},{"ru":"размер","zh":"尺码","pos":"сущ."},{"ru":"цвет","zh":"颜色","pos":"сущ."},{"ru":"сидеть","zh":"合身","pos":"глаг."},{"ru":"дорогой","zh":"贵的","pos":"прил."},{"ru":"в итоге","zh":"最后","pos":"фраза"}],"sec":15},{"id":"c3-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, можно померить эту куртку?","zh":"请问这件外套能试吗？","who":"А"},{"ru":"Конечно, примерочная справа.","zh":"当然，试衣间在右边。","who":"Б"},{"ru":"Спасибо. Есть та же модель, но другого цвета?","zh":"谢谢。同款有别的颜色吗？","who":"А"},{"ru":"Есть чёрная и синяя.","zh":"有黑色和蓝色。","who":"Б"},{"ru":"А побольше нет? Узко в плечах.","zh":"有大一号的吗？肩膀窄。","who":"А"},{"ru":"Возьмите на размер больше.","zh":"拿大一号试试。","who":"Б"},{"ru":"Так лучше. А можно вернуть, если не подойдёт?","zh":"这样好些。不合适能退吗？","who":"А"},{"ru":"Да, в течение четырнадцати дней с чеком.","zh":"可以，十四天内凭小票。","who":"Б"},{"ru":"Отлично, беру. Где оплатить?","zh":"太好了，我要了。在哪付款？","who":"А"},{"ru":"На кассе у выхода.","zh":"出口的收银台。","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"померить","zh":"试穿","pos":"动词（完成体）"},{"ru":"куртка","zh":"外套","pos":"сущ."},{"ru":"конец света","zh":"世界末日","pos":"固定短语"},{"ru":"примерочная","zh":"试衣间","pos":"名词（阴）"},{"ru":"цвет","zh":"颜色","pos":"сущ."}],"sec":30}]},{"id":"c3-7","title":"Онлайн-покупки","titleZh":"网购与自提","level":"A2","texts":[{"id":"c3-7","kind":"text","label":"短文","sentences":[{"ru":"Большинство вещей я покупаю в интернете.","zh":"大多数东西我在网上买。"},{"ru":"Сначала я читаю отзывы и сравниваю цены.","zh":"先看评价，再比较价格。"},{"ru":"Потом заказываю и жду доставку.","zh":"然后下单，等快递。"},{"ru":"Однажды посылка пришла с опозданием на неделю.","zh":"有一次包裹晚到了一周。"},{"ru":"Я написал продавцу, и он вернул часть денег.","zh":"我给卖家写了消息，他退回了一部分钱。"},{"ru":"Теперь я всегда проверяю рейтинг магазина.","zh":"现在我总是先看店铺评分。"}],"vocab":[{"ru":"отзыв","zh":"评价","pos":"сущ."},{"ru":"сравнивать","zh":"比较","pos":"глаг."},{"ru":"доставка","zh":"配送","pos":"сущ."},{"ru":"опоздание","zh":"延误","pos":"сущ."},{"ru":"вернуть","zh":"退回","pos":"глаг."},{"ru":"рейтинг","zh":"评分","pos":"сущ."}],"sec":17},{"id":"c3-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, я пришёл за заказом.","zh":"您好，我来取订单。","who":"А"},{"ru":"Назовите номер заказа, пожалуйста.","zh":"请说一下订单号。","who":"Б"},{"ru":"Номер семьсот тридцать два.","zh":"号码七三二。","who":"А"},{"ru":"Сейчас найдём. Паспорт с собой?","zh":"我查一下。带护照了吗？","who":"Б"},{"ru":"Да, вот. Можно проверить товар?","zh":"带了。能验货吗？","who":"А"},{"ru":"Конечно. Если что-то не так, оформим возврат.","zh":"当然。要是有问题就办退货。","who":"Б"},{"ru":"Размер не тот, я заказывал другой.","zh":"尺码不对，我订的是另一个。","who":"А"},{"ru":"Тогда напишите заявление на возврат.","zh":"那填一份退货申请。","who":"Б"},{"ru":"Хорошо. Деньги вернутся на карту?","zh":"好。钱退到卡上吗？","who":"А"},{"ru":"Да, в течение пяти дней.","zh":"是的，五天内。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"заказ","zh":"订单","pos":"名词（阳）"},{"ru":"номер","zh":"房间号","pos":"сущ."},{"ru":"семья","zh":"家庭","pos":"名词（阴）"},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"проверить","zh":"检查","pos":"动词（完成体）"}],"sec":30}]},{"id":"c3-8","title":"В гостях","titleZh":"请客与做客吃饭","level":"B1","texts":[{"id":"c3-8","kind":"text","label":"短文","sentences":[{"ru":"В прошлую субботу меня пригласили в гости.","zh":"上周六有人请我去做客。"},{"ru":"Я пришёл с тортом и цветами.","zh":"我带着蛋糕和花去了。"},{"ru":"Хозяйка приготовила много вкусного.","zh":"女主人做了很多好吃的。"},{"ru":"Мы долго разговаривали и смотрели фотографии.","zh":"我们聊了很久，还看了照片。"},{"ru":"Перед уходом я помог убрать со стола.","zh":"走之前我帮忙收拾了桌子。"},{"ru":"Меня пригласили прийти ещё раз.","zh":"他们请我下次再来。"}],"vocab":[{"ru":"в гостях","zh":"做客","pos":"фраза"},{"ru":"хозяйка","zh":"女主人","pos":"сущ."},{"ru":"приготовить","zh":"做好（饭菜）","pos":"глаг."},{"ru":"убрать","zh":"收拾","pos":"глаг."},{"ru":"перед уходом","zh":"走之前","pos":"фраза"},{"ru":"ещё раз","zh":"再一次","pos":"фраза"}],"sec":14},{"id":"c3-8d","kind":"dialog","label":"对话","sentences":[{"ru":"Спасибо, что пригласили!","zh":"谢谢邀请！","who":"А"},{"ru":"Проходите, не стесняйтесь. Разувайтесь здесь.","zh":"快进来，别客气。在这儿脱鞋。","who":"Б"},{"ru":"Это вам: немного цветов и торт.","zh":"这是给您的：一点花和一个蛋糕。","who":"А"},{"ru":"Ой, спасибо, не надо было!","zh":"哎呀谢谢，太客气了！","who":"Б"},{"ru":"Пахнет очень вкусно.","zh":"闻着真香。","who":"А"},{"ru":"Садитесь, я сейчас всё подам.","zh":"请坐，我马上端上来。","who":"Б"},{"ru":"Можно я помогу?","zh":"要我帮忙吗？","who":"А"},{"ru":"Нет-нет, вы гость. Угощайтесь!","zh":"不用不用，您是客人。随便吃！","who":"Б"},{"ru":"Всё очень вкусно, особенно салат.","zh":"都很好吃，尤其是沙拉。","who":"А"},{"ru":"Это семейный рецепт. Ещё добавки?","zh":"这是家里的做法。再来点吗？","who":"Б"}],"vocab":[{"ru":"прохожий","zh":"路人","pos":"сущ."},{"ru":"стесняться","zh":"拘束、不好意思","pos":"动词（未完成体）"},{"ru":"разуваться","zh":"脱鞋","pos":"动词（未完成体）"},{"ru":"немного","zh":"一点儿","pos":"нар."},{"ru":"цвет","zh":"颜色","pos":"сущ."},{"ru":"пахнуть","zh":"散发气味","pos":"глаг."}],"sec":26}]}]},{"id":"c4","name":"出行与住宿","nameRu":"Транспорт и жильё","desc":"问路、公共交通、出租车、火车、机场、旅馆、租房、开车加油","scenes":[{"id":"c4-1","title":"Как пройти","titleZh":"问路","level":"A2","texts":[{"id":"c4-1","kind":"text","label":"短文","sentences":[{"ru":"Вчера я искал новый магазин в центре города.","zh":"昨天我在市中心找一家新商店。"},{"ru":"Я спросил у прохожего, как пройти к площади.","zh":"我问一个路人怎么去广场。"},{"ru":"Он объяснил, что нужно идти прямо и потом повернуть налево.","zh":"他说一直往前走，然后左转。"},{"ru":"Я перепутал поворот и заблудился.","zh":"我拐错了弯，迷路了。"},{"ru":"Тогда я открыл карту в телефоне.","zh":"于是我打开了手机地图。"},{"ru":"Через десять минут я наконец нашёл нужный дом.","zh":"十分钟后我终于找到了那栋房子。"}],"vocab":[{"ru":"прохожий","zh":"路人","pos":"сущ."},{"ru":"площадь","zh":"广场","pos":"сущ."},{"ru":"повернуть","zh":"转弯","pos":"глаг."},{"ru":"перепутать","zh":"弄错","pos":"глаг."},{"ru":"заблудиться","zh":"迷路","pos":"глаг."},{"ru":"наконец","zh":"终于","pos":"нар."}],"sec":18},{"id":"c4-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, как дойти до Красной площади?","zh":"请问怎么走到红场？","who":"А"},{"ru":"Идите прямо, потом повернёте направо.","zh":"一直走，然后右转。","who":"Б"},{"ru":"Далеко отсюда?","zh":"离这儿远吗？","who":"А"},{"ru":"Минут пятнадцать пешком.","zh":"走路十五分钟。","who":"Б"},{"ru":"А на автобусе?","zh":"坐公交呢？","who":"А"},{"ru":"Можно на тройке, две остановки.","zh":"可以刷交通卡，坐两站。","who":"Б"},{"ru":"Простите, я не понял, где остановка?","zh":"不好意思，我没听懂，车站在哪？","who":"А"},{"ru":"Вон там, за углом, около банка.","zh":"在那边，拐角后面，银行旁边。","who":"Б"},{"ru":"Спасибо большое! Вы очень добры.","zh":"非常感谢！您人真好。","who":"А"},{"ru":"Не за что. Счастливого пути!","zh":"不客气。一路顺风！","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"дойти","zh":"走到","pos":"动词（完成体）"},{"ru":"красивый","zh":"漂亮的","pos":"形容词"},{"ru":"площадь","zh":"广场","pos":"сущ."},{"ru":"прямо","zh":"一直、直走","pos":"副词"},{"ru":"повернуть","zh":"转弯","pos":"глаг."}],"sec":26}]},{"id":"c4-2","title":"Общественный транспорт","titleZh":"公共交通","level":"A1","texts":[{"id":"c4-2","kind":"text","label":"短文","sentences":[{"ru":"Я езжу на работу на метро.","zh":"我坐地铁上班。"},{"ru":"Утром в метро много людей.","zh":"早上地铁里人很多。"},{"ru":"Я покупаю билет на месяц.","zh":"我买一张月票。"},{"ru":"Поезда приходят каждые две минуты.","zh":"列车每两分钟来一趟。"},{"ru":"В вагоне я обычно читаю книгу.","zh":"在车厢里我通常看书。"},{"ru":"Иногда я езжу на автобусе, но он идёт медленнее.","zh":"有时我也坐公交，但它更慢。"}],"vocab":[{"ru":"метро","zh":"地铁","pos":"сущ."},{"ru":"билет","zh":"票","pos":"сущ."},{"ru":"поезд","zh":"列车","pos":"сущ."},{"ru":"вагон","zh":"车厢","pos":"сущ."},{"ru":"автобус","zh":"公交车","pos":"сущ."},{"ru":"медленно","zh":"慢","pos":"нар."}],"sec":15},{"id":"c4-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Скажите, эта электричка идёт до вокзала?","zh":"请问这趟通勤车到火车站吗？","who":"А"},{"ru":"Нет, вам нужна следующая, на соседнем пути.","zh":"不到，您要坐下一趟，在旁边站台。","who":"Б"},{"ru":"А сколько стоит билет?","zh":"票多少钱？","who":"А"},{"ru":"Пятьдесят рублей, купите в автомате.","zh":"五十卢布，在自动售票机买。","who":"Б"},{"ru":"Мне нужен билет туда и обратно.","zh":"我要往返票。","who":"А"},{"ru":"Тогда возьмите на сегодня, так дешевле.","zh":"那就买当天的，这样便宜些。","who":"Б"},{"ru":"А где пересадка на метро?","zh":"在哪换地铁？","who":"А"},{"ru":"На следующей станции, переход по указателям.","zh":"在下一站，顺着指示牌换乘。","who":"Б"},{"ru":"Спасибо. А поезд опаздывает?","zh":"谢谢。车会晚点吗？","who":"А"},{"ru":"Сегодня без опозданий, тьфу-тьфу.","zh":"今天没晚点，别说不吉利的。","who":"Б"}],"vocab":[{"ru":"электричка","zh":"通勤电车","pos":"名词（阴）"},{"ru":"вокзал","zh":"火车站","pos":"名词（阳）"},{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"},{"ru":"билет","zh":"票","pos":"сущ."},{"ru":"автомат","zh":"自动售票机","pos":"名词（阳）"},{"ru":"обращаться","zh":"找（某人）、求助于","pos":"动词（未完成体）"}],"sec":29}]},{"id":"c4-3","title":"На такси","titleZh":"打车","level":"A2","texts":[{"id":"c4-3","kind":"text","label":"短文","sentences":[{"ru":"Вчера я опаздывал на встречу и вызвал такси.","zh":"昨天我赶不上见面，就叫了出租车。"},{"ru":"Машина приехала через три минуты.","zh":"车三分钟后就到了。"},{"ru":"Водитель спросил адрес и включил музыку.","zh":"司机问了地址，打开了音乐。"},{"ru":"Дорога была длинной из-за пробок.","zh":"由于堵车，路上很费时间。"},{"ru":"Я попросил его остановиться у метро.","zh":"我请他在地铁站旁停车。"},{"ru":"Поездка стоила дороже, чем я думал.","zh":"这趟车比我想的贵。"}],"vocab":[{"ru":"такси","zh":"出租车","pos":"сущ."},{"ru":"водитель","zh":"司机","pos":"сущ."},{"ru":"пробка","zh":"堵车","pos":"сущ."},{"ru":"остановиться","zh":"停下","pos":"глаг."},{"ru":"поездка","zh":"行程","pos":"сущ."},{"ru":"дороже","zh":"更贵","pos":"нар."}],"sec":16},{"id":"c4-3d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, вы приехали по заказу?","zh":"您好，您是接单来的吗？","who":"А"},{"ru":"Да, до аэропорта? Садитесь.","zh":"是，去机场？上车吧。","who":"Б"},{"ru":"Спасибо. Чемодан можно в багажник?","zh":"谢谢。箱子能放后备箱吗？","who":"А"},{"ru":"Конечно, кладите.","zh":"当然，放吧。","who":"Б"},{"ru":"Сколько ехать до аэропорта?","zh":"到机场要开多久？","who":"А"},{"ru":"Минут сорок, если без пробок.","zh":"不堵车四十分钟。","who":"Б"},{"ru":"А сколько примерно будет стоить?","zh":"大概多少钱？","who":"А"},{"ru":"По счётчику, около тысячи.","zh":"打表，一千左右。","who":"Б"},{"ru":"Можно оплатить картой?","zh":"能刷卡吗？","who":"А"},{"ru":"Да, или переводом. Остановите у входа.","zh":"可以，或者转账。到入口停一下。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"заказ","zh":"订单","pos":"名词（阳）"},{"ru":"аэропорт","zh":"机场","pos":"сущ."},{"ru":"садиться","zh":"坐下","pos":"глаг."},{"ru":"чемодан","zh":"行李箱","pos":"сущ."},{"ru":"багажник","zh":"后备箱","pos":"名词（阳）"}],"sec":27}]},{"id":"c4-4","title":"Поезд и междугородние поездки","titleZh":"火车与长途","level":"A2","texts":[{"id":"c4-4","kind":"text","label":"短文","sentences":[{"ru":"Летом я ездил к другу в Казань.","zh":"夏天我去喀山找朋友。"},{"ru":"Билет на поезд я купил за неделю.","zh":"火车票我提前一周就买了。"},{"ru":"Поезд уходил вечером и приезжал утром.","zh":"火车晚上出发，早上到达。"},{"ru":"В вагоне было чисто и тихо.","zh":"车厢里干净又安静。"},{"ru":"Я пил чай и смотрел в окно.","zh":"我一边喝茶，一边看着窗外。"},{"ru":"Такой путь мне нравится больше, чем самолёт.","zh":"比起飞机，我更喜欢这样的旅程。"}],"vocab":[{"ru":"поезд","zh":"火车","pos":"сущ."},{"ru":"уходить","zh":"出发","pos":"глаг."},{"ru":"чисто","zh":"干净","pos":"нар."},{"ru":"путь","zh":"路程","pos":"сущ."},{"ru":"самолёт","zh":"飞机","pos":"сущ."},{"ru":"приезжать","zh":"到达","pos":"глаг."}],"sec":15},{"id":"c4-4d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, у вас есть билеты на завтра?","zh":"您好，有明天的票吗？","who":"А"},{"ru":"На какой поезд?","zh":"要哪趟车？","who":"Б"},{"ru":"До Санкт-Петербурга, утренний.","zh":"去圣彼得堡，早上的。","who":"А"},{"ru":"Есть плацкарт и купе. Что предпочитаете?","zh":"有硬卧和包厢。您要哪种？","who":"Б"},{"ru":"Купе, нижняя полка.","zh":"包厢，下铺。","who":"А"},{"ru":"Поезд в семь утра, с Ленинградского вокзала.","zh":"早上七点，从列宁格勒站发车。","who":"Б"},{"ru":"Сколько идёт?","zh":"要走多久？","who":"А"},{"ru":"Четыре часа, это «Сапсан».","zh":"四个小时，是「游隼号」。","who":"Б"},{"ru":"Отлично. Можно электронный билет?","zh":"太好了。能出电子票吗？","who":"А"},{"ru":"Да, покажите паспорт при посадке.","zh":"可以，上车时出示护照。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"билет","zh":"票","pos":"сущ."},{"ru":"поезд","zh":"列车","pos":"сущ."},{"ru":"плацкарт","zh":"硬卧（开放式）","pos":"名词（阳）"},{"ru":"купе","zh":"包厢","pos":"名词（中，不变）"},{"ru":"полка","zh":"铺位","pos":"名词（阴）"}],"sec":27}]},{"id":"c4-5","title":"В аэропорту","titleZh":"机场与值机","level":"B1","texts":[{"id":"c4-5","kind":"text","label":"短文","sentences":[{"ru":"В аэропорт я всегда приезжаю за два часа.","zh":"我去机场总是提前两小时。"},{"ru":"Сначала мы сдаём багаж и проходим контроль.","zh":"我们先托运行李，然后过安检。"},{"ru":"Потом я ищу свой выход в большом зале.","zh":"接着我在大厅里找自己的登机口。"},{"ru":"Иногда рейс задерживают из-за погоды.","zh":"有时因天气航班会延误。"},{"ru":"Тогда я сажусь в кафе и жду объявления.","zh":"那时我就坐在咖啡座里等广播。"},{"ru":"Наконец нас приглашают на посадку.","zh":"最后广播请我们登机。"}],"vocab":[{"ru":"аэропорт","zh":"机场","pos":"сущ."},{"ru":"багаж","zh":"行李","pos":"сущ."},{"ru":"контроль","zh":"安检","pos":"сущ."},{"ru":"рейс","zh":"航班","pos":"сущ."},{"ru":"задержать","zh":"延误","pos":"глаг."},{"ru":"посадка","zh":"登机","pos":"сущ."}],"sec":16},{"id":"c4-5d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, где регистрация на рейс в Пекин?","zh":"您好，飞北京的航班在哪值机？","who":"А"},{"ru":"Стойки с двадцать первой по двадцать пятую.","zh":"二十一到二十五号柜台。","who":"Б"},{"ru":"Спасибо. У меня один чемодан и ручная кладь.","zh":"谢谢。我一件托运、一件手提。","who":"А"},{"ru":"Поставьте на весы, пожалуйста.","zh":"请放上去称一下。","who":"Б"},{"ru":"Можно место у окна?","zh":"能要个靠窗的座位吗？","who":"А"},{"ru":"Конечно. Посадка заканчивается в одиннадцать сорок.","zh":"可以。登机十一点四十结束。","who":"Б"},{"ru":"А где выдача багажа по прилёте?","zh":"到达后在哪取行李？","who":"А"},{"ru":"В секторе прилёта, по указателям.","zh":"到达区，跟着指示牌走。","who":"Б"},{"ru":"А если чемодан не приедет?","zh":"要是箱子没到呢？","who":"А"},{"ru":"Обратитесь в службу розыска багажа.","zh":"去找行李查询处。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"регистрация","zh":"值机；登记","pos":"名词（阴）"},{"ru":"рейс","zh":"航班","pos":"сущ."},{"ru":"стойка","zh":"柜台","pos":"сущ."},{"ru":"чемодан","zh":"行李箱","pos":"сущ."},{"ru":"ручная кладь","zh":"手提行李","pos":"固定短语"}],"sec":27}]},{"id":"c4-6","title":"В гостинице","titleZh":"酒店入住与退房","level":"A2","texts":[{"id":"c4-6","kind":"text","label":"短文","sentences":[{"ru":"В гостинице мы жили три дня.","zh":"我们在旅馆住了三天。"},{"ru":"Номер был небольшой, но чистый.","zh":"房间不大，但很干净。"},{"ru":"Завтрак входил в цену.","zh":"早餐包含在房价里。"},{"ru":"Администратор помог нам с чемоданами.","zh":"前台帮我们搬了箱子。"},{"ru":"Однажды не работал интернет, и его быстро починили.","zh":"有一天网络坏了，很快就修好了。"},{"ru":"Когда мы уезжали, мы поблагодарили персонал.","zh":"离开时我们向工作人员道谢。"}],"vocab":[{"ru":"гостиница","zh":"旅馆","pos":"сущ."},{"ru":"номер","zh":"房间号","pos":"сущ."},{"ru":"завтрак","zh":"早餐","pos":"сущ."},{"ru":"чемодан","zh":"行李箱","pos":"сущ."},{"ru":"входить в цену","zh":"包含在价格里","pos":"фраза"},{"ru":"персонал","zh":"员工","pos":"сущ."}],"sec":16},{"id":"c4-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Добрый вечер, у меня забронирован номер.","zh":"晚上好，我订了房间。","who":"А"},{"ru":"На какую фамилию?","zh":"用哪个姓订的？","who":"Б"},{"ru":"Ли, на две ночи.","zh":"姓李，两晚。","who":"А"},{"ru":"Да, есть. Паспорт, пожалуйста.","zh":"有。请出示护照。","who":"Б"},{"ru":"Вот. Во сколько завтрак?","zh":"给您。早餐几点？","who":"А"},{"ru":"С семи до десяти, на втором этаже.","zh":"七点到十点，二楼。","who":"Б"},{"ru":"Wi-Fi пароль дадите?","zh":"Wi-Fi 密码能给我吗？","who":"А"},{"ru":"Да, на карточке в номере.","zh":"有，写在房间的卡上。","who":"Б"},{"ru":"Можно поздний выезд, до двух?","zh":"能延迟退房到两点吗？","who":"А"},{"ru":"Можно, за дополнительную плату.","zh":"可以，但要另外加钱。","who":"Б"}],"vocab":[{"ru":"забронировать","zh":"预订","pos":"动词（完成体）"},{"ru":"номер","zh":"房间号","pos":"сущ."},{"ru":"фамилия","zh":"姓","pos":"сущ."},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"Сколько с меня?","zh":"我该付多少？","pos":"固定问句"},{"ru":"завтрак","zh":"早餐","pos":"сущ."}],"sec":25}]},{"id":"c4-7","title":"Аренда квартиры","titleZh":"租房看房","level":"B1","texts":[{"id":"c4-7","kind":"text","label":"短文","sentences":[{"ru":"Перед учёбой я долго искал квартиру.","zh":"开学前我找房子找了很久。"},{"ru":"Мне советовали смотреть несколько вариантов.","zh":"有人建议我多看几个选择。"},{"ru":"Первая квартира была красивой, но далеко от метро.","zh":"第一套房子很漂亮，但离地铁远。"},{"ru":"Вторая оказалась ближе, но дороже.","zh":"第二套更近，但更贵。"},{"ru":"Я выбрал третью: маленькую, тихую и с мебелью.","zh":"我选了第三套：小、安静，还带家具。"},{"ru":"Хозяин попросил предоплату, и мы подписали договор.","zh":"房东要了预付款，我们签了合同。"}],"vocab":[{"ru":"квартира","zh":"公寓","pos":"сущ."},{"ru":"вариант","zh":"选项","pos":"сущ."},{"ru":"мебель","zh":"家具","pos":"сущ."},{"ru":"предоплата","zh":"预付","pos":"сущ."},{"ru":"договор","zh":"合同","pos":"сущ."},{"ru":"подписать","zh":"签署","pos":"глаг."}],"sec":17},{"id":"c4-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, я звоню по объявлению.","zh":"您好，我是看了房源信息打来的。","who":"А"},{"ru":"Да, квартира ещё свободна.","zh":"是的，房子还空着。","who":"Б"},{"ru":"Можно посмотреть сегодня?","zh":"今天能看房吗？","who":"А"},{"ru":"В шесть вечера удобно?","zh":"晚上六点方便吗？","who":"Б"},{"ru":"Да. Какая цена в месяц?","zh":"方便。月租多少？","who":"А"},{"ru":"Сорок тысяч плюс коммунальные.","zh":"四万，加上水电。","who":"Б"},{"ru":"Есть залог?","zh":"有押金吗？","who":"А"},{"ru":"Один месяц. Договор на год.","zh":"一个月押金。合同一年。","who":"Б"},{"ru":"Можно с животными? У меня кот.","zh":"能养宠物吗？我有猫。","who":"А"},{"ru":"С котом можно, но не с собакой.","zh":"养猫可以，狗不行。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"звонить","zh":"打电话","pos":"глаг."},{"ru":"объявление","zh":"广告、房源信息","pos":"名词（中）"},{"ru":"квартира","zh":"公寓","pos":"сущ."},{"ru":"свободен","zh":"空着、可用","pos":"形容词短尾"},{"ru":"удобно","zh":"方便","pos":"副词/短尾"}],"sec":24}]},{"id":"c4-8","title":"На машине и на заправке","titleZh":"自驾与加油站","level":"B1","texts":[{"id":"c4-8","kind":"text","label":"短文","sentences":[{"ru":"Мы решили поехать на дачу на машине.","zh":"我们决定开车去别墅。"},{"ru":"По дороге я заметил, что бензина мало.","zh":"路上我发现油不多了。"},{"ru":"На заправке я остановился у колонки.","zh":"在加油站我把车停在加油机旁。"},{"ru":"Мужчина показал, как заплатить через автомат.","zh":"一位男士示范了怎么在自助机付款。"},{"ru":"Я купил кофе и проверил давление в шинах.","zh":"我买了咖啡，还检查了胎压。"},{"ru":"Через десять минут мы поехали дальше.","zh":"十分钟后我们继续上路。"}],"vocab":[{"ru":"заправка","zh":"加油站","pos":"сущ."},{"ru":"бензин","zh":"汽油","pos":"сущ."},{"ru":"колонка","zh":"加油机","pos":"сущ."},{"ru":"шина","zh":"轮胎","pos":"сущ."},{"ru":"давление","zh":"压力","pos":"сущ."},{"ru":"дальше","zh":"继续往前","pos":"нар."}],"sec":16},{"id":"c4-8d","kind":"dialog","label":"对话","sentences":[{"ru":"Заправьте, пожалуйста, полный бак.","zh":"请加满。","who":"А"},{"ru":"Девяносто пятый?","zh":"九十五号？","who":"Б"},{"ru":"Да, девяносто пятый.","zh":"对，九十五号。","who":"А"},{"ru":"С вас две тысячи двести.","zh":"一共两千二。","who":"Б"},{"ru":"Где можно заплатить?","zh":"在哪儿付款？","who":"А"},{"ru":"В кассе или на автомате у колонки.","zh":"收银台，或者油泵旁的机器。","who":"Б"},{"ru":"А где ближайшая парковка?","zh":"最近的停车场在哪？","who":"А"},{"ru":"Через дорогу, но она платная.","zh":"马路对面，但要收费。","who":"Б"},{"ru":"Сколько стоит час?","zh":"一小时多少钱？","who":"А"},{"ru":"Сто рублей. Бесплатно только для клиентов.","zh":"一百卢布。只有客户才免费。","who":"Б"}],"vocab":[{"ru":"полночь","zh":"午夜","pos":"сущ."},{"ru":"бак","zh":"油箱","pos":"名词（阳）"},{"ru":"касса","zh":"收银台","pos":"сущ."},{"ru":"автомат","zh":"自动售票机","pos":"名词（阳）"},{"ru":"колонка","zh":"加油机","pos":"сущ."},{"ru":"парковка","zh":"停车场；停车","pos":"名词（阴）"}],"sec":21}]}]},{"id":"c5","name":"工作学习与办事","nameRu":"Работа и учёба","desc":"面试、上班第一天、会议与报告、请假加班、大学、图书馆、签证材料、看病","scenes":[{"id":"c5-1","title":"Собеседование","titleZh":"求职面试","level":"B2","texts":[{"id":"c5-1","kind":"text","label":"短文","sentences":[{"ru":"Вчера у меня было собеседование в городской больнице.","zh":"昨天我在市立医院参加了一场面试。"},{"ru":"Я пришёл за двадцать минут до начала и немного волновался.","zh":"我提前二十分钟到，有点紧张。"},{"ru":"Меня спросили о моём опыте и о планах на будущее.","zh":"他们问了我的经验和将来的打算。"},{"ru":"Я рассказал, почему мне интересна эта работа.","zh":"我讲了我为什么对这份工作感兴趣。"},{"ru":"Отдельно мы обсудили график и обязанности.","zh":"我们还单独讨论了排班和职责。"},{"ru":"В конце мне сказали, что ответят в течение недели.","zh":"最后他们告诉我一周内给答复。"},{"ru":"Больше всего меня поразило, как внимательно они слушали.","zh":"最让我意外的是他们听得那么认真。"}],"vocab":[{"ru":"собеседование","zh":"面试","pos":"сущ."},{"ru":"волноваться","zh":"紧张","pos":"глаг."},{"ru":"опыт","zh":"经验","pos":"сущ."},{"ru":"обязанность","zh":"职责","pos":"сущ."},{"ru":"график","zh":"排班表","pos":"сущ."},{"ru":"в течение","zh":"在……之内","pos":"фраза"}],"sec":23},{"id":"c5-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, я на собеседование. Ли.","zh":"您好，我来面试。姓李。","who":"А"},{"ru":"Проходите. Расскажите о себе.","zh":"请进。介绍一下自己吧。","who":"Б"},{"ru":"Меня зовут Ли, я переводчик, работаю три года.","zh":"我叫李，是翻译，已经工作三年。","who":"А"},{"ru":"Почему вы хотите работать у нас?","zh":"为什么想来我们这里工作？","who":"Б"},{"ru":"Мне интересна международная компания.","zh":"我对国际化公司感兴趣。","who":"А"},{"ru":"Какая у вас зарплата сейчас?","zh":"您现在工资多少？","who":"Б"},{"ru":"Восемьдесят тысяч. Рассчитываю на больше.","zh":"八万。我期望更高一些。","who":"А"},{"ru":"Когда вы можете начать?","zh":"什么时候能开始？","who":"Б"},{"ru":"С первого числа, если нужно — раньше.","zh":"一号开始，需要的话更早。","who":"А"},{"ru":"Хорошо, мы позвоним на этой неделе.","zh":"好，我们这周给你电话。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"собеседование","zh":"面试","pos":"сущ."},{"ru":"прохожий","zh":"路人","pos":"сущ."},{"ru":"переводчик","zh":"翻译人员","pos":"名词（阳）"},{"ru":"интересный","zh":"有意思的","pos":"形容词"},{"ru":"международный","zh":"国际的","pos":"形容词"}],"sec":28}]},{"id":"c5-2","title":"Первый день на работе","titleZh":"上班第一天","level":"B1","texts":[{"id":"c5-2","kind":"text","label":"短文","sentences":[{"ru":"В первый день я пришёл на работу раньше всех.","zh":"第一天我比所有人都早到。"},{"ru":"Мне показали офис и познакомили с коллегами.","zh":"他们带我看了办公室，介绍了同事。"},{"ru":"Потом я получил компьютер и пропуск.","zh":"然后我领到电脑和门禁卡。"},{"ru":"До обеда я читал документы и задавал вопросы.","zh":"上午我看文件、问问题。"},{"ru":"После обеда мне дали первую небольшую задачу.","zh":"下午他们给了我第一个小任务。"},{"ru":"Я сделал её за два часа и получил похвалу.","zh":"我两小时就做完了，还得到了表扬。"}],"vocab":[{"ru":"офис","zh":"办公室","pos":"сущ."},{"ru":"пропуск","zh":"门禁卡","pos":"сущ."},{"ru":"задача","zh":"任务","pos":"сущ."},{"ru":"похвала","zh":"表扬","pos":"сущ."},{"ru":"коллега","zh":"同事","pos":"сущ."},{"ru":"познакомить","zh":"介绍认识","pos":"глаг."}],"sec":17},{"id":"c5-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, вы новый коллега?","zh":"请问您是新同事吗？","who":"А"},{"ru":"Да, я Ли, стажёр-переводчик.","zh":"是，我叫李，实习翻译。","who":"Б"},{"ru":"Очень приятно, Ольга. Я покажу вам офис.","zh":"很高兴认识，我叫奥尔加。我带您看看办公室。","who":"А"},{"ru":"Спасибо! Где моё рабочее место?","zh":"谢谢！我的工位在哪？","who":"Б"},{"ru":"Вот здесь, у окна. Компьютер уже готов.","zh":"就在这儿，靠窗。电脑已经装好了。","who":"А"},{"ru":"Отлично. А как подключиться к принтеру?","zh":"太好了。怎么连打印机？","who":"Б"},{"ru":"Пароль в папке на столе. Обед в час.","zh":"密码在桌上的文件夹里。午饭一点。","who":"А"},{"ru":"Где обычно обедают?","zh":"大家一般在哪吃午饭？","who":"Б"},{"ru":"На первом этаже, там столовая.","zh":"一楼，那儿有食堂。","who":"А"},{"ru":"Понял, спасибо за помощь!","zh":"明白了，谢谢帮忙！","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"коллега","zh":"同事","pos":"сущ."},{"ru":"стажёр","zh":"实习生","pos":"名词（阳）"},{"ru":"офис","zh":"办公室","pos":"сущ."},{"ru":"компромисс","zh":"折中","pos":"сущ."},{"ru":"принтер","zh":"打印机","pos":"名词（阳）"}],"sec":30}]},{"id":"c5-3","title":"Совещание и отчёт","titleZh":"开会与汇报","level":"B2","texts":[{"id":"c5-3","kind":"text","label":"短文","sentences":[{"ru":"Каждую среду у нас проходит совещание группы.","zh":"每周三我们组开例会。"},{"ru":"Мы обсуждаем сроки и распределяем задачи.","zh":"我们讨论期限，
