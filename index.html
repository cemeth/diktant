<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="俄语听写">
<meta name="robots" content="noindex,nofollow">
<title>俄语听写 · Слушай и пиши</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#e8effd;
  --green:#15803d; --green-l:#e9f7ee;
  --ink:#111827; --ink-2:#4b5563; --ink-3:#9ca3af;
  --line:#e5e7eb; --card:#ffffff; --bg:#f6f7f9;
  --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.screen{display:none}
.screen.on{display:block}

/* ---------- home ---------- */
.hero{padding:28px 0 10px}
.hero h1{margin:0;font-size:26px;letter-spacing:-.4px}
.hero .ru{color:var(--blue);font-size:14px;letter-spacing:.3px;margin-top:4px}
.hero p{margin:10px 0 0;color:var(--ink-2);font-size:14px}
.tabs{display:flex;gap:8px;margin:18px 0 4px;overflow-x:auto;padding-bottom:2px}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;
}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px -4px rgba(37,99,235,.5)}
.leveldesc{color:var(--ink-3);font-size:13px;margin:8px 2px 14px}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;cursor:pointer;border:1px solid rgba(16,24,40,.04);
  transition:transform .08s ease;
}
.card:active{transform:scale(.99)}
.card h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.card .zh{color:var(--ink-2);font-size:14px;margin-top:2px}
.card .meta{color:var(--ink-3);font-size:12.5px;margin-top:8px;display:flex;gap:10px;align-items:center}
.card .done{color:var(--green);background:var(--green-l);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.card .cont{color:var(--blue);background:var(--blue-l);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.card .lvl{color:#6b7280;background:#f1f3f6;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;letter-spacing:.2px}
.card .rt{color:var(--ink-3);font-size:13.5px;margin-top:2px}

/* ---------- practice ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.92);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.bar .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.iconbtn{border:none;background:var(--card);box-shadow:var(--shadow);width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;color:var(--ink);flex:0 0 auto}
.bar .ttl{flex:1;min-width:0}
.bar .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ttl span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:var(--line)}
.pbar i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s ease}

.player{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0;text-align:center}
.playbig{
  width:108px;height:108px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(160deg,#3b82f6,#2563eb);color:#fff;font-size:40px;
  box-shadow:0 10px 28px -10px rgba(37,99,235,.75);display:inline-flex;align-items:center;justify-content:center;
  transition:transform .08s;
}
.playbig:active{transform:scale(.96)}
.playbig.playing{background:linear-gradient(160deg,#60a5fa,#3b82f6)}
.under{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.pill.on{background:var(--blue-l);border-color:#c7d7fb;color:var(--blue-d);font-weight:600}
.speed{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.slabel{font-size:12.5px;color:var(--ink-3);flex:none}
.chips{display:flex;gap:6px;flex:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;min-width:42px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:2px 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:#d7dbe3;border:none;padding:0;cursor:pointer}
.dot.cur{background:var(--blue);transform:scale(1.35)}
.dot.seen{background:#86c69a}

.typebox{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.typebox textarea{
  width:100%;border:none;outline:none;resize:vertical;min-height:88px;font-size:17px;line-height:1.6;
  font-family:inherit;color:var(--ink);background:transparent;
}
.typebox textarea::placeholder{color:var(--ink-3)}
.hint{color:var(--ink-3);font-size:12.5px;padding:0 4px 2px}

.reveal{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;border-left:4px solid var(--green)}
.reveal .lbl{font-size:12px;color:var(--ink-3);margin-bottom:3px}
.reveal .mine{color:var(--ink-2);font-size:15px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.reveal .ru{font-size:19px;font-weight:600;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--green)}
.reveal .zh{color:var(--ink-2);font-size:14.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}

.fold{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.fold summary{padding:14px 16px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--ink-2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"＋";color:var(--ink-3);font-weight:400}
.fold[open] summary::after{content:"－"}
.fold .body{padding:0 16px 16px;font-size:14.5px;color:var(--ink-2)}
.fold .body p{margin:0 0 8px}
.fold .body p b{color:var(--ink)}
.vrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.vrow:last-child{border-bottom:none}
.vrow .vru{font-weight:600;color:var(--ink);flex:0 0 38%}
.vrow .vzh{flex:1}
.vrow .vpos{color:var(--ink-3);font-size:12px;flex:0 0 auto}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.bottom .in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:#eef1f5;color:var(--ink)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px -10px rgba(37,99,235,.8)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.45}

/* ---------- done ---------- */
.doneh{text-align:center;padding:30px 0 6px}
.doneh .big{font-size:44px}
.doneh h2{margin:6px 0 2px;font-size:22px}
.doneh p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.sentline{padding:10px 0;border-bottom:1px solid var(--line)}
.sentline:last-child{border-bottom:none}
.sentline .n{color:var(--ink-3);font-size:12px}
.sentline .ru{font-size:16.5px;font-weight:600}
.sentline .zh{color:var(--ink-2);font-size:14px;margin-top:2px}
.foot{text-align:center;color:var(--ink-3);font-size:12px;padding:22px 0 10px}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen on" id="home">
  <div class="wrap">
    <div class="hero">
      <h1>俄语听写</h1>
      <div class="ru">Слушай и пиши</div>
      <p>听一句，写一句。按生活场景练，写完再看原文，慢慢把耳朵练出来。</p>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="leveldesc" id="leveldesc"></div>
    <div id="textlist"></div>
    <div class="foot" id="homeFoot"></div>
  </div>
</section>

<!-- ================= PRACTICE ================= -->
<section class="screen" id="practice">
  <div class="bar">
    <div class="in">
      <button class="iconbtn" id="btnBack" aria-label="返回">‹</button>
      <div class="ttl"><b id="pTitle">—</b><span id="pSub">—</span></div>
      <button class="iconbtn" id="btnDots" aria-label="句子列表">⋯</button>
    </div>
    <div class="pbar"><i id="pProg"></i></div>
  </div>
  <div class="wrap">
    <div class="player">
      <button class="playbig" id="btnPlay" aria-label="播放">▶</button>
      <div class="under">
        <button class="pill" id="btnPrev">‹ 上一句</button>
        <button class="pill" id="btnNextInline">下一句 ›</button>
      </div>
      <div class="speed">
        <span class="slabel">语速</span>
        <div class="chips" id="speedChips"></div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="typebox">
      <textarea id="input" placeholder="听完把句子写在这里…" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"></textarea>
      <div class="hint">想不起来就点「看原文」，不丢人。</div>
    </div>
    <div id="revealBox"></div>
    <details class="fold" id="foldZh"><summary>全文译文</summary><div class="body" id="zhBody"></div></details>
    <details class="fold" id="foldVocab"><summary>生词表</summary><div class="body" id="vocabBody"></div></details>
    <div class="foot" id="pFoot"></div>
  </div>
  <div class="bottom"><div class="in">
    <button class="btn ghost" id="btnReveal">看原文</button>
    <button class="btn primary" id="btnNext">下一句</button>
  </div></div>
</section>

<!-- ================= DONE ================= -->
<section class="screen" id="done">
  <div class="wrap">
    <div class="doneh">
      <div class="big">🎧</div>
      <h2>这一篇听完了</h2>
      <p id="doneSub">—</p>
    </div>
    <div class="fold" style="display:block"><div class="body" id="doneList"></div></div>
    <details class="fold" id="doneVocabFold"><summary>本篇生词</summary><div class="body" id="doneVocab"></div></details>
    <div class="foot">明天再来一遍，会明显不一样。</div>
  </div>
  <div class="bottom"><div class="in">
    <button class="btn ghost" id="btnAgain">再练一遍</button>
    <button class="btn primary" id="btnBackHome">回目录</button>
  </div></div>
</section>

<script>
/*CONTENT-START*/
var CONTENT = {"version":3,"chapters":[{"id":"c1","name":"基础交际","nameRu":"Основное общение","desc":"打招呼、自我介绍、寒暄、感谢道歉、请求邀请、表达意见","scenes":[{"id":"c1-1","title":"Приветствие и прощание","titleZh":"打招呼与告别","level":"A1","sentences":[{"ru":"Привет, Дима! Как дела?","zh":"你好，季马！最近怎么样？"},{"ru":"Привет! Всё хорошо, спасибо. А у тебя?","zh":"你好！挺好的，谢谢。你呢？"},{"ru":"Неплохо, только очень устал на работе.","zh":"还不错，就是上班太累了。"},{"ru":"Понимаю тебя. Кстати, как твои родители?","zh":"我理解你。对了，你父母怎么样？"},{"ru":"Спасибо, у них всё в порядке.","zh":"谢谢，他们一切都好。"},{"ru":"Извини, мне уже пора. До встречи!","zh":"抱歉，我得走了。回头见！"},{"ru":"Пока! Хорошего дня!","zh":"再见！祝你今天愉快！"},{"ru":"Спасибо, и тебе всего доброго!","zh":"谢谢，也祝你一切顺利！"},{"ru":"Созвонимся на выходных.","zh":"周末我们通个电话。"},{"ru":"Договорились. Пока-пока!","zh":"说定了。拜拜！"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"привет","zh":"你好（熟人之间）","pos":"感叹词"},{"ru":"Как дела?","zh":"最近怎么样？","pos":"固定问句"},{"ru":"устать","zh":"累、疲倦","pos":"动词（完成体）"},{"ru":"извини / извините","zh":"对不起、抱歉（为打扰道歉）","pos":"固定用语"},{"ru":"Мне пора","zh":"我得走了","pos":"固定句型"}],"sec":34},{"id":"c1-2","title":"Знакомство","titleZh":"自我介绍与认识新朋友","level":"A1","sentences":[{"ru":"Здравствуйте! Давайте познакомимся. Меня зовут Ли Мин.","zh":"您好！我们认识一下吧。我叫李明。"},{"ru":"Очень приятно! Я Анна, можно просто Аня.","zh":"很高兴认识您！我叫安娜，叫我阿尼亚就行。"},{"ru":"Аня, вы тоже работаете в этом отделе?","zh":"阿尼亚，您也在这个部门工作吗？"},{"ru":"Да, я здесь уже два года. А вы новенький?","zh":"是的，我在这里已经两年了。您是新来的吗？"},{"ru":"Да, я приехал из Китая, буду работать переводчиком.","zh":"是的，我从中国来，将做翻译工作。"},{"ru":"Здорово! У вас очень хороший русский.","zh":"太好了！您的俄语很好。"},{"ru":"Спасибо, я ещё учусь. Можно перейти на «ты»?","zh":"谢谢，我还在学。可以改用「你」相称吗？"},{"ru":"Конечно! Давай на «ты». Откуда ты родом?","zh":"当然！我们就用「你」吧。你是哪里人？"},{"ru":"Из Шанхая. Кстати, можно твой номер телефона?","zh":"上海。对了，能给我你的电话号码吗？"},{"ru":"Давай я напишу тебе в мессенджере. Диктуй свой номер.","zh":"我在即时通讯软件上给你发消息吧。你说号码。"}],"vocab":[{"ru":"познакомиться","zh":"认识、结识","pos":"动词（完成体）"},{"ru":"Меня зовут…","zh":"我叫……","pos":"固定句型"},{"ru":"Очень приятно","zh":"很高兴认识您","pos":"固定用语"},{"ru":"отдел","zh":"部门、科室","pos":"名词（阳）"},{"ru":"новенький","zh":"新来的人","pos":"名词/形容词"},{"ru":"переводчик","zh":"翻译人员","pos":"名词（阳）"}],"sec":48},{"id":"c1-3","title":"Светская беседа","titleZh":"寒暄闲聊：天气、近况、周末","level":"A2","sentences":[{"ru":"Доброе утро! Какая сегодня холодная погода!","zh":"早上好！今天天气真冷啊！"},{"ru":"Да, на улице минус пятнадцать. Надень шапку!","zh":"是啊，外面零下十五度。戴上帽子！"},{"ru":"Уже надел. А вчера было гораздо теплее.","zh":"已经戴上了。可昨天暖和多了。"},{"ru":"В Москве погода всегда такая: утром зима, вечером весна.","zh":"莫斯科的天气总这样：早上冬天，晚上春天。"},{"ru":"Кстати, какие планы на выходные?","zh":"对了，周末有什么打算？"},{"ru":"Хочу поехать на дачу, а ты?","zh":"我想去郊外小院，你呢？"},{"ru":"Пока не знаю. Может, останусь дома и посмотрю сериал.","zh":"还不知道。也许待在家看剧。"},{"ru":"Слушай, поехали вместе! Там будет шашлык.","zh":"哎，一起去吧！那儿会烤肉串。"},{"ru":"Отличная идея! Во сколько выезжаем?","zh":"好主意！几点出发？"},{"ru":"В субботу в девять утра у метро.","zh":"周六早上九点，在地铁站。"}],"vocab":[{"ru":"погода","zh":"天气","pos":"名词（阴）"},{"ru":"минус","zh":"零下、负号","pos":"名词（阳）"},{"ru":"надеть","zh":"穿上、戴上","pos":"动词（完成体）"},{"ru":"гораздо","zh":"……得多","pos":"副词"},{"ru":"выходные","zh":"周末","pos":"名词（复数）"},{"ru":"дача","zh":"郊外小院、乡间别墅","pos":"名词（阴）"}],"sec":38},{"id":"c1-4","title":"Спасибо и извините","titleZh":"感谢、道歉与回应","level":"A1","sentences":[{"ru":"Огромное спасибо за помощь! Без тебя я бы не справился.","zh":"太感谢你帮忙了！没有你我肯定搞不定。"},{"ru":"Да что ты, не за что. Это было несложно.","zh":"哪里哪里，不客气。这并不难。"},{"ru":"Нет, серьёзно, ты меня очень выручил.","zh":"不，说真的，你帮了我大忙。"},{"ru":"Ладно, обращайся, если что.","zh":"好吧，有事就找我。"},{"ru":"Кстати, извини за вчерашнее опоздание.","zh":"对了，为昨天迟到的事抱歉。"},{"ru":"Да ничего страшного, я тоже пришёл позже.","zh":"没什么大不了的，我也来得晚。"},{"ru":"Всё равно неудобно — ты меня ждал двадцать минут.","zh":"还是过意不去——你等了我二十分钟。"},{"ru":"За var STORE = 'diktant.v2';
var SPEEDS = [0.6, 0.75, 0.9, 1, 1.25, 1.5];
var state = { ch: 'c1', textId: null, idx: 0, speed: 1, seen: {}, typed: {}, done: {}, open: {}, lastPos: {} };

function load() {
  try {
    var raw = localStorage.getItem(STORE);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (s && typeof s === 'object') {
      if (s.ch) state.ch = s.ch;
      if (s.typed) state.typed = s.typed;
      if (s.seen) state.seen = s.seen;
      if (s.done) state.done = s.done;
      if (typeof s.speed === 'number' && s.speed >= 0.5 && s.speed <= 2) state.speed = s.speed;
      if (s.pos && typeof s.pos === 'object') state.lastPos = s.pos;
    }
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      ch: state.ch, speed: state.speed, typed: state.typed, seen: state.seen, done: state.done,
      pos: state.lastPos || {}
    }));
  } catch (e) {}
}

function $(id) { return document.getElementById(id); }
function show(screen) {
  var list = document.querySelectorAll('.screen');
  for (var i = 0; i < list.length; i++) list[i].classList.remove('on');
  $(screen).classList.add('on');
  window.scrollTo(0, 0);
}
function curChapter() {
  for (var i = 0; i < CONTENT.chapters.length; i++) if (CONTENT.chapters[i].id === state.ch) return CONTENT.chapters[i];
  return CONTENT.chapters[0];
}
function chapterOf(id) {
  for (var i = 0; i < CONTENT.chapters.length; i++) {
    var sc = CONTENT.chapters[i].scenes;
    for (var j = 0; j < sc.length; j++) if (sc[j].id === id) return CONTENT.chapters[i];
  }
  return null;
}
function curText() {
  for (var i = 0; i < CONTENT.chapters.length; i++) {
    var sc = CONTENT.chapters[i].scenes;
    for (var j = 0; j < sc.length; j++) if (sc[j].id === state.textId) return sc[j];
  }
  return null;
}
function audioSrc(t, i) { return 'audio/' + t.id + '/s' + (i + 1) + '.mp3'; }
function totalChars(t) {
  var n = 0;
  for (var i = 0; i < t.sentences.length; i++) n += t.sentences[i].ru.length;
  return n;
}
function estSeconds(t) { return t.sec ? Math.round(t.sec) : Math.round(totalChars(t) / 13); }

/* ---------------- home ---------------- */
function renderHome() {
  var tabs = $('tabs'), i;
  tabs.innerHTML = '';
  for (i = 0; i < CONTENT.chapters.length; i++) {
    (function (ch) {
      var b = document.createElement('button');
      b.className = 'tab' + (ch.id === state.ch ? ' on' : '');
      b.textContent = ch.name;
      b.onclick = function () { state.ch = ch.id; save(); renderHome(); };
      tabs.appendChild(b);
    })(CONTENT.chapters[i]);
  }
  var ch = curChapter();
  $('leveldesc').textContent = ch.desc;
  var cnt = CONTENT.counts || { chapters: 6, scenes: 48, sentences: 480 };
  $('homeFoot').textContent = '共 ' + cnt.chapters + ' 类 · ' + cnt.scenes + ' 个场景 · ' + cnt.sentences + ' 句 · 音频离线可用';
  var list = $('textlist');
  list.innerHTML = '';
  for (i = 0; i < ch.scenes.length; i++) {
    (function (t) {
      var c = document.createElement('div');
      c.className = 'card';
      var badges = '';
      if (state.done[t.id]) badges += '<span class="done">已练完</span>';
      if (state.lastPos && state.lastPos[t.id] && !state.done[t.id]) badges += '<span class="cont">练到第 ' + (state.lastPos[t.id] + 1) + ' 句</span>';
      c.innerHTML =
        '<h3>' + esc(t.titleZh) + ' <span class="lvl">' + esc(t.level) + '</span> ' + badges + '</h3>' +
        '<div class="rt">' + esc(t.title) + '</div>' +
        '<div class="meta"><span>' + t.sentences.length + ' 句</span><span>约 ' + estSeconds(t) + ' 秒</span><span>' + t.vocab.length + ' 个生词</span></div>';
      c.onclick = function () { openText(t.id); };
      list.appendChild(c);
    })(ch.scenes[i]);
  }
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

/* ---------------- practice ---------------- */
var audio = null;
function audioEl() {
  if (!audio) {
    audio = new Audio();
    audio.preload = 'auto';
    audio.addEventListener('ended', function () { $('btnPlay').classList.remove('playing'); $('btnPlay').textContent = '▶'; });
  }
  return audio;
}
function openText(id) {
  state.textId = id;
  var ch = chapterOf(id);
  if (ch) state.ch = ch.id;
  var t = curText();
  var start = (state.lastPos && state.lastPos[id]) ? state.lastPos[id] : 0;
  if (start >= t.sentences.length) start = 0;
  state.idx = start;
  save();
  show('practice');
  renderPractice();
  playCurrent();
}
function renderPractice() {
  var t = curText();
  var i = state.idx;
  var s = t.sentences[i];
  $('pTitle').textContent = t.titleZh;
  $('pSub').textContent = t.title + ' · 第 ' + (i + 1) + ' / ' + t.sentences.length + ' 句';
  $('pProg').style.width = ((i) / t.sentences.length * 100) + '%';
  var dots = $('dots');
  dots.innerHTML = '';
  for (var k = 0; k < t.sentences.length; k++) {
    (function (n) {
      var d = document.createElement('button');
      d.className = 'dot' + (n === i ? ' cur' : '') + (state.seen[t.id + ':' + n] ? ' seen' : '');
      d.setAttribute('aria-label', '第' + (n + 1) + '句');
      d.onclick = function () { goto_($('input').value, n); };
      dots.appendChild(d);
    })(k);
  }
  var box = $('revealBox');
  box.innerHTML = '';
  delete state.open[t.id + ':' + i];
  var seen = state.seen[t.id + ':' + i];
  var ta = $('input');
  var saved = state.typed[t.id + ':' + i];
  ta.value = (typeof saved === 'string') ? saved : '';
  $('btnReveal').textContent = '看原文';
  $('btnNext').textContent = (i === t.sentences.length - 1) ? '完成' : '下一句';
  renderSpeeds();
  $('foldZh').open = false;
  renderZh(t); renderVocab(t);
  var ch = chapterOf(t.id);
  $('pFoot').textContent = (ch ? ch.name + ' · ' : '') + t.level + ' · 共 ' + t.sentences.length + ' 句 · ' + t.vocab.length + ' 个生词';
  try { ta.focus({ preventScroll: false }); } catch (e) { ta.focus(); }
}
function revealHTML(t, i) {
  var s = t.sentences[i];
  var mine = state.typed[t.id + ':' + i] || '';
  return '<div class="reveal">' +
    '<div class="lbl">你写的</div>' +
    '<div class="mine">' + (mine.trim() ? esc(mine) : '（空）') + '</div>' +
    '<div class="lbl">原文</div>' +
    '<div class="ru">' + esc(s.ru) + '</div>' +
    '<div class="zh">' + esc(s.zh) + '</div>' +
    '</div>';
}
function renderZh(t) {
  var h = '';
  for (var i = 0; i < t.sentences.length; i++) h += '<p><b>' + (i + 1) + '.</b> ' + esc(t.sentences[i].zh) + '</p>';
  $('zhBody').innerHTML = h;
}
function renderVocab(t) {
  var h = '';
  for (var i = 0; i < t.vocab.length; i++) {
    var v = t.vocab[i];
    h += '<div class="vrow"><div class="vru">' + esc(v.ru) + '</div><div class="vzh">' + esc(v.zh) + '</div><div class="vpos">' + esc(v.pos || '') + '</div></div>';
  }
  $('vocabBody').innerHTML = h;
}

function playCurrent() {
  var t = curText();
  if (!t) return;
  var a = audioEl();
  a.pause();
  a.src = audioSrc(t, state.idx);
  a.playbackRate = state.speed || 1;
  if ('preservesPitch' in a) a.preservesPitch = true;
  if ('mozPreservesPitch' in a) a.mozPreservesPitch = true;
  if ('webkitPreservesPitch' in a) a.webkitPreservesPitch = true;
  a.currentTime = 0;
  var p = a.play();
  $('btnPlay').classList.add('playing');
  $('btnPlay').textContent = '❚❚';
  if (p && p.catch) p.catch(function () { $('btnPlay').classList.remove('playing'); $('btnPlay').textContent = '▶'; });
}
function rememberTyped() {
  var t = curText();
  if (!t) return;
  state.typed[t.id + ':' + state.idx] = $('input').value;
  if (!state.lastPos) state.lastPos = {};
  state.lastPos[t.id] = state.idx;
  save();
}
function goto_(typedNow, n) {
  rememberTyped();
  state.idx = n;
  renderPractice();
  playCurrent();
}
function toggleReveal() {
  var t = curText();
  var i = state.idx;
  var key = t.id + ':' + i;
  var box = $('revealBox');
  if (state.open[key]) {
    delete state.open[key];
    box.innerHTML = '';
    $('btnReveal').textContent = '看原文';
    return;
  }
  state.open[key] = 1;
  state.seen[key] = 1;
  save();
  box.innerHTML = revealHTML(t, i);
  $('btnReveal').textContent = '收起原文';
  var dot = $('dots').children[i];
  if (dot) dot.classList.add('seen');
}
function nextSentence() {
  var t = curText();
  rememberTyped();
  if (state.idx >= t.sentences.length - 1) { finish(); return; }
  state.idx++;
  renderPractice();
  playCurrent();
}
function prevSentence() {
  if (state.idx <= 0) return;
  rememberTyped();
  state.idx--;
  renderPractice();
  playCurrent();
}
function finish() {
  var t = curText();
  state.done[t.id] = 1;
  if (state.lastPos) state.lastPos[t.id] = 0;
  save();
  var h = '';
  for (var i = 0; i < t.sentences.length; i++) {
    h += '<div class="sentline"><div class="n">第 ' + (i + 1) + ' 句' + (state.seen[t.id + ':' + i] ? '' : ' · 没看原文') + '</div>' +
      '<div class="ru">' + esc(t.sentences[i].ru) + '</div>' +
      '<div class="zh">' + esc(t.sentences[i].zh) + '</div></div>';
  }
  $('doneList').innerHTML = h;
  $('doneSub').textContent = t.titleZh + ' · ' + t.title + '（' + t.sentences.length + ' 句）';
  var v = '';
  for (var j = 0; j < t.vocab.length; j++) {
    v += '<div class="vrow"><div class="vru">' + esc(t.vocab[j].ru) + '</div><div class="vzh">' + esc(t.vocab[j].zh) + '</div><div class="vpos">' + esc(t.vocab[j].pos || '') + '</div></div>';
  }
  $('doneVocab').innerHTML = v;
  show('done');
}
function backHome() {
  rememberTyped();
  var t = curText();
  if (t && state.lastPos && state.seen && Object.keys(state.seen).length) {
    var anySeen = false;
    for (var k in state.seen) if (k.indexOf(t.id + ':') === 0) anySeen = true;
    if (anySeen) state.done[t.id] = state.done[t.id] || 0;
  }
  save();
  renderHome();
  show('home');
}

/* ---------------- wiring ---------------- */
load();
renderHome();

function renderSpeeds() {
  var box = $('speedChips');
  box.innerHTML = '';
  var cur = state.speed || 1;
  for (var i = 0; i < SPEEDS.length; i++) {
    (function (v) {
      var b = document.createElement('button');
      b.className = 'chip' + (Math.abs(v - cur) < 0.001 ? ' on' : '');
      b.textContent = (v === 1 ? '1' : String(v)) + '×';
      b.setAttribute('aria-label', '语速 ' + v + ' 倍');
      b.onclick = function () { setSpeed(v); };
      box.appendChild(b);
    })(SPEEDS[i]);
  }
}
function setSpeed(v) {
  state.speed = v;
  save();
  renderSpeeds();
  var a = audioEl();
  a.playbackRate = v;
  if ('preservesPitch' in a) a.preservesPitch = true;
}
$('btnPlay').onclick = function () {
  var a = audioEl();
  if (!a.paused) { a.pause(); $('btnPlay').classList.remove('playing'); $('btnPlay').textContent = '▶'; return; }
  playCurrent();
};
$('btnPrev').onclick = function () { prevSentence(); };
$('btnNextInline').onclick = function () { nextSentence(); };
$('btnReveal').onclick = function () { toggleReveal(); };
$('btnNext').onclick = function () { nextSentence(); };
$('btnBack').onclick = function () { backHome(); };
$('btnDots').onclick = function () {
  var t = curText();
  var n = prompt('跳到第几句？（1-' + t.sentences.length + '）', String(state.idx + 1));
  if (!n) return;
  var v = parseInt(n, 10);
  if (!v || v < 1 || v > t.sentences.length) return;
  goto_(null, v - 1);
};
$('input').addEventListener('input', function () {
  var t = curText();
  if (!t) return;
  state.typed[t.id + ':' + state.idx] = $('input').value;
  if (!state.lastPos) state.lastPos = {};
  state.lastPos[t.id] = state.idx;
  save();
});
$('btnAgain').onclick = function () {
  state.idx = 0;
  state.seen = {};
  state.typed = {};
  state.open = {};
  state.done[state.textId] = 1;
  save();
  show('practice');
  renderPractice();
  playCurrent();
};
$('btnBackHome').onclick = function () { renderHome(); show('home'); };
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
