分配任务。"},{"ru":"На этой неделе я должен подготовить отчёт.","zh":"这周我要准备一份报告。"},{"ru":"Я собрал данные за месяц и оформил их в таблицу.","zh":"我汇总了一个月的数据，做成了表格。"},{"ru":"В отчёте я показал, где возникли трудности.","zh":"在报告里我指出了困难所在。"},{"ru":"Руководитель предложил изменить график работы.","zh":"负责人建议调整工作安排。"},{"ru":"После совещания я доработал текст и отправил его по почте.","zh":"会后我修改了文字，用邮件发了出去。"}],"vocab":[{"ru":"совещание","zh":"会议","pos":"сущ."},{"ru":"отчёт","zh":"报告","pos":"сущ."},{"ru":"сроки","zh":"期限","pos":"сущ."},{"ru":"распределять","zh":"分配","pos":"глаг."},{"ru":"оформить","zh":"整理成","pos":"глаг."},{"ru":"руководитель","zh":"负责人","pos":"сущ."}],"sec":21},{"id":"c5-3d","kind":"dialog","label":"对话","sentences":[{"ru":"Коллеги, начнём. Ли, как дела с переводом?","zh":"同事们，开始吧。李，翻译进展怎样？","who":"А"},{"ru":"Я закончил первую часть, вторая в работе.","zh":"第一部分做完了，第二部分在做。","who":"Б"},{"ru":"К какому сроку будет готово?","zh":"什么时候能完成？","who":"А"},{"ru":"К пятнице, если не будет правок.","zh":"周五，如果没有修改。","who":"Б"},{"ru":"Правки будут, но небольшие.","zh":"会有修改，但不大。","who":"А"},{"ru":"Тогда успею. Могу показать слайды сейчас.","zh":"那来得及。我可以现在展示幻灯片。","who":"Б"},{"ru":"Давайте. Только коротко, у нас мало времени.","zh":"来吧。简短些，我们时间不多。","who":"А"},{"ru":"Хорошо, три минуты по плану.","zh":"好，按计划三分钟。","who":"Б"},{"ru":"Отлично. Вопросы будут после.","zh":"很好。问题待会儿提。","who":"А"},{"ru":"Спасибо, тогда начинаю.","zh":"谢谢，那我开始。","who":"Б"}],"vocab":[{"ru":"коллега","zh":"同事","pos":"сущ."},{"ru":"начнём","zh":"开始吧","pos":"动词（完成体）"},{"ru":"перевод","zh":"翻译；译文","pos":"名词（阳）"},{"ru":"закончить","zh":"完成、结束","pos":"动词（完成体）"},{"ru":"час","zh":"小时、点钟","pos":"сущ."},{"ru":"срок","zh":"期限","pos":"сущ."}],"sec":30}]},{"id":"c5-4","title":"Отгул и сверхурочные","titleZh":"请假与加班","level":"A2","texts":[{"id":"c5-4","kind":"text","label":"短文","sentences":[{"ru":"На прошлой неделе я работал очень много.","zh":"上周我工作得非常多。"},{"ru":"Поэтому я попросил у начальника отгул.","zh":"所以我向领导请了一天假。"},{"ru":"Он попросил сначала закончить срочный проект.","zh":"他让我先把紧急项目做完。"},{"ru":"Я согласился и остался на два часа дольше.","zh":"我同意了，多留了两个小时。"},{"ru":"За это мне оплатили сверхурочные.","zh":"为此公司付了我加班费。"},{"ru":"В пятницу я всё-таки получил отгул и отдохнул дома.","zh":"星期五我还是请到了假，在家休息。"}],"vocab":[{"ru":"отгул","zh":"补休","pos":"сущ."},{"ru":"сверхурочные","zh":"加班费","pos":"сущ."},{"ru":"начальник","zh":"领导","pos":"сущ."},{"ru":"срочный","zh":"紧急的","pos":"прил."},{"ru":"оплатить","zh":"支付","pos":"глаг."},{"ru":"всё-таки","zh":"终究","pos":"нар."}],"sec":17},{"id":"c5-4d","kind":"dialog","label":"对话","sentences":[{"ru":"Можно к вам на минутку?","zh":"能打扰您一分钟吗？","who":"А"},{"ru":"Да, слушаю.","zh":"可以，请说。","who":"Б"},{"ru":"Мне нужно взять отпуск на неделю.","zh":"我想请一周假。","who":"А"},{"ru":"Когда?","zh":"什么时候？","who":"Б"},{"ru":"С пятнадцатого по двадцать первое.","zh":"十五号到二十一号。","who":"А"},{"ru":"Хорошо, но до этого нужно сдать отчёт.","zh":"可以，但之前得把报告交了。","who":"Б"},{"ru":"Сделаю. И ещё: вчера я задержался до десяти.","zh":"会交的。还有：昨天我加班到十点。","who":"А"},{"ru":"Да, я видел. Переработку оформим?","zh":"嗯，我看到了。加班费要办吗？","who":"Б"},{"ru":"Хотелось бы. Или отгул.","zh":"希望办。或者调休也行。","who":"А"},{"ru":"Оформим отгул, так проще.","zh":"办调休吧，这样简单。","who":"Б"}],"vocab":[{"ru":"минус","zh":"零下、负号","pos":"名词（阳）"},{"ru":"слушаю","zh":"我在听","pos":"动词（未完成体）"},{"ru":"отпуск","zh":"休假","pos":"сущ."},{"ru":"неделя","zh":"星期；一周","pos":"名词（阴）"},{"ru":"пятница","zh":"星期五","pos":"сущ."},{"ru":"сдать","zh":"提交；交出","pos":"动词（完成体）"}],"sec":26}]},{"id":"c5-5","title":"В университете","titleZh":"学校与课堂","level":"A2","texts":[{"id":"c5-5","kind":"text","label":"短文","sentences":[{"ru":"Я учусь на втором курсе.","zh":"我在读大二。"},{"ru":"Лекции начинаются в девять часов.","zh":"讲座九点开始。"},{"ru":"По средам у нас лабораторные работы.","zh":"每周三我们有实验课。"},{"ru":"В конце семестра мы сдаём экзамены.","zh":"学期末我们要考试。"},{"ru":"Я готовлюсь в библиотеке, потому что дома шумно.","zh":"我在图书馆复习，因为家里太吵。"},{"ru":"Мне нравится мой факультет, хотя учёба нелёгкая.","zh":"我喜欢我的院系，虽然学习不轻松。"}],"vocab":[{"ru":"курс","zh":"年级","pos":"сущ."},{"ru":"лекция","zh":"讲座","pos":"сущ."},{"ru":"лабораторный","zh":"实验的","pos":"прил."},{"ru":"семестр","zh":"学期","pos":"сущ."},{"ru":"готовиться","zh":"复习、准备","pos":"глаг."},{"ru":"факультет","zh":"院系","pos":"сущ."}],"sec":16},{"id":"c5-5d","kind":"dialog","label":"对话","sentences":[{"ru":"Извините, это аудитория триста два?","zh":"请问这是三〇二教室吗？","who":"А"},{"ru":"Да, вы на курс русского языка?","zh":"是，你上俄语课？","who":"Б"},{"ru":"Да, я новый студент. Ли.","zh":"是，我是新生，姓李。","who":"А"},{"ru":"Отлично. У нас сегодня грамматика.","zh":"好。我们今天讲语法。","who":"Б"},{"ru":"Простите, я не успел купить учебник.","zh":"不好意思，我没来得及买教材。","who":"А"},{"ru":"Ничего, я дам копию на сегодня.","zh":"没关系，今天的我给你复印一份。","who":"Б"},{"ru":"Спасибо! А когда экзамен?","zh":"谢谢！什么时候考试？","who":"А"},{"ru":"В середине января, устный и письменный.","zh":"一月中旬，口试和笔试。","who":"Б"},{"ru":"Устный сложнее?","zh":"口试更难吗？","who":"А"},{"ru":"Для вас, думаю, наоборот.","zh":"我觉得对你正好相反。","who":"Б"}],"vocab":[{"ru":"извините","zh":"对不起","pos":"фраза"},{"ru":"аудитория","zh":"教室；听众","pos":"名词（阴）"},{"ru":"курс","zh":"年级","pos":"сущ."},{"ru":"студент","zh":"大学生","pos":"名词（阳）"},{"ru":"грамматика","zh":"语法","pos":"名词（阴）"},{"ru":"проспать","zh":"睡过头","pos":"глаг."}],"sec":28}]},{"id":"c5-6","title":"В библиотеке","titleZh":"图书馆与自习","level":"A1","texts":[{"id":"c5-6","kind":"text","label":"短文","sentences":[{"ru":"В четверг я иду в библиотеку.","zh":"星期四我去图书馆。"},{"ru":"Мне нужны книги по истории.","zh":"我需要历史方面的书。"},{"ru":"Я показываю карточку и прошу помощь.","zh":"我出示借书卡，请人帮忙。"},{"ru":"Девушка объясняет, где стоит нужный раздел.","zh":"女孩告诉我需要的分区在哪里。"},{"ru":"Я выбираю две книги и читаю в зале.","zh":"我挑了两本书，在阅览室读。"},{"ru":"Домой я беру одну книгу на неделю.","zh":"我借一本书回家，借期一周。"}],"vocab":[{"ru":"библиотека","zh":"图书馆","pos":"сущ."},{"ru":"карточка","zh":"借书卡","pos":"сущ."},{"ru":"раздел","zh":"分区","pos":"сущ."},{"ru":"зал","zh":"阅览室","pos":"сущ."},{"ru":"брать","zh":"借走","pos":"глаг."},{"ru":"история","zh":"历史","pos":"сущ."}],"sec":16},{"id":"c5-6d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, можно записаться в библиотеку?","zh":"您好，能办借书证吗？","who":"А"},{"ru":"С паспортом и фото, пожалуйста.","zh":"请带护照和照片。","who":"Б"},{"ru":"У меня есть паспорт, фото нет.","zh":"我带了护照，没带照片。","who":"А"},{"ru":"Тогда сфотографируем здесь.","zh":"那就在这儿拍吧。","who":"Б"},{"ru":"Спасибо. Можно взять эти книги домой?","zh":"谢谢。这些书能借回家吗？","who":"А"},{"ru":"Словари только в читальном зале.","zh":"词典只能在阅览室看。","who":"Б"},{"ru":"А сколько книг можно взять?","zh":"能借几本？","who":"А"},{"ru":"Пять на месяц. Продлить можно онлайн.","zh":"五本，一个月。可以网上续借。","who":"Б"},{"ru":"Отлично. Где тихие места для занятий?","zh":"太好了。哪有安静的座位？","who":"А"},{"ru":"На третьем этаже, у окон.","zh":"三楼，靠窗那边。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"записаться","zh":"预约","pos":"动词（完成体）"},{"ru":"библиотека","zh":"图书馆","pos":"сущ."},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"сфотографировать","zh":"拍照","pos":"动词（完成体）"},{"ru":"словарь","zh":"词典","pos":"名词（阳）"}],"sec":30}]},{"id":"c5-7","title":"Документы и виза","titleZh":"政府办事与签证","level":"B2","texts":[{"id":"c5-7","kind":"text","label":"短文","sentences":[{"ru":"В июне мне нужно было продлить визу.","zh":"六月我需要续签。"},{"ru":"Я заранее проверил список документов на сайте.","zh":"我提前在网站上查了材料清单。"},{"ru":"Сначала я сделал копии паспорта и страховки.","zh":"我先复印了护照和保险单。"},{"ru":"Потом записался на приём по телефону.","zh":"然后打电话预约了办理时间。"},{"ru":"В отделе у меня приняли анкету и фотографии.","zh":"在办理处他们收了我的申请表和照片。"},{"ru":"Сотрудник попросил ещё справку из университета.","zh":"工作人员还要了一份学校证明。"},{"ru":"Через две недели я получил готовые документы.","zh":"两周后我拿到了办好的证件。"}],"vocab":[{"ru":"продлить","zh":"延期","pos":"глаг."},{"ru":"виза","zh":"签证","pos":"сущ."},{"ru":"страховка","zh":"保险单","pos":"сущ."},{"ru":"приём","zh":"接待时间","pos":"сущ."},{"ru":"анкета","zh":"申请表","pos":"сущ."},{"ru":"справка","zh":"证明","pos":"сущ."}],"sec":19},{"id":"c5-7d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, я хочу продлить визу.","zh":"您好，我想续签。","who":"А"},{"ru":"Какая у вас виза?","zh":"您是什么签证？","who":"Б"},{"ru":"Учебная, заканчивается через месяц.","zh":"学生签，一个月后到期。","who":"А"},{"ru":"Документы: паспорт, миграционная карта, справка из вуза.","zh":"材料：护照、入境卡、学校证明。","who":"Б"},{"ru":"Где взять справку?","zh":"证明去哪儿开？","who":"А"},{"ru":"В институте, в международном отделе.","zh":"学校国际处。","who":"Б"},{"ru":"А сколько ждать продления?","zh":"续签要等多久？","who":"А"},{"ru":"До двадцати рабочих дней.","zh":"最多二十个工作日。","who":"Б"},{"ru":"Я могу выехать в это время?","zh":"这期间我能出境吗？","who":"А"},{"ru":"Нет, без разрешения нельзя.","zh":"不行，没有许可不能出境。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"продлить","zh":"延期","pos":"глаг."},{"ru":"виза","zh":"签证","pos":"сущ."},{"ru":"учебник","zh":"教材","pos":"名词（阳）"},{"ru":"паспорт","zh":"护照","pos":"сущ."},{"ru":"миграционная карта","zh":"入境卡","pos":"固定短语"}],"sec":23}]},{"id":"c5-8","title":"У врача","titleZh":"医院看病","level":"B1","texts":[{"id":"c5-8","kind":"text","label":"短文","sentences":[{"ru":"В понедельник у меня болела голова уже третий день.","zh":"星期一我的头已经疼了三天。"},{"ru":"Я записался к врачу в поликлинику.","zh":"我预约了门诊的医生。"},{"ru":"Врач измерил давление и задал несколько вопросов.","zh":"医生量了血压，问了几个问题。"},{"ru":"Он сказал, что это связано с усталостью.","zh":"他说这和疲劳有关。"},{"ru":"Мне выписали лекарство и посоветовали больше спать.","zh":"医生给我开了药，建议我多睡。"},{"ru":"Через неделю я почувствовал себя гораздо лучше.","zh":"一周后我感觉好多了。"}],"vocab":[{"ru":"поликлиника","zh":"门诊","pos":"сущ."},{"ru":"давление","zh":"血压","pos":"сущ."},{"ru":"усталость","zh":"疲劳","pos":"сущ."},{"ru":"выписать","zh":"开（药）","pos":"глаг."},{"ru":"лекарство","zh":"药","pos":"сущ."},{"ru":"советовать","zh":"建议","pos":"глаг."}],"sec":17},{"id":"c5-8d","kind":"dialog","label":"对话","sentences":[{"ru":"Здравствуйте, мне нужен врач.","zh":"您好，我要看医生。","who":"А"},{"ru":"Вы записаны?","zh":"您预约了吗？","who":"Б"},{"ru":"Нет, я плохо себя чувствую.","zh":"没有，我不太舒服。","who":"А"},{"ru":"Что вас беспокоит?","zh":"您哪儿不舒服？","who":"Б"},{"ru":"Болит горло и температура тридцать восемь.","zh":"嗓子疼，发烧三十八度。","who":"А"},{"ru":"Проходите, терапевт вас посмотрит.","zh":"请进，内科医生给您看。","who":"Б"},{"ru":"Спасибо. Мне нужен больничный.","zh":"谢谢。我需要病假条。","who":"А"},{"ru":"Врач выпишет справку. Лекарства в аптеке напротив.","zh":"医生会给开证明。药在对面药店。","who":"Б"},{"ru":"Рецепт нужен?","zh":"需要处方吗？","who":"А"},{"ru":"Да, на антибиотики обязательно.","zh":"需要，抗生素必须有处方。","who":"Б"}],"vocab":[{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"врач","zh":"医生","pos":"名词（阳）"},{"ru":"беспокоить","zh":"使不安；困扰","pos":"动词（未完成体）"},{"ru":"горло","zh":"喉咙","pos":"名词（中）"},{"ru":"температура","zh":"体温；发烧","pos":"名词（阴）"},{"ru":"прохожий","zh":"路人","pos":"сущ."}],"sec":24}]}]},{"id":"c6","name":"人际交往与特殊场合","nameRu":"Отношения и особые случаи","desc":"约见面、打电话、生日、节日、安慰、和好、急救、丢东西","scenes":[{"id":"c6-1","title":"Договориться о встрече","titleZh":"约见与安排","level":"A2","texts":[{"id":"c6-1","kind":"text","label":"短文","sentences":[{"ru":"На следующей неделе я хочу встретиться с другом.","zh":"下周我想和朋友见面。"},{"ru":"Я написал ему сообщение и предложил пятницу.","zh":"我给他发消息，提议星期五。"},{"ru":"Он ответил, что в пятницу занят.","zh":"他回复说星期五有事。"},{"ru":"Тогда мы выбрали субботу после обеда.","zh":"于是我们选了星期六下午。"},{"ru":"Договорились встретиться у метро.","zh":"说好在地铁站见面。"},{"ru":"Если что-то изменится, мы напишем друг другу.","zh":"如果有什么变化，我们互相写消息。"}],"vocab":[{"ru":"договориться","zh":"说定","pos":"глаг."},{"ru":"встретиться","zh":"见面","pos":"глаг."},{"ru":"предложить","zh":"提议","pos":"глаг."},{"ru":"занятый","zh":"有事的","pos":"прил."},{"ru":"измениться","zh":"改变","pos":"глаг."},{"ru":"после обеда","zh":"下午","pos":"фраза"}],"sec":17},{"id":"c6-1d","kind":"dialog","label":"对话","sentences":[{"ru":"Привет! Давай встретимся на неделе.","zh":"嗨！这周见一面吧。","who":"А"},{"ru":"Давай. Когда тебе удобно?","zh":"好啊。你什么时候方便？","who":"Б"},{"ru":"В среду после работы, часов в семь.","zh":"周三下班后，七点左右。","who":"А"},{"ru":"В среду не могу, у меня курсы.","zh":"周三不行，我有课。","who":"Б"},{"ru":"Тогда в четверг? Или в пятницу вечером.","zh":"那周四？或者周五晚上。","who":"А"},{"ru":"В пятницу давай. Где встретимся?","zh":"周五吧。在哪见？","who":"Б"},{"ru":"У метро, у выхода к парку.","zh":"地铁站，通公园那个出口。","who":"А"},{"ru":"Хорошо, в семь у метро. Не опаздывай!","zh":"好，七点地铁站。别迟到！","who":"Б"},{"ru":"Я постараюсь. Если что, напишу.","zh":"我尽量。有情况我发消息。","who":"А"},{"ru":"Договорились. До пятницы!","zh":"说定了。周五见！","who":"Б"}],"vocab":[{"ru":"привет","zh":"你好（熟人之间）","pos":"感叹词"},{"ru":"встретиться","zh":"见面","pos":"глаг."},{"ru":"неделя","zh":"星期；一周","pos":"名词（阴）"},{"ru":"удобно","zh":"方便","pos":"副词/短尾"},{"ru":"после обеда","zh":"下午","pos":"фраза"},{"ru":"час","zh":"小时、点钟","pos":"сущ."}],"sec":33}]},{"id":"c6-2","title":"Телефонный разговор","titleZh":"打电话与留言","level":"A2","texts":[{"id":"c6-2","kind":"text","label":"短文","sentences":[{"ru":"Вчера вечером мне позвонили с незнакомого номера.","zh":"昨天晚上有个陌生号码打给我。"},{"ru":"Я не сразу понял, кто говорит.","zh":"我没立刻听出是谁。"},{"ru":"Мужчина искал Сергея Смирнова.","zh":"那位男士在找谢尔盖·斯米尔诺夫。"},{"ru":"Я ответил, что он ошибся номером.","zh":"我说他打错号码了。"},{"ru":"Он извинился и положил трубку.","zh":"他道了歉，挂了电话。"},{"ru":"Через минуту он позвонил снова и спросил про другую квартиру.","zh":"一分钟后他又打来，问另一户人家。"}],"vocab":[{"ru":"звонить","zh":"打电话","pos":"глаг."},{"ru":"незнакомый","zh":"陌生的","pos":"прил."},{"ru":"номер","zh":"号码","pos":"сущ."},{"ru":"ошибиться номером","zh":"打错号码","pos":"фраза"},{"ru":"трубка","zh":"听筒","pos":"сущ."},{"ru":"снова","zh":"再次","pos":"нар."}],"sec":17},{"id":"c6-2d","kind":"dialog","label":"对话","sentences":[{"ru":"Алло, здравствуйте. Это Ли.","zh":"喂，您好。我是李。","who":"А"},{"ru":"Здравствуйте. Слушаю вас.","zh":"您好。请讲。","who":"Б"},{"ru":"Можно Ивана Петровича?","zh":"能找伊万·彼得罗维奇吗？","who":"А"},{"ru":"Его сейчас нет. Что передать?","zh":"他现在不在。要转告什么？","who":"Б"},{"ru":"Передайте, пожалуйста, что звонил Ли.","zh":"请转告他李来过电话。","who":"А"},{"ru":"Хорошо. Он вам перезвонит?","zh":"好。让他给您回电话吗？","who":"Б"},{"ru":"Да, после шести. Мой номер у него есть.","zh":"是的，六点以后。他有我号码。","who":"А"},{"ru":"Записал. Что-то ещё?","zh":"记下了。还有别的事吗？","who":"Б"},{"ru":"Нет, спасибо. Всего доброго.","zh":"没有了，谢谢。祝好。","who":"А"},{"ru":"До свидания.","zh":"再见。","who":"Б"}],"vocab":[{"ru":"алло","zh":"喂（电话）","pos":"感叹词"},{"ru":"здравствуйте","zh":"您好（正式、对多人）","pos":"固定用语"},{"ru":"слушаю","zh":"我在听","pos":"动词（未完成体）"},{"ru":"передать","zh":"转告；转交","pos":"动词（完成体）"},{"ru":"звонить","zh":"打电话","pos":"глаг."},{"ru":"после обеда","zh":"下午","pos":"фраза"}],"sec":31}]},{"id":"c6-3","title":"День рождения","titleZh":"生日与送礼","level":"A2","texts":[{"id":"c6-3","kind":"text","label":"短文","sentences":[{"ru":"В субботу у моего друга был день рождения.","zh":"星期六我朋友过生日。"},{"ru":"Мы собрались в кафе, всего восемь человек.","zh":"我们聚在咖啡馆，一共八个人。"},{"ru":"Я подарил ему книгу о путешествиях.","zh":"我送了他一本关于旅行的书。"},{"ru":"Мы ели пиццу, смеялись и пели песни.","zh":"我们吃披萨、大笑、唱歌。"},{"ru":"Потом хозяйка принесла торт со свечами.","zh":"然后店家端来了插着蜡烛的蛋糕。"},{"ru":"Друг сказал, что это лучший праздник за год.","zh":"朋友说这是一年里最好的聚会。"}],"vocab":[{"ru":"день рождения","zh":"生日","pos":"фраза"},{"ru":"собраться","zh":"聚在一起","pos":"глаг."},{"ru":"подарить","zh":"赠送","pos":"глаг."},{"ru":"смеяться","zh":"笑","pos":"глаг."},{"ru":"свеча","zh":"蜡烛","pos":"сущ."},{"ru":"праздник","zh":"节日、聚会","pos":"сущ."}],"sec":17},{"id":"c6-3d","kind":"dialog","label":"对话","sentences":[{"ru":"С днём рождения! Это тебе.","zh":"生日快乐！这是给你的。","who":"А"},{"ru":"Спасибо! Можно открыть?","zh":"谢谢！能打开吗？","who":"Б"},{"ru":"Конечно, открывай.","zh":"当然，打开吧。","who":"А"},{"ru":"Какая красивая книга! Спасибо большое.","zh":"书真漂亮！太感谢了。","who":"Б"},{"ru":"Я рад, что тебе понравилось.","zh":"你喜欢我很高兴。","who":"А"},{"ru":"Проходи, садись. Сейчас будем пить чай.","zh":"进来坐。我们马上喝茶。","who":"Б"},{"ru":"Я хочу сказать тост.","zh":"我想说句祝酒词。","who":"А"},{"ru":"Давай! Все слушают.","zh":"说吧！大家都在听。","who":"Б"},{"ru":"За твоё здоровье и за твои успехи!","zh":"为你的健康、为你的成功！","who":"А"},{"ru":"Спасибо! Приятно, что ты пришёл.","zh":"谢谢！你能来我很高兴。","who":"Б"}],"vocab":[{"ru":"открыть","zh":"打开；开（户）","pos":"动词（完成体）"},{"ru":"конец света","zh":"世界末日","pos":"固定短语"},{"ru":"красивый","zh":"漂亮的","pos":"形容词"},{"ru":"рад","zh":"高兴的","pos":"прил."},{"ru":"понравиться","zh":"合意、喜欢","pos":"动词（完成体）"},{"ru":"прохожий","zh":"路人","pos":"сущ."}],"sec":31}]},{"id":"c6-4","title":"Праздники и поздравления","titleZh":"节日与祝福","level":"B1","texts":[{"id":"c6-4","kind":"text","label":"短文","sentences":[{"ru":"В России Новый год любят особенно.","zh":"在俄罗斯，人们格外喜欢新年。"},{"ru":"За несколько дней до праздника город украшают.","zh":"节前好几天城市就被装饰起来。"},{"ru":"Все покупают подарки и продукты для стола.","zh":"大家都会买礼物和吃的东西。"},{"ru":"В новогоднюю ночь принято провожать старый год.","zh":"新年夜有送别旧年的习俗。"},{"ru":"Люди звонят друзьям и поздравляют их.","zh":"人们给朋友打电话道贺。"},{"ru":"В полночь можно слышать, как бьют часы.","zh":"午夜可以听到钟声敲响。"}],"vocab":[{"ru":"поздравление","zh":"祝贺","pos":"сущ."},{"ru":"украшать","zh":"装饰","pos":"глаг."},{"ru":"подарок","zh":"礼物","pos":"сущ."},{"ru":"новогодний","zh":"新年的","pos":"прил."},{"ru":"полночь","zh":"午夜","pos":"сущ."},{"ru":"принято","zh":"按习俗","pos":"нар."}],"sec":16},{"id":"c6-4d","kind":"dialog","label":"对话","sentences":[{"ru":"С наступающим Новым годом!","zh":"新年将至，新年快乐！","who":"А"},{"ru":"Спасибо! И тебя тоже. Какие планы?","zh":"谢谢！你也一样。有什么安排？","who":"Б"},{"ru":"Поеду к семье, будем за столом в двенадцать.","zh":"我回家，十二点我们在桌前。","who":"А"},{"ru":"Как у нас принято. А потом салют.","zh":"我们的老规矩。然后放烟花。","who":"Б"},{"ru":"Да, обязательно. С праздником!","zh":"对，一定。节日快乐！","who":"А"},{"ru":"С Восьмым марта, кстати!","zh":"对了，三八节快乐！","who":"Б"},{"ru":"Ой, спасибо! Тебе тоже.","z
